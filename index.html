<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendang Tampel Lauq Quiz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        bubble: ['DynaPuff', 'cursive'],
                    },
                    colors: {
                        brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #0f172a; color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed; min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // KREDENSIAL BARU ANDA
        const SUPABASE_URL = 'https://iktcnbgafhlavgoymykg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JvJbQz4v9DSmJI7UvSII7A_6MLyEtdh';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { useState, useEffect } = React;

        function App() {
            const [session, setSession] = useState(null);
            const [userRole, setUserRole] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [activeQuiz, setActiveQuiz] = useState(null);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    checkUserRole(session?.user);
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    checkUserRole(session?.user);
                });
            }, []);

            const checkUserRole = async (user) => {
                if (!user) { setUserRole(null); setLoading(false); return; }
                
                // Ambil role dari tabel profiles
                const { data } = await supabase.from('profiles').select('role').eq('id', user.id).single();
                if (data && data.role === 'admin') {
                    setUserRole('admin');
                } else if (user.email && !user.email.includes('@peserta.quiz')) {
                    // Fallback jika belum diisi di profiles tapi email asli
                    setUserRole('admin');
                } else {
                    setUserRole('peserta');
                }
                setLoading(false);
            };

            const logout = async () => { await supabase.auth.signOut(); setView('home'); };

            if (loading) return <div className="flex items-center justify-center min-h-screen"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-500"></div></div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="glass-card sticky top-0 z-50 px-4 py-4 mb-6">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-gradient-to-br from-brand-400 to-blue-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                                    <span className="text-white font-bold text-xl font-bubble">Q</span>
                                </div>
                                <div><h1 className="text-2xl md:text-3xl font-bubble text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-blue-300">Lendang Tampel Lauq</h1></div>
                            </div>
                            <div className="flex items-center gap-3">
                                {session ? (
                                    <>
                                        {userRole === 'admin' && <button onClick={() => setView('admin')} className="text-sm bg-purple-600 hover:bg-purple-500 px-3 py-2 rounded-lg font-bold transition">Dashboard Admin</button>}
                                        <button onClick={logout} className="p-2 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/40 transition text-sm font-bold">Keluar</button>
                                    </>
                                ) : (
                                    <button onClick={() => setView('admin_login')} className="text-slate-400 hover:text-white transition text-sm">⚙️ Login Admin</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-6xl mx-auto px-4 pb-12">
                        {!session && view === 'home' && <ParticipantLogin />}
                        {!session && view === 'admin_login' && <AdminLogin setView={setView} />}
                        {session && userRole === 'peserta' && view === 'home' && <ParticipantHome setView={setView} setActiveQuiz={setActiveQuiz} />}
                        {session && userRole === 'peserta' && view === 'quiz_runner' && activeQuiz && <QuizRunner quiz={activeQuiz} setView={setView} user={session.user} />}
                        {session && userRole === 'admin' && <AdminDashboard />}
                    </main>
                </div>
            );
        }

        function ParticipantLogin() {
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true); setError(null);
                const pseudoEmail = `${phone}@peserta.quiz`;
                const pseudoPassword = `LTQ_${phone}_2026`;

                try {
                    let { data, error: signInError } = await supabase.auth.signInWithPassword({ email: pseudoEmail, password: pseudoPassword });
                    if (signInError && signInError.message.includes("Invalid login")) {
                        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                            email: pseudoEmail, password: pseudoPassword,
                            options: { data: { name: name, phone: phone } }
                        });
                        if (signUpError) throw signUpError;
                        
                        // Buat profil otomatis
                        await supabase.from('profiles').upsert({ id: signUpData.user.id, name: name, phone: phone, role: 'peserta' });
                        
                        if (signUpData?.user && !signUpData.session) throw new Error("Fitur 'Confirm Email' masih aktif di Supabase Anda. Matikan di Authentication -> Providers -> Email.");
                    } else if (signInError) throw signInError;
                } catch (err) { setError(err.message); } finally { setLoading(false); }
            };

            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bubble text-white mb-2">Mulai Main!</h2>
                        <p className="text-slate-400">Cukup masukkan Nama & Nomor HP (Tanpa Password)</p>
                    </div>
                    {error && <div className="bg-red-500/20 border border-red-500 text-red-200 p-4 rounded-xl mb-6 text-sm">{error}</div>}
                    <form onSubmit={handleLogin} className="space-y-5">
                        <input type="text" required value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500" placeholder="Nama Lengkap" />
                        <input type="tel" required value={phone} onChange={(e) => setPhone(e.target.value.replace(/\D/g, ''))} className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500" placeholder="Nomor HP (08...)" />
                        <button type="submit" disabled={loading || !name || !phone} className="w-full bg-gradient-to-r from-brand-500 to-blue-600 hover:from-brand-400 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all">
                            {loading ? 'Memproses...' : 'Masuk & Mulai'}
                        </button>
                    </form>
                </div>
            );
        }

        function AdminLogin({ setView }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true); setError(null);
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setError(`Login gagal: ${error.message}`);
                setLoading(false);
            };

            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl border-t-4 border-t-purple-500">
                    <h2 className="text-2xl font-bold text-white mb-6 text-center">Portal Admin Cepat</h2>
                    {error && <div className="bg-red-500/20 border border-red-500 text-red-200 p-4 rounded-xl mb-6 text-sm">{error}</div>}
                    <form onSubmit={handleLogin} className="space-y-5">
                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500" placeholder="Email Admin" />
                        <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500" placeholder="Password Admin" />
                        <button type="submit" disabled={loading} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition">
                            {loading ? 'Authenticating...' : 'Login Admin'}
                        </button>
                        <button type="button" onClick={() => setView('home')} className="w-full text-slate-400 text-sm mt-4 hover:text-white">Kembali</button>
                    </form>
                </div>
            );
        }

        // =====================================
        // DASHBOARD ADMIN (Fitur CMS Lengkap)
        // =====================================
        function AdminDashboard() {
            const [quizzes, setQuizzes] = useState([]);
            const [selectedQuiz, setSelectedQuiz] = useState(null); // Jika null, tampilkan list. Jika ada, tampilkan kelola soal
            
            // Form Kuis Baru
            const [newTitle, setNewTitle] = useState('');
            const [newReward, setNewReward] = useState('');

            useEffect(() => { loadQuizzes(); }, []);

            const loadQuizzes = async () => {
                const { data } = await supabase.from('quizzes').select('*').order('created_at', { ascending: false });
                if (data) setQuizzes(data);
            };

            const handleCreateQuiz = async (e) => {
                e.preventDefault();
                await supabase.from('quizzes').insert({ title: newTitle, reward_amount: newReward || 0, is_active: false });
                setNewTitle(''); setNewReward(''); loadQuizzes();
            };

            const toggleStatus = async (id, currentStatus) => {
                await supabase.from('quizzes').update({ is_active: !currentStatus }).eq('id', id);
                loadQuizzes();
            };

            const deleteQuiz = async (id) => {
                if(confirm("Yakin hapus kuis ini beserta soalnya?")) {
                    await supabase.from('quizzes').delete().eq('id', id);
                    loadQuizzes();
                }
            };

            if (selectedQuiz) return <AdminQuestionManager quiz={selectedQuiz} goBack={() => setSelectedQuiz(null)} />;

            return (
                <div className="glass-card rounded-3xl p-6 md:p-10 border-t-4 border-t-purple-500">
                    <h2 className="text-3xl font-bubble text-white mb-6">Kelola Kuis</h2>
                    
                    {/* Buat Kuis Baru */}
                    <div className="bg-slate-800/50 p-6 rounded-2xl mb-8 border border-slate-700">
                        <h3 className="font-bold text-lg mb-4 text-brand-400">➕ Buat Kuis Baru</h3>
                        <form onSubmit={handleCreateQuiz} className="flex flex-col md:flex-row gap-4">
                            <input type="text" required value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="Judul Kuis" className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white" />
                            <input type="number" required value={newReward} onChange={e => setNewReward(e.target.value)} placeholder="Nominal Hadiah (Rp)" className="w-full md:w-48 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white" />
                            <button type="submit" className="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-xl transition">Simpan Kuis</button>
                        </form>
                    </div>

                    {/* Daftar Kuis */}
                    <div className="space-y-4">
                        {quizzes.map(quiz => (
                            <div key={quiz.id} className="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h4 className="text-xl font-bold text-white flex items-center gap-3">
                                        {quiz.title} 
                                        <span className={`text-xs px-2 py-1 rounded-lg font-bold ${quiz.is_active ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}`}>
                                            {quiz.is_active ? '✅ PUBLIK' : '🔒 DRAFT'}
                                        </span>
                                    </h4>
                                    <p className="text-sm text-slate-400">Hadiah: Rp {quiz.reward_amount}</p>
                                </div>
                                <div className="flex flex-wrap gap-2 w-full md:w-auto">
                                    <button onClick={() => setSelectedQuiz(quiz)} className="flex-1 md:flex-none bg-brand-600 hover:bg-brand-500 text-white px-4 py-2 rounded-lg text-sm font-bold">📝 Kelola Soal</button>
                                    <button onClick={() => toggleStatus(quiz.id, quiz.is_active)} className={`flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-bold ${quiz.is_active ? 'bg-yellow-600 hover:bg-yellow-500 text-white' : 'bg-green-600 hover:bg-green-500 text-white'}`}>
                                        {quiz.is_active ? 'Sembunyikan' : 'Tampilkan'}
                                    </button>
                                    <button onClick={() => deleteQuiz(quiz.id)} className="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold">🗑️ Hapus</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =====================================
        // KELOLA SOAL (Dalam CMS Admin)
        // =====================================
        function AdminQuestionManager({ quiz, goBack }) {
            const [questions, setQuestions] = useState([]);
            const [qText, setQText] = useState('');
            const [optA, setOptA] = useState(''); const [optB, setOptB] = useState('');
            const [optC, setOptC] = useState(''); const [optD, setOptD] = useState('');
            const [correct, setCorrect] = useState('A');

            useEffect(() => { loadQuestions(); }, []);

            const loadQuestions = async () => {
                const { data } = await supabase.from('questions').select('*').eq('quiz_id', quiz.id).order('created_at');
                if(data) setQuestions(data);
            };

            const handleAddQuestion = async (e) => {
                e.preventDefault();
                const correctText = correct === 'A' ? optA : correct === 'B' ? optB : correct === 'C' ? optC : optD;
                await supabase.from('questions').insert({
                    quiz_id: quiz.id, question: qText,
                    option_a: optA, option_b: optB, option_c: optC, option_d: optD,
                    correct_answer: correctText
                });
                setQText(''); setOptA(''); setOptB(''); setOptC(''); setOptD(''); setCorrect('A');
                loadQuestions();
            };

            const deleteQuestion = async (id) => {
                if(confirm("Hapus soal ini?")) { await supabase.from('questions').delete().eq('id', id); loadQuestions(); }
            };

            return (
                <div className="glass-card rounded-3xl p-6 md:p-10 border-t-4 border-t-brand-500">
                    <button onClick={goBack} className="text-slate-400 hover:text-white mb-6 flex items-center gap-2">← Kembali ke Kuis</button>
                    <h2 className="text-2xl font-bold text-white mb-2">Kelola Soal: {quiz.title}</h2>
                    <p className="text-slate-400 mb-8">Total Soal Saat Ini: {questions.length}</p>

                    <div className="bg-slate-800/50 p-6 rounded-2xl mb-8 border border-slate-700">
                        <h3 className="font-bold text-lg mb-4 text-brand-400">➕ Tambah Soal Pilihan Ganda</h3>
                        <form onSubmit={handleAddQuestion} className="space-y-4">
                            <textarea required value={qText} onChange={e=>setQText(e.target.value)} placeholder="Tulis pertanyaan di sini..." className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white h-24"></textarea>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="text-xs text-slate-400 ml-2">Pilihan A</label><input type="text" required value={optA} onChange={e=>setOptA(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white" /></div>
                                <div><label className="text-xs text-slate-400 ml-2">Pilihan B</label><input type="text" required value={optB} onChange={e=>setOptB(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white" /></div>
                                <div><label className="text-xs text-slate-400 ml-2">Pilihan C</label><input type="text" required value={optC} onChange={e=>setOptC(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white" /></div>
                                <div><label className="text-xs text-slate-400 ml-2">Pilihan D</label><input type="text" required value={optD} onChange={e=>setOptD(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white" /></div>
                            </div>
                            <div>
                                <label className="text-sm text-slate-300 font-bold block mb-2">Jawaban Benar:</label>
                                <select value={correct} onChange={e=>setCorrect(e.target.value)} className="bg-slate-900 border border-brand-500 rounded-xl px-4 py-2 text-white font-bold w-full md:w-1/3 outline-none">
                                    <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                                </select>
                            </div>
                            <button type="submit" className="w-full md:w-auto bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-8 rounded-xl transition">Simpan Soal</button>
                        </form>
                    </div>

                    <div className="space-y-4">
                        {questions.map((q, i) => (
                            <div key={q.id} className="bg-slate-800 p-5 rounded-xl border border-slate-700 relative">
                                <button onClick={() => deleteQuestion(q.id)} className="absolute top-4 right-4 text-red-400 hover:text-red-500 font-bold">Hapus</button>
                                <p className="font-bold text-white mb-3">{i+1}. {q.question}</p>
                                <ul className="text-sm text-slate-400 space-y-1">
                                    <li className={q.correct_answer === q.option_a ? "text-green-400 font-bold" : ""}>A. {q.option_a}</li>
                                    <li className={q.correct_answer === q.option_b ? "text-green-400 font-bold" : ""}>B. {q.option_b}</li>
                                    <li className={q.correct_answer === q.option_c ? "text-green-400 font-bold" : ""}>C. {q.option_c}</li>
                                    <li className={q.correct_answer === q.option_d ? "text-green-400 font-bold" : ""}>D. {q.option_d}</li>
                                </ul>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =====================================
        // HALAMAN UTAMA PESERTA (Main Kuis)
        // =====================================
        function ParticipantHome({ setView, setActiveQuiz }) {
            const [quizzes, setQuizzes] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchQuizzes = async () => {
                    const { data } = await supabase.from('quizzes').select('*').eq('is_active', true);
                    if (data) setQuizzes(data);
                    setLoading(false);
                };
                fetchQuizzes();
            }, []);

            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="glass-card rounded-3xl p-8 md:p-12 text-center">
                        <h2 className="text-4xl md:text-5xl font-bubble text-white mb-4 shadow-sm">Uji Pengetahuanmu!</h2>
                        <p className="text-lg text-slate-300">Jawab kuis dengan benar 100% dan raih hadiah pulsa/saldo DANA langsung.</p>
                    </div>

                    <div>
                        <h3 className="text-2xl font-bold mb-6 text-white">🔥 Kuis Tersedia</h3>
                        {loading ? <p className="text-slate-400">Mencari kuis...</p> : quizzes.length === 0 ? (
                            <div className="glass-card p-10 text-center rounded-2xl text-slate-400 border border-slate-700">Belum ada kuis yang aktif saat ini. Coba lagi nanti!</div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {quizzes.map(quiz => (
                                    <div key={quiz.id} className="glass-card rounded-2xl p-6 flex flex-col hover:border-brand-500/50 transition-all hover:shadow-lg hover:-translate-y-1">
                                        <div className="flex justify-between items-start mb-4">
                                            <span className="bg-brand-500/20 text-brand-300 px-3 py-1 rounded-full text-xs font-bold">{quiz.category}</span>
                                            <span className="text-yellow-400 font-bold text-sm bg-yellow-400/10 px-3 py-1 rounded-full">Rp {quiz.reward_amount.toLocaleString()}</span>
                                        </div>
                                        <h4 className="text-xl font-bold mb-4 text-white flex-1">{quiz.title}</h4>
                                        <button onClick={() => { setActiveQuiz(quiz); setView('quiz_runner'); }} className="w-full bg-white text-slate-900 hover:bg-brand-50 font-bold py-3 rounded-xl transition">Mulai Kerjakan 🚀</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // =====================================
        // GAMEPLAY KUIS
        // =====================================
        function QuizRunner({ quiz, setView, user }) {
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [loading, setLoading] = useState(true);
            const [result, setResult] = useState(null);

            useEffect(() => {
                const fetchQ = async () => {
                    const { data } = await supabase.from('questions').select('*').eq('quiz_id', quiz.id).order('created_at');
                    if (data) setQuestions(data);
                    setLoading(false);
                };
                fetchQ();
            }, [quiz.id]);

            const handleSelect = (qId, val) => setAnswers(prev => ({ ...prev, [qId]: val }));

            const handleSubmit = async () => {
                let correctCount = 0;
                questions.forEach(q => { if (answers[q.id] === q.correct_answer) correctCount++; });
                const percentage = Math.round((correctCount / questions.length) * 100);
                
                // Simpan ke DB
                await supabase.from('attempts').insert({ quiz_id: quiz.id, user_id: user.id, score: correctCount, total_points: questions.length, percentage: percentage });
                setResult({ correct: correctCount, total: questions.length, percentage });
            };

            if (loading) return <div className="text-center py-20">Memuat Soal...</div>;
            if (questions.length === 0) return <div className="text-center py-20 text-red-400">Kuis ini belum memiliki soal. <button onClick={()=>setView('home')} className="underline">Kembali</button></div>;

            if (result) {
                return (
                    <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center">
                        <div className="text-6xl mb-4">{result.percentage === 100 ? '🎉' : '💪'}</div>
                        <h2 className="text-3xl font-bubble text-white mb-2">Skor Kamu</h2>
                        <div className="text-5xl font-bold text-brand-400 mb-6">{result.percentage}%</div>
                        
                        {result.percentage === 100 ? (
                            <div className="bg-green-500/20 border border-green-500 p-4 rounded-xl mb-6">
                                <p className="text-green-300 font-bold">Luar Biasa! Benar Semua!</p>
                                <p className="text-sm mt-1">Screenshot ini & berikan ke Admin untuk klaim Rp {quiz.reward_amount}</p>
                            </div>
                        ) : (
                            <p className="text-slate-300 mb-6">Benar {result.correct} dari {result.total}. Coba lagi untuk capai 100%!</p>
                        )}
                        <button onClick={() => setView('home')} className="w-full bg-slate-700 text-white font-bold py-4 rounded-xl">Kembali ke Beranda</button>
                    </div>
                );
            }

            const currentQ = questions[currentIndex];
            return (
                <div className="max-w-2xl mx-auto mt-4">
                    <div className="mb-4 text-slate-400 text-sm font-bold">Soal {currentIndex + 1} dari {questions.length}</div>
                    <div className="glass-card p-6 md:p-10 rounded-3xl mb-6">
                        <h3 className="text-2xl font-bold text-white mb-8">{currentQ.question}</h3>
                        <div className="space-y-3">
                            {['option_a', 'option_b', 'option_c', 'option_d'].map((optKey, idx) => {
                                const val = currentQ[optKey];
                                const isSelected = answers[currentQ.id] === val;
                                return (
                                    <button key={idx} onClick={() => handleSelect(currentQ.id, val)}
                                        className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-center gap-4 ${isSelected ? 'border-brand-500 bg-brand-500/20' : 'border-slate-700 bg-slate-800/50 hover:border-slate-500'}`}>
                                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isSelected ? 'border-brand-400' : 'border-slate-500'}`}>
                                            {isSelected && <div className="w-3 h-3 bg-brand-400 rounded-full"></div>}
                                        </div>
                                        <span className="text-lg text-white">{val}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <button onClick={() => setCurrentIndex(p => Math.max(0, p - 1))} disabled={currentIndex === 0} className="px-6 py-3 rounded-xl font-bold bg-slate-800 text-slate-300 disabled:opacity-50">Sebelumnnya</button>
                        {currentIndex === questions.length - 1 ? (
                            <button onClick={handleSubmit} disabled={!answers[currentQ.id]} className="flex-1 px-6 py-3 rounded-xl font-bold bg-green-600 text-white disabled:opacity-50">Selesai & Cek Hasil</button>
                        ) : (
                            <button onClick={() => setCurrentIndex(p => Math.min(questions.length - 1, p + 1))} disabled={!answers[currentQ.id]} className="flex-1 px-6 py-3 rounded-xl font-bold bg-brand-600 text-white disabled:opacity-50">Lanjut</button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
