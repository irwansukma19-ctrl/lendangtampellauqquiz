        const AdminQuizzes = () => {
            const { supabase, showToast } = useContext(AppContext);
            const [quizzes, setQuizzes] = useState([]);
            const [view, setView] = useState('list'); // 'list', 'edit_quiz', 'manage_questions'
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [loading, setLoading] = useState(false);

            // Form States for Quiz
            const [qForm, setQForm] = useState({ title: '', description: '', category: '', reward_amount: 25000, reward_type: 'Pilihan Ganda', duration: 60, max_attempts: 3, thumbnail_url: '' });
            
            // Form States for Questions
            const [questions, setQuestions] = useState([]);
            const [qtnForm, setQtnForm] = useState({ question: '', question_type: 'mcq', option_a: '', option_b: '', option_c: '', option_d: '', correct_answer: 'A', points: 10, requires_photo: false });
            const [editingQtnId, setEditingQtnId] = useState(null);

            useEffect(() => { 
                if(view === 'list') load();
                setTimeout(() => lucide.createIcons(), 100);
            }, [view]);

            const load = async () => {
                const {data} = await supabase.from('quizzes').select('*').order('created_at', {ascending: false});
                setQuizzes(data||[]);
            };

            const toggleStatus = async (id, current) => {
                await supabase.from('quizzes').update({is_active: !current}).eq('id', id);
                load();
            };

            const handleDeleteQuiz = async (id) => {
                if(!confirm("Yakin ingin menghapus kuis ini? Semua soal, riwayat, dan jawaban peserta terkait akan ikut terhapus permanen.")) return;
                await supabase.from('quizzes').delete().eq('id', id);
                showToast("Kuis berhasil dihapus.");
                load();
            };

            const openQuizForm = (quiz = null) => {
                if (quiz) {
                    setQForm(quiz);
                    setActiveQuiz(quiz.id);
                } else {
                    setQForm({ title: '', description: '', category: '', reward_amount: 25000, reward_type: 'Pilihan Ganda', duration: 60, max_attempts: 3, thumbnail_url: '' });
                    setActiveQuiz(null);
                }
                setView('edit_quiz');
            };

            const saveQuiz = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (activeQuiz) {
                        const {error} = await supabase.from('quizzes').update(qForm).eq('id', activeQuiz);
                        if (error) throw error;
                        showToast("Kuis berhasil diperbarui");
                    } else {
                        const {error} = await supabase.from('quizzes').insert(qForm);
                        if (error) throw error;
                        showToast("Kuis baru berhasil ditambahkan");
                    }
                    setView('list');
                } catch(err) { showToast(err.message, 'error'); }
                setLoading(false);
            };

            const openQuestions = async (quiz) => {
                setActiveQuiz(quiz);
                setView('manage_questions');
                loadQuestions(quiz.id);
            };

            const loadQuestions = async (quizId) => {
                const {data} = await supabase.from('questions').select('*').eq('quiz_id', quizId).order('created_at');
                setQuestions(data||[]);
                resetQtnForm();
            };

            const resetQtnForm = () => {
                setQtnForm({ question: '', question_type: 'mcq', option_a: '', option_b: '', option_c: '', option_d: '', correct_answer: 'A', points: 10, requires_photo: false });
                setEditingQtnId(null);
            };

            const saveQuestion = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const payload = { ...qtnForm, quiz_id: activeQuiz.id };
                    // Reset MCQ fields if it's an essay
                    if (payload.question_type === 'essay') {
                        payload.option_a = null; payload.option_b = null; payload.option_c = null; payload.option_d = null; payload.correct_answer = null;
                    }
                    
                    if (editingQtnId) {
                        const {error} = await supabase.from('questions').update(payload).eq('id', editingQtnId);
                        if(error) throw error;
                        showToast("Soal berhasil diperbarui");
                    } else {
                        const {error} = await supabase.from('questions').insert(payload);
                        if(error) throw error;
                        showToast("Soal berhasil ditambahkan");
                    }
                    loadQuestions(activeQuiz.id);
                } catch(err) { showToast(err.message, 'error'); }
                setLoading(false);
            };

            const handleDeleteQtn = async (id) => {
                if(!confirm("Hapus soal ini?")) return;
                await supabase.from('questions').delete().eq('id', id);
                showToast("Soal dihapus");
                loadQuestions(activeQuiz.id);
            };

            const handleEditQtn = (q) => {
                // Ensure null values from db don't break controlled inputs
                setQtnForm({
                    question: q.question || '',
                    question_type: q.question_type || 'mcq',
                    option_a: q.option_a || '',
                    option_b: q.option_b || '',
                    option_c: q.option_c || '',
                    option_d: q.option_d || '',
                    correct_answer: q.correct_answer || 'A',
                    points: q.points || 10,
                    requires_photo: q.requires_photo || false
                });
                setEditingQtnId(q.id);
                window.scrollTo(0, 0);
            };

            if (view === 'list') {
                return (
                    <div className="animate-fade-in">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-2xl font-bold text-white">Kelola Kuis</h3>
                            <Button onClick={() => openQuizForm()} className="text-sm shadow-brand-500/20 shadow-lg"><i data-lucide="plus" className="w-4 h-4"></i> Buat Kuis Baru</Button>
                        </div>
                        <div className="overflow-x-auto rounded-xl border border-slate-700/50">
                            <table className="w-full text-left text-sm">
                                <thead className="text-slate-400 bg-slate-900/80">
                                    <tr><th className="p-4 font-medium">Judul Kuis</th><th className="p-4 font-medium">Hadiah</th><th className="p-4 font-medium text-center">Status</th><th className="p-4 font-medium text-right">Aksi</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800 bg-slate-900/30">
                                    {quizzes.map(q => (
                                        <tr key={q.id} className="hover:bg-slate-800/30 transition-colors">
                                            <td className="p-4 text-white font-medium">
                                                {q.title}
                                                <div className="text-xs text-slate-500 mt-1">{q.category || 'Umum'} • {q.duration} Menit</div>
                                            </td>
                                            <td className="p-4 text-emerald-400 font-semibold">{formatRupiah(q.reward_amount)}</td>
                                            <td className="p-4 text-center">
                                                <button onClick={()=>toggleStatus(q.id, q.is_active)} className={`px-3 py-1 rounded-full text-xs font-bold transition-all ${q.is_active?'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30':'bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700'}`}>
                                                    {q.is_active ? 'AKTIF' : 'DRAFT'}
                                                </button>
                                            </td>
                                            <td className="p-4">
                                                <div className="flex justify-end gap-2">
                                                    <Button variant="primary" onClick={()=>openQuestions(q)} className="py-1.5 px-3 text-xs">Kelola Soal</Button>
                                                    <Button variant="secondary" onClick={()=>openQuizForm(q)} className="py-1.5 px-3 text-xs"><i data-lucide="edit" className="w-3.5 h-3.5"></i></Button>
                                                    <Button variant="danger" onClick={()=>handleDeleteQuiz(q.id)} className="py-1.5 px-3 text-xs"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></Button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                    {quizzes.length === 0 && <tr><td colSpan="4" className="text-center p-8 text-slate-500">Belum ada kuis yang dibuat. Silakan klik "Buat Kuis Baru".</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            if (view === 'edit_quiz') {
                return (
                    <div className="animate-fade-in">
                        <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-700/50">
                            <button onClick={()=>setView('list')} className="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors"><i data-lucide="arrow-left" className="w-4 h-4"></i></button>
                            <h3 className="text-2xl font-bold text-white">{activeQuiz ? 'Edit Pengaturan Kuis' : 'Buat Kuis Baru'}</h3>
                        </div>
                        <form onSubmit={saveQuiz} className="space-y-5 max-w-3xl bg-slate-900/40 p-6 md:p-8 rounded-2xl border border-slate-700/50">
                            <Input label="Judul Kuis" value={qForm.title} onChange={e=>setQForm({...qForm, title: e.target.value})} placeholder="Contoh: Kuis Sejarah Indonesia" required />
                            
                            <div className="flex flex-col gap-1.5">
                                <label className="text-sm font-medium text-slate-400">Deskripsi Singkat</label>
                                <textarea value={qForm.description} onChange={e=>setQForm({...qForm, description: e.target.value})} placeholder="Jelaskan tentang kuis ini..." className="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 min-h-[100px]"></textarea>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <Input label="Kategori" value={qForm.category} onChange={e=>setQForm({...qForm, category: e.target.value})} placeholder="Umum, Sains, Hiburan..." />
                                <Input label="Durasi Pengerjaan (Menit)" type="number" value={qForm.duration} onChange={e=>setQForm({...qForm, duration: e.target.value})} required />
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <Input label="Nominal Hadiah (Rp)" type="number" value={qForm.reward_amount} onChange={e=>setQForm({...qForm, reward_amount: e.target.value})} required />
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-sm font-medium text-slate-400">Batas Maksimal Percobaan (Per User)</label>
                                    <input type="number" value={qForm.max_attempts} onChange={e=>setQForm({...qForm, max_attempts: e.target.value})} className="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500" required />
                                </div>
                            </div>
                            
                            <Input label="URL Thumbnail (Link Gambar - Opsional)" value={qForm.thumbnail_url} onChange={e=>setQForm({...qForm, thumbnail_url: e.target.value})} placeholder="https://..." />
                            
                            <div className="flex justify-end gap-3 mt-8 pt-6 border-t border-slate-800">
                                <Button type="button" variant="secondary" onClick={()=>setView('list')}>Batal</Button>
                                <Button type="submit" variant="primary" disabled={loading} className="px-8">{loading ? 'Menyimpan...' : 'Simpan Kuis'}</Button>
                            </div>
                        </form>
                    </div>
                )
            }

            if (view === 'manage_questions') {
                return (
                    <div className="animate-fade-in">
                        <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-700/50">
                            <button onClick={()=>setView('list')} className="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors"><i data-lucide="arrow-left" className="w-4 h-4"></i></button>
                            <div>
                                <h3 className="text-2xl font-bold text-white leading-tight">Kelola Soal</h3>
                                <p className="text-brand-400 text-sm font-medium">{activeQuiz?.title}</p>
                            </div>
                        </div>

                        {/* Form Editor Soal */}
                        <form onSubmit={saveQuestion} className="mb-10 bg-gradient-to-br from-slate-800/80 to-slate-900/80 p-6 md:p-8 rounded-2xl border border-brand-500/30 shadow-[0_0_30px_rgba(99,102,241,0.05)] relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-brand-500/10 rounded-full blur-3xl"></div>
                            
                            <h4 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                                <i data-lucide={editingQtnId ? "edit" : "plus-circle"} className="text-brand-400 w-5 h-5"></i> 
                                {editingQtnId ? 'Edit Soal' : 'Tambah Soal Baru'}
                            </h4>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5 relative z-10">
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-sm font-medium text-slate-300">Tipe Pertanyaan</label>
                                    <select value={qtnForm.question_type} onChange={e=>setQtnForm({...qtnForm, question_type: e.target.value})} className="bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-brand-500 focus:outline-none">
                                        <option value="mcq">Pilihan Ganda (Otomatis Dinilai)</option>
                                        <option value="essay">Essay (Dinilai Manual)</option>
                                    </select>
                                </div>
                                <Input label="Poin (Bobot Nilai)" type="number" value={qtnForm.points} onChange={e=>setQtnForm({...qtnForm, points: e.target.value})} required />
                                <div className="flex items-center gap-3 mt-6 bg-slate-900/50 p-3 rounded-xl border border-slate-700/80 hover:border-brand-500/50 transition-colors">
                                    <input type="checkbox" id="req_photo" checked={qtnForm.requires_photo} onChange={e=>setQtnForm({...qtnForm, requires_photo: e.target.checked})} className="w-5 h-5 accent-brand-500 rounded cursor-pointer" />
                                    <label htmlFor="req_photo" className="text-sm font-medium text-white cursor-pointer select-none">Wajib Upload Foto Bukti?</label>
                                </div>
                            </div>

                            <div className="flex flex-col gap-1.5 mb-6 relative z-10">
                                <label className="text-sm font-medium text-slate-300">Pertanyaan</label>
                                <textarea value={qtnForm.question} onChange={e=>setQtnForm({...qtnForm, question: e.target.value})} required placeholder="Tuliskan pertanyaan di sini..." className="bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 min-h-[100px]"></textarea>
                            </div>

                            {/* Khusus Pilihan Ganda */}
                            {qtnForm.question_type === 'mcq' && (
                                <div className="bg-slate-900/60 p-5 rounded-xl border border-slate-700/80 mb-6 relative z-10">
                                    <h5 className="text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider">Opsi Jawaban Pilihan Ganda</h5>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                                        <Input label="Opsi A" value={qtnForm.option_a} onChange={e=>setQtnForm({...qtnForm, option_a: e.target.value})} required={qtnForm.question_type === 'mcq'} />
                                        <Input label="Opsi B" value={qtnForm.option_b} onChange={e=>setQtnForm({...qtnForm, option_b: e.target.value})} required={qtnForm.question_type === 'mcq'} />
                                        <Input label="Opsi C" value={qtnForm.option_c} onChange={e=>setQtnForm({...qtnForm, option_c: e.target.value})} required={qtnForm.question_type === 'mcq'} />
                                        <Input label="Opsi D" value={qtnForm.option_d} onChange={e=>setQtnForm({...qtnForm, option_d: e.target.value})} required={qtnForm.question_type === 'mcq'} />
                                    </div>
                                    <div className="flex items-center gap-4 bg-emerald-500/10 p-4 rounded-xl border border-emerald-500/20">
                                        <label className="text-sm font-bold text-emerald-400 w-32 shrink-0"><i data-lucide="check-circle" className="w-4 h-4 inline mb-0.5"></i> Kunci Jawaban</label>
                                        <select value={qtnForm.correct_answer} onChange={e=>setQtnForm({...qtnForm, correct_answer: e.target.value})} className="flex-grow bg-slate-900 border border-emerald-500/50 rounded-lg px-4 py-2.5 text-white font-bold focus:outline-none focus:border-emerald-400">
                                            <option value="A">Opsi A</option>
                                            <option value="B">Opsi B</option>
                                            <option value="C">Opsi C</option>
                                            <option value="D">Opsi D</option>
                                        </select>
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-end gap-3 relative z-10">
                                {editingQtnId && <Button type="button" variant="secondary" onClick={resetQtnForm}>Batal Edit</Button>}
                                <Button type="submit" variant="primary" disabled={loading} className="px-8 shadow-lg shadow-brand-500/20">{loading ? 'Menyimpan...' : (editingQtnId ? 'Update Soal' : 'Simpan Soal Baru')}</Button>
                            </div>
                        </form>

                        {/* List Soal Terdaftar */}
                        <div>
                            <h4 className="font-bold text-white text-xl mb-4 border-b border-slate-700/50 pb-2">Daftar Soal ({questions.length})</h4>
                            <div className="space-y-4">
                                {questions.map((q, i) => (
                                    <div key={q.id} className="bg-slate-900/40 p-5 rounded-2xl border border-slate-700/50 flex flex-col md:flex-row gap-6 hover:border-slate-600 transition-colors">
                                        <div className="flex-grow">
                                            <div className="flex flex-wrap items-center gap-2 mb-3">
                                                <span className="bg-brand-600 text-white text-xs px-2.5 py-1 rounded-lg font-bold">Soal {i+1}</span>
                                                <span className={`text-xs px-2.5 py-1 rounded-lg font-bold uppercase tracking-wide border ${q.question_type==='mcq'?'bg-blue-500/10 text-blue-400 border-blue-500/20':'bg-amber-500/10 text-amber-400 border-amber-500/20'}`}>
                                                    {q.question_type === 'mcq' ? 'Pilihan Ganda' : 'Essay'}
                                                </span>
                                                <span className="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg font-medium border border-slate-700">Poin: {q.points}</span>
                                                {q.requires_photo && <span className="text-xs bg-purple-500/10 text-purple-400 px-2.5 py-1 rounded-lg font-bold border border-purple-500/20"><i data-lucide="camera" className="w-3 h-3 inline mr-1"></i>Wajib Foto</span>}
                                            </div>
                                            <div className="text-white text-lg font-medium mb-3 bg-slate-800/50 p-3 rounded-xl">{q.question}</div>
                                            
                                            {q.question_type === 'mcq' && (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
                                                    <div className={`p-2 rounded-lg border ${q.correct_answer === 'A' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 font-medium' : 'bg-slate-900/50 border-slate-800 text-slate-400'}`}>A. {q.option_a}</div>
                                                    <div className={`p-2 rounded-lg border ${q.correct_answer === 'B' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 font-medium' : 'bg-slate-900/50 border-slate-800 text-slate-400'}`}>B. {q.option_b}</div>
                                                    <div className={`p-2 rounded-lg border ${q.correct_answer === 'C' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 font-medium' : 'bg-slate-900/50 border-slate-800 text-slate-400'}`}>C. {q.option_c}</div>
                                                    <div className={`p-2 rounded-lg border ${q.correct_answer === 'D' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 font-medium' : 'bg-slate-900/50 border-slate-800 text-slate-400'}`}>D. {q.option_d}</div>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex md:flex-col gap-2 shrink-0 md:w-32">
                                            <Button variant="secondary" onClick={()=>handleEditQtn(q)} className="flex-1 text-sm"><i data-lucide="edit-2" className="w-4 h-4"></i> Edit</Button>
                                            <Button variant="danger" onClick={()=>handleDeleteQtn(q.id)} className="flex-1 text-sm"><i data-lucide="trash-2" className="w-4 h-4"></i> Hapus</Button>
                                        </div>
                                    </div>
                                ))}
                                {questions.length === 0 && (
                                    <div className="text-center py-10 bg-slate-900/30 rounded-2xl border border-slate-800 border-dashed">
                                        <i data-lucide="file-question" className="w-12 h-12 mx-auto text-slate-600 mb-3"></i>
                                        <p className="text-slate-400 font-medium">Belum ada soal untuk kuis ini.</p>
                                        <p className="text-slate-500 text-sm mt-1">Gunakan form di atas untuk mulai menambahkan soal pertama Anda.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )
            }
        }

        const AdminReview = () => {
            const { supabase, profile, showToast } = useContext(AppContext);
            const [pendingAnswers, setPendingAnswers] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadPending();
            }, []);

            const loadPending = async () => {
                const { data } = await supabase.from('answers')
                    .select('*, attempts(user_id, profiles(name)), questions(question, question_type, reference_answer, points, requires_photo)')
                    .eq('review_status', 'pending')
                    .order('created_at', { ascending: false });
                setPendingAnswers(data || []);
                setLoading(false);
                setTimeout(() => lucide.createIcons(), 100);
            };

            const handleReview = async (answerId, isCorrect, adminNote, attemptId, pointsAwarded) => {
                try {
                    const { error } = await supabase.from('answers').update({
                        is_correct: isCorrect,
                        points_awarded: isCorrect ? pointsAwarded : 0,
                        admin_note: adminNote,
                        review_status: 'reviewed',
                        reviewed_by: profile.id,
                        reviewed_at: new Date().toISOString()
                    }).eq('id', answerId);
                    
                    if (error) throw error;
                    
                    showToast("Jawaban berhasil direview");
                    
                    // Recalculate Attempt Score
                    const { data: attemptData } = await supabase.from('attempts').select('total_points, score').eq('id', attemptId).single();
                    const newScore = attemptData.score + (isCorrect ? pointsAwarded : 0);
                    const newPercentage = attemptData.total_points > 0 ? (newScore / attemptData.total_points) * 100 : 0;
                    
                    const { count: pendingCount } = await supabase.from('answers').select('id', { count: 'exact', head: true }).eq('attempt_id', attemptId).eq('review_status', 'pending');
                    
                    const updatePayload = {
                        score: newScore,
                        percentage: newPercentage
                    };
                    if (pendingCount === 0) updatePayload.status = 'completed';
                    
                    await supabase.from('attempts').update(updatePayload).eq('id', attemptId);
                    
                    loadPending();
                } catch(err) {
                    showToast(err.message, 'error');
                }
            };

            if (loading) return <div className="text-center py-10"><div className="loader"></div></div>;

            return (
                <div className="animate-fade-in">
                    <h3 className="text-2xl font-bold text-white mb-6">Pemeriksaan Essay & Foto</h3>
                    
                    {pendingAnswers.length === 0 ? (
                        <div className="text-center p-10 bg-slate-900/30 rounded-2xl border border-slate-700/50">
                            <i data-lucide="check-circle" className="w-12 h-12 text-emerald-500 mx-auto mb-3"></i>
                            <p className="text-slate-400 font-medium">Semua jawaban telah diperiksa. Tidak ada antrean.</p>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            {pendingAnswers.map(ans => (
                                <ReviewCard key={ans.id} ans={ans} onReview={handleReview} />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const ReviewCard = ({ ans, onReview }) => {
            const [note, setNote] = useState('');
            const q = ans.questions;
            const user = ans.attempts?.profiles?.name || 'Unknown User';

            return (
                <div className="bg-slate-900/50 p-6 rounded-2xl border border-slate-700/50">
                    <div className="flex justify-between items-start mb-4">
                        <div>
                            <div className="text-xs text-brand-400 font-bold mb-1 uppercase tracking-wider">{user}</div>
                            <h4 className="text-lg font-medium text-white">{q.question}</h4>
                        </div>
                        <div className="text-sm font-bold text-slate-400 bg-slate-800 px-3 py-1 rounded-lg">Poin Max: {q.points}</div>
                    </div>
                    
                    <div className="space-y-4 mb-6">
                        {q.question_type === 'essay' && (
                            <div className="bg-slate-800 p-4 rounded-xl">
                                <div className="text-xs text-slate-500 mb-1">Jawaban Peserta:</div>
                                <div className="text-white whitespace-pre-wrap">{ans.answer_text || <span className="italic text-slate-500">Tidak ada teks</span>}</div>
                            </div>
                        )}
                        
                        {q.reference_answer && (
                            <div className="bg-emerald-900/20 p-4 rounded-xl border border-emerald-500/20">
                                <div className="text-xs text-emerald-500 mb-1">Referensi Jawaban Admin:</div>
                                <div className="text-emerald-100 whitespace-pre-wrap">{q.reference_answer}</div>
                            </div>
                        )}
                        
                        {ans.photo_url && (
                            <div>
                                <div className="text-xs text-slate-500 mb-1">Foto Bukti:</div>
                                <a href={ans.photo_url} target="_blank" rel="noreferrer">
                                    <img src={ans.photo_url} className="w-full max-w-sm rounded-xl border border-slate-700 hover:opacity-80 transition-opacity" alt="Bukti" />
                                </a>
                            </div>
                        )}
                    </div>

                    <div className="flex flex-col md:flex-row gap-4 border-t border-slate-700 pt-4">
                        <input type="text" value={note} onChange={e=>setNote(e.target.value)} placeholder="Catatan (Opsional)" className="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-brand-500" />
                        <div className="flex gap-2 shrink-0">
                            <Button variant="danger" onClick={()=>onReview(ans.id, false, note, ans.attempt_id, q.points)}>Salah (0 Poin)</Button>
                            <Button variant="success" onClick={()=>onReview(ans.id, true, note, ans.attempt_id, q.points)}>Benar ({q.points} Poin)</Button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminRewards = () => {
            const { supabase, showToast } = useContext(AppContext);
            const [rewards, setRewards] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadRewards();
            }, []);

            const loadRewards = async () => {
                const { data } = await supabase.from('rewards')
                    .select('*, quizzes(title), profiles(name)')
                    .order('created_at', { ascending: false });
                setRewards(data || []);
                setLoading(false);
                setTimeout(() => lucide.createIcons(), 100);
            };

            const updateStatus = async (id, status) => {
                try {
                    const { error } = await supabase.from('rewards').update({ status, processed_at: new Date().toISOString() }).eq('id', id);
                    if (error) throw error;
                    showToast(`Status diubah menjadi ${status}`);
                    loadRewards();
                } catch(err) { showToast(err.message, 'error'); }
            };

            if (loading) return <div className="text-center py-10"><div className="loader"></div></div>;

            return (
                <div className="animate-fade-in">
                    <h3 className="text-2xl font-bold text-white mb-6">Kelola Klaim Hadiah</h3>
                    <div className="overflow-x-auto rounded-xl border border-slate-700/50">
                        <table className="w-full text-left text-sm">
                            <thead className="text-slate-400 bg-slate-900/80">
                                <tr>
                                    <th className="p-4 font-medium">Tanggal / Peserta</th>
                                    <th className="p-4 font-medium">Detail Hadiah</th>
                                    <th className="p-4 font-medium">Status</th>
                                    <th className="p-4 font-medium text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800 bg-slate-900/30">
                                {rewards.map(r => (
                                    <tr key={r.id} className="hover:bg-slate-800/30 transition-colors">
                                        <td className="p-4">
                                            <div className="font-bold text-white mb-1">{r.profiles?.name}</div>
                                            <div className="text-xs text-slate-500">{formatDate(r.created_at)}</div>
                                            <div className="text-xs text-brand-400 truncate max-w-[200px] mt-1">{r.quizzes?.title}</div>
                                        </td>
                                        <td className="p-4">
                                            <div className="font-bold text-emerald-400 mb-1">{formatRupiah(r.amount)}</div>
                                            <div className="text-xs text-white">
                                                <span className="bg-slate-800 px-2 py-0.5 rounded mr-1">{r.reward_type}</span>
                                                {r.recipient_number}
                                            </div>
                                            {r.recipient_name && <div className="text-xs text-slate-400 mt-1">A.N: {r.recipient_name}</div>}
                                        </td>
                                        <td className="p-4">
                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold uppercase ${
                                                r.status === 'completed' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                                                r.status === 'processing' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                                r.status === 'rejected' ? 'bg-red-500/20 text-red-400 border border-red-500/30' :
                                                'bg-slate-700 text-slate-300 border border-slate-600'
                                            }`}>{r.status}</span>
                                        </td>
                                        <td className="p-4">
                                            <div className="flex justify-end gap-2">
                                                {r.status === 'pending' && (
                                                    <Button variant="secondary" onClick={()=>updateStatus(r.id, 'processing')} className="py-1.5 px-3 text-xs">Proses</Button>
                                                )}
                                                {(r.status === 'pending' || r.status === 'processing') && (
                                                    <Button variant="primary" onClick={()=>updateStatus(r.id, 'completed')} className="py-1.5 px-3 text-xs bg-emerald-600 hover:bg-emerald-500">Selesai</Button>
                                                )}
                                                {r.status !== 'rejected' && r.status !== 'completed' && (
                                                    <Button variant="danger" onClick={()=>updateStatus(r.id, 'rejected')} className="py-1.5 px-3 text-xs">Tolak</Button>
                                                )}
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                                {rewards.length === 0 && <tr><td colSpan="4" className="text-center p-8 text-slate-500">Belum ada klaim hadiah.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
