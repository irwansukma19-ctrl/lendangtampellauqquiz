<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendang Tampel Lauq Quiz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], bubble: ['DynaPuff', 'cursive'] },
                    colors: { brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' } },
                    animation: { 'marquee': 'marquee 15s linear infinite' },
                    keyframes: { marquee: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(-100%)' } } }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #0f172a; color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed; min-height: 100vh;
        }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://iktcnbgafhlavgoymykg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JvJbQz4v9DSmJI7UvSII7A_6MLyEtdh';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { useState, useEffect, useRef } = React;

        function App() {
            const [session, setSession] = useState(null);
            const [userRole, setUserRole] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [userName, setUserName] = useState('');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    checkUserRole(session?.user);
                });

                const { data: authListener } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    checkUserRole(session?.user);
                });
                return () => { authListener.subscription.unsubscribe(); };
            }, []);

            const checkUserRole = async (user) => {
                if (!user) { setUserRole(null); setLoading(false); return; }
                const { data } = await supabase.from('profiles').select('role, name').eq('id', user.id).single();
                if (data) {
                    setUserName(data.name);
                    setUserRole(data.role);
                } else if (user.email && !user.email.includes('@peserta.quiz')) {
                    setUserRole('admin'); setUserName('Admin');
                } else {
                    setUserRole('peserta');
                }
                setLoading(false);
            };

            const logout = async () => { await supabase.auth.signOut(); setView('home'); };

            if (loading) return <div className="flex items-center justify-center min-h-screen"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-500"></div></div>;

            return (
                <div className="min-h-screen flex flex-col">
                    {/* LIVE CHAT NOTIFICATION BAR */}
                    {session && <LiveChatBar session={session} userName={userName} />}

                    <header className={`glass-card sticky ${session ? 'top-10' : 'top-0'} z-40 px-4 py-4 mb-6 transition-all`}>
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-gradient-to-br from-brand-400 to-blue-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                                    <span className="text-white font-bold text-xl font-bubble">Q</span>
                                </div>
                                <div><h1 className="text-2xl md:text-3xl font-bubble text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-blue-300">Lendang Tampel Lauq</h1></div>
                            </div>
                            <div className="flex items-center gap-3">
                                {session ? (
                                    <>
                                        {userRole === 'admin' && <button onClick={() => setView('admin')} className="text-sm bg-purple-600 hover:bg-purple-500 px-3 py-2 rounded-lg font-bold transition">Admin</button>}
                                        {userRole === 'peserta' && <button onClick={() => setView('leaderboard')} className="text-sm bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-2 rounded-lg font-bold transition">🏆 Skor</button>}
                                        <button onClick={logout} className="p-2 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/40 transition text-sm font-bold">Keluar</button>
                                    </>
                                ) : (
                                    <button onClick={() => setView('admin_login')} className="text-slate-400 hover:text-white transition text-sm">⚙️ Login Admin</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-6xl mx-auto px-4 pb-12">
                        {!session && view === 'home' && <ParticipantLogin />}
                        {!session && view === 'admin_login' && <AdminLogin setView={setView} />}
                        {session && userRole === 'peserta' && view === 'home' && <ParticipantHome setView={setView} setActiveQuiz={setActiveQuiz} />}
                        {session && userRole === 'peserta' && view === 'quiz_runner' && activeQuiz && <QuizRunner quiz={activeQuiz} setView={setView} user={session.user} userName={userName} />}
                        {session && view === 'leaderboard' && <Leaderboard />}
                        {session && userRole === 'admin' && <AdminDashboard />}
                    </main>
                </div>
            );
        }

        // =====================================
        // KOMPONEN: LIVE CHAT (Lebah Tersenyum)
        // =====================================
        function LiveChatBar({ session, userName }) {
            const [messages, setMessages] = useState([]);
            const [isOpen, setIsOpen] = useState(false);
            const [newMsg, setNewMsg] = useState('');
            const chatEndRef = useRef(null);

            useEffect(() => {
                const fetchChats = async () => {
                    const { data } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(20);
                    if (data) setMessages(data.reverse());
                };
                fetchChats();

                const channel = supabase.channel('realtime-chat')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
                        setMessages(prev => [...prev, payload.new]);
                    }).subscribe();

                return () => { supabase.removeChannel(channel); };
            }, []);

            useEffect(() => { if (isOpen) chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, isOpen]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!newMsg.trim()) return;
                await supabase.from('chat_messages').insert({ user_id: session.user.id, user_name: userName, message: newMsg });
                setNewMsg('');
            };

            const latestMsg = messages[messages.length - 1];

            return (
                <>
                    {/* Top Notification Bar */}
                    <div className="fixed top-0 left-0 w-full bg-gradient-to-r from-yellow-400 to-yellow-500 text-slate-900 z-50 h-10 flex items-center px-4 cursor-pointer shadow-lg" onClick={() => setIsOpen(!isOpen)}>
                        <div className="flex items-center gap-2 w-full overflow-hidden whitespace-nowrap">
                            <span className="text-xl animate-bounce">🐝</span>
                            <span className="font-bold text-sm bg-black/10 px-2 py-0.5 rounded-md">Live Chat</span>
                            <div className="flex-1 overflow-hidden relative h-full flex items-center">
                                {latestMsg ? (
                                    <p className="text-sm font-semibold truncate animate-pulse">
                                        {latestMsg.user_name}: <span className="font-normal">{latestMsg.message}</span>
                                    </p>
                                ) : (
                                    <p className="text-sm">Jadilah yang pertama mengirim pesan!</p>
                                )}
                            </div>
                            <span className="text-xs font-bold bg-white/30 px-2 py-1 rounded">Buka Obrolan</span>
                        </div>
                    </div>

                    {/* Chat Modal */}
                    {isOpen && (
                        <div className="fixed top-12 left-1/2 transform -translate-x-1/2 w-[90%] max-w-md bg-slate-900 border-2 border-yellow-400 rounded-2xl shadow-2xl z-50 overflow-hidden flex flex-col" style={{height: '60vh'}}>
                            <div className="bg-yellow-400 p-3 flex justify-between items-center text-slate-900">
                                <h3 className="font-bold flex items-center gap-2"><span className="text-2xl">🐝</span> Obrolan Publik</h3>
                                <button onClick={() => setIsOpen(false)} className="font-bold text-xl hover:text-white">&times;</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3 chat-scroll">
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex flex-col ${m.user_id === session.user.id ? 'items-end' : 'items-start'}`}>
                                        <span className="text-[10px] text-slate-400 mb-0.5">{m.user_name}</span>
                                        <div className={`px-3 py-2 rounded-xl max-w-[80%] text-sm ${m.user_id === session.user.id ? 'bg-brand-500 text-white rounded-tr-none' : 'bg-slate-700 text-white rounded-tl-none'}`}>
                                            {m.message}
                                        </div>
                                    </div>
                                ))}
                                <div ref={chatEndRef} />
                            </div>
                            <form onSubmit={sendMessage} className="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
                                <input type="text" value={newMsg} onChange={e=>setNewMsg(e.target.value)} placeholder="Tulis pesan..." className="flex-1 bg-slate-900 rounded-lg px-3 py-2 text-white text-sm outline-none focus:border-yellow-400 border border-transparent" />
                                <button type="submit" className="bg-yellow-400 text-slate-900 px-4 py-2 rounded-lg font-bold text-sm hover:bg-yellow-300">Kirim</button>
                            </form>
                        </div>
                    )}
                </>
            );
        }

        // =====================================
        // KOMPONEN: PAPAN SKOR
        // =====================================
        function Leaderboard() {
            const [scores, setScores] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchScores = async () => {
                    // Fetch attempts with joined profiles and quizzes
                    const { data, error } = await supabase
                        .from('attempts')
                        .select('*, profiles(name), quizzes(title)')
                        .order('percentage', { ascending: false })
                        .order('created_at', { ascending: true })
                        .limit(20);
                    if (data) setScores(data);
                    setLoading(false);
                };
                fetchScores();
            }, []);

            return (
                <div className="glass-card rounded-3xl p-6 md:p-10">
                    <h2 className="text-3xl font-bubble text-yellow-400 mb-6 text-center">🏆 Papan Skor</h2>
                    {loading ? <p className="text-center text-slate-400">Memuat Papan Skor...</p> : (
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="border-b border-slate-700 text-brand-400">
                                        <th className="p-3">Peringkat</th>
                                        <th className="p-3">Nama Peserta</th>
                                        <th className="p-3">Kuis</th>
                                        <th className="p-3">Skor</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {scores.map((s, idx) => (
                                        <tr key={s.id} className="border-b border-slate-700/50 hover:bg-slate-800/50 transition">
                                            <td className="p-3 font-bold text-lg">
                                                {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}
                                            </td>
                                            <td className="p-3 font-semibold">{s.profiles?.name || 'Anonim'}</td>
                                            <td className="p-3 text-sm text-slate-400">{s.quizzes?.title}</td>
                                            <td className="p-3">
                                                <span className={`px-2 py-1 rounded font-bold text-xs ${s.percentage === 100 ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}`}>
                                                    {s.percentage}%
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        // =====================================
        // KOMPONEN LOGIN
        // =====================================
        function ParticipantLogin() {
            const [name, setName] = useState(''); const [phone, setPhone] = useState('');
            const [loading, setLoading] = useState(false); const [error, setError] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true); setError(null);
                const pseudoEmail = `${phone}@peserta.quiz`; const pseudoPassword = `LTQ_${phone}_2026`;
                try {
                    let { data, error: signInError } = await supabase.auth.signInWithPassword({ email: pseudoEmail, password: pseudoPassword });
                    if (signInError && signInError.message.includes("Invalid login")) {
                        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email: pseudoEmail, password: pseudoPassword });
                        if (signUpError) throw signUpError;
                        await supabase.from('profiles').upsert({ id: signUpData.user.id, name: name, phone: phone, role: 'peserta' });
                    } else if (signInError) throw signInError;
                } catch (err) { setError(err.message); } finally { setLoading(false); }
            };

            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl text-center">
                    <h2 className="text-3xl font-bubble text-white mb-2">Mulai Main!</h2>
                    <p className="text-slate-400 mb-6">Cukup masukkan Nama & Nomor HP</p>
                    {error && <div className="bg-red-500/20 text-red-200 p-3 rounded-lg mb-4 text-sm">{error}</div>}
                    <form onSubmit={handleLogin} className="space-y-4">
                        <input type="text" required value={name} onChange={e=>setName(e.target.value)} placeholder="Nama Lengkap" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                        <input type="tel" required value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g, ''))} placeholder="Nomor HP (08...)" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                        <button type="submit" disabled={loading} className="w-full bg-brand-500 hover:bg-brand-400 text-white font-bold py-3 rounded-xl">{loading ? 'Proses...' : 'Masuk & Mulai'}</button>
                    </form>
                </div>
            );
        }

        function AdminLogin({ setView }) {
            const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false); const [error, setError] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setError(`Gagal: ${error.message}`);
                setLoading(false);
            };

            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl border-t-4 border-t-purple-500 text-center">
                    <h2 className="text-2xl font-bold mb-6">Portal Admin</h2>
                    {error && <div className="bg-red-500/20 text-red-200 p-3 rounded-lg mb-4 text-sm">{error}</div>}
                    <form onSubmit={handleLogin} className="space-y-4">
                        <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email Admin" className="w-full bg-slate-900 rounded-xl px-4 py-3 text-white" />
                        <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" className="w-full bg-slate-900 rounded-xl px-4 py-3 text-white" />
                        <button type="submit" disabled={loading} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl">Login Admin</button>
                        <button type="button" onClick={() => setView('home')} className="text-sm text-slate-400 hover:text-white mt-2">Kembali</button>
                    </form>
                </div>
            );
        }

        // =====================================
        // DASHBOARD ADMIN (Tab Navigasi)
        // =====================================
        function AdminDashboard() {
            const [tab, setTab] = useState('kuis'); // kuis, essay, hadiah

            return (
                <div className="glass-card rounded-3xl border-t-4 border-t-purple-500 overflow-hidden">
                    <div className="flex border-b border-slate-700">
                        <button onClick={()=>setTab('kuis')} className={`flex-1 p-4 font-bold ${tab==='kuis'?'bg-purple-600 text-white':'text-slate-400 hover:bg-slate-800'}`}>📝 Kelola Kuis</button>
                        <button onClick={()=>setTab('essay')} className={`flex-1 p-4 font-bold ${tab==='essay'?'bg-brand-600 text-white':'text-slate-400 hover:bg-slate-800'}`}>📄 Periksa Essay</button>
                        <button onClick={()=>setTab('hadiah')} className={`flex-1 p-4 font-bold ${tab==='hadiah'?'bg-green-600 text-white':'text-slate-400 hover:bg-slate-800'}`}>💰 Kirim Hadiah</button>
                    </div>
                    <div className="p-6 md:p-10">
                        {tab === 'kuis' && <AdminQuizManager />}
                        {tab === 'essay' && <AdminEssayChecker />}
                        {tab === 'hadiah' && <AdminRewardSender />}
                    </div>
                </div>
            );
        }

        // =====================================
        // ADMIN: KELOLA KUIS
        // =====================================
        function AdminQuizManager() {
            const [quizzes, setQuizzes] = useState([]);
            const [selectedQuiz, setSelectedQuiz] = useState(null);
            const [newTitle, setNewTitle] = useState('');
            const [quizType, setQuizType] = useState('MCQ');

            useEffect(() => { loadQuizzes(); }, []);
            const loadQuizzes = async () => {
                const { data } = await supabase.from('quizzes').select('*').order('created_at', { ascending: false });
                if (data) setQuizzes(data);
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                const reward = quizType === 'ESSAY' ? 50000 : 25000;
                await supabase.from('quizzes').insert({ title: newTitle, quiz_type: quizType, reward_amount: reward, is_active: false });
                setNewTitle(''); loadQuizzes();
            };

            const toggleStatus = async (id, status) => { await supabase.from('quizzes').update({ is_active: !status }).eq('id', id); loadQuizzes(); };
            const delQuiz = async (id) => { if(confirm("Hapus?")) { await supabase.from('quizzes').delete().eq('id', id); loadQuizzes(); } };

            if (selectedQuiz) return <AdminQuestionManager quiz={selectedQuiz} goBack={() => setSelectedQuiz(null)} />;

            return (
                <div>
                    <h3 className="text-xl font-bold mb-4">Buat Kuis Baru</h3>
                    <form onSubmit={handleCreate} className="flex flex-col md:flex-row gap-4 mb-8 bg-slate-800 p-4 rounded-xl">
                        <input type="text" required value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="Judul Kuis" className="flex-1 bg-slate-900 rounded-lg px-4 py-2 text-white" />
                        <select value={quizType} onChange={e=>setQuizType(e.target.value)} className="bg-slate-900 rounded-lg px-4 py-2 text-white font-bold">
                            <option value="MCQ">Pilihan Ganda (Hadiah Rp 25.000)</option>
                            <option value="ESSAY">Essay (Hadiah Rp 50.000)</option>
                        </select>
                        <button type="submit" className="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-lg">Simpan</button>
                    </form>

                    <div className="space-y-4">
                        {quizzes.map(q => (
                            <div key={q.id} className="bg-slate-800 p-4 rounded-xl flex justify-between items-center gap-4">
                                <div>
                                    <h4 className="font-bold">{q.title} <span className="text-xs text-brand-400 ml-2 border border-brand-400 px-1 rounded">{q.quiz_type}</span></h4>
                                    <p className="text-xs text-slate-400">Hadiah: Rp {q.reward_amount} | Status: {q.is_active ? '✅ PUBLIK' : '🔒 DRAFT'}</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={()=>setSelectedQuiz(q)} className="bg-brand-600 px-3 py-1 rounded text-sm">Soal</button>
                                    <button onClick={()=>toggleStatus(q.id, q.is_active)} className="bg-yellow-600 px-3 py-1 rounded text-sm">{q.is_active ? 'Sembunyikan' : 'Tampilkan'}</button>
                                    <button onClick={()=>delQuiz(q.id)} className="bg-red-600 px-3 py-1 rounded text-sm">Hapus</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =====================================
        // ADMIN: KELOLA SOAL
        // =====================================
        function AdminQuestionManager({ quiz, goBack }) {
            const [questions, setQuestions] = useState([]);
            const [qText, setQText] = useState('');
            const [optA, setOptA] = useState(''); const [optB, setOptB] = useState('');
            const [optC, setOptC] = useState(''); const [optD, setOptD] = useState('');
            const [correct, setCorrect] = useState('A');

            useEffect(() => { loadQ(); }, []);
            const loadQ = async () => { const { data } = await supabase.from('questions').select('*').eq('quiz_id', quiz.id); if(data) setQuestions(data); };

            const handleAdd = async (e) => {
                e.preventDefault();
                let correctText = '';
                if(quiz.quiz_type === 'MCQ') correctText = correct === 'A' ? optA : correct === 'B' ? optB : correct === 'C' ? optC : optD;
                else correctText = 'ESSAY_MANUAL'; // Penanda untuk essay

                await supabase.from('questions').insert({ quiz_id: quiz.id, question: qText, option_a: optA||'-', option_b: optB||'-', option_c: optC||'-', option_d: optD||'-', correct_answer: correctText });
                setQText(''); setOptA(''); setOptB(''); setOptC(''); setOptD(''); loadQ();
            };
            const delQ = async (id) => { await supabase.from('questions').delete().eq('id', id); loadQ(); };

            return (
                <div>
                    <button onClick={goBack} className="text-slate-400 mb-4">← Kembali</button>
                    <h3 className="font-bold text-xl mb-4">Soal: {quiz.title}</h3>
                    
                    <form onSubmit={handleAdd} className="bg-slate-800 p-4 rounded-xl mb-6 space-y-4">
                        <textarea required value={qText} onChange={e=>setQText(e.target.value)} placeholder="Pertanyaan..." className="w-full bg-slate-900 rounded-lg p-3"></textarea>
                        {quiz.quiz_type === 'MCQ' && (
                            <>
                                <div className="grid grid-cols-2 gap-2">
                                    <input required value={optA} onChange={e=>setOptA(e.target.value)} placeholder="Opsi A" className="bg-slate-900 p-2 rounded" />
                                    <input required value={optB} onChange={e=>setOptB(e.target.value)} placeholder="Opsi B" className="bg-slate-900 p-2 rounded" />
                                    <input required value={optC} onChange={e=>setOptC(e.target.value)} placeholder="Opsi C" className="bg-slate-900 p-2 rounded" />
                                    <input required value={optD} onChange={e=>setOptD(e.target.value)} placeholder="Opsi D" className="bg-slate-900 p-2 rounded" />
                                </div>
                                <select value={correct} onChange={e=>setCorrect(e.target.value)} className="bg-slate-900 p-2 rounded w-full">
                                    <option value="A">Jawaban Benar: A</option><option value="B">Jawaban Benar: B</option><option value="C">Jawaban Benar: C</option><option value="D">Jawaban Benar: D</option>
                                </select>
                            </>
                        )}
                        <button type="submit" className="bg-brand-600 py-2 px-4 rounded font-bold w-full">Tambah Soal</button>
                    </form>

                    {questions.map((q, i) => (
                        <div key={q.id} className="bg-slate-800 p-3 rounded mb-2 flex justify-between">
                            <div><p className="font-bold">{i+1}. {q.question}</p>{quiz.quiz_type === 'MCQ' && <p className="text-xs text-green-400">Benar: {q.correct_answer}</p>}</div>
                            <button onClick={()=>delQ(q.id)} className="text-red-400">Hapus</button>
                        </div>
                    ))}
                </div>
            );
        }

        // =====================================
        // ADMIN: PERIKSA ESSAY
        // =====================================
        function AdminEssayChecker() {
            const [essays, setEssays] = useState([]);
            useEffect(() => { loadEssays(); }, []);
            
            const loadEssays = async () => {
                const { data } = await supabase.from('attempts').select('*, quizzes(title), profiles(name)').eq('review_status', 'menunggu_pemeriksaan');
                if (data) setEssays(data);
            };

            const gradeEssay = async (attempt, isCorrect) => {
                const score = isCorrect ? attempt.total_points : 0;
                const pct = isCorrect ? 100 : 0;
                await supabase.from('attempts').update({ score: score, percentage: pct, review_status: 'selesai' }).eq('id', attempt.id);
                loadEssays();
            };

            return (
                <div>
                    <h3 className="font-bold text-xl mb-4">Pemeriksaan Essay</h3>
                    {essays.length === 0 ? <p className="text-slate-400">Tidak ada essay yang menunggu diperiksa.</p> : essays.map(e => (
                        <div key={e.id} className="bg-slate-800 p-4 rounded-xl mb-4 border-l-4 border-yellow-400">
                            <p className="text-sm text-brand-400">{e.quizzes?.title} - Peserta: {e.profiles?.name}</p>
                            <p className="mt-2 text-white bg-slate-900 p-3 rounded">{e.essay_answer}</p>
                            <div className="mt-4 flex gap-3">
                                <button onClick={()=>gradeEssay(e, true)} className="bg-green-600 px-4 py-2 rounded font-bold">✅ Tandai Benar (100%)</button>
                                <button onClick={()=>gradeEssay(e, false)} className="bg-red-600 px-4 py-2 rounded font-bold">❌ Tandai Salah</button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // =====================================
        // ADMIN: KIRIM HADIAH
        // =====================================
        function AdminRewardSender() {
            const [claims, setClaims] = useState([]);
            useEffect(() => { loadClaims(); }, []);
            
            const loadClaims = async () => {
                const { data } = await supabase.from('reward_claims').select('*').order('created_at', { ascending: false });
                if (data) setClaims(data);
            };

            const markSent = async (id) => {
                await supabase.from('reward_claims').update({ status: 'Terkirim ✅' }).eq('id', id);
                loadClaims();
            };

            return (
                <div>
                    <h3 className="font-bold text-xl mb-4">Daftar Penerima Hadiah</h3>
                    <div className="space-y-4">
                        {claims.map(c => (
                            <div key={c.id} className="bg-slate-800 p-4 rounded-xl flex justify-between items-center">
                                <div>
                                    <h4 className="font-bold text-yellow-400">{c.user_name} - Rp {c.reward_amount.toLocaleString()}</h4>
                                    <p className="text-sm">Kuis: {c.quiz_title}</p>
                                    <p className="text-lg font-mono bg-slate-900 inline-block px-2 py-1 rounded mt-1">No. DANA/HP: {c.phone_or_dana}</p>
                                </div>
                                <div className="text-right">
                                    <p className={`font-bold mb-2 ${c.status.includes('Terkirim') ? 'text-green-400' : 'text-yellow-400'}`}>{c.status}</p>
                                    {!c.status.includes('Terkirim') && (
                                        <button onClick={()=>markSent(c.id)} className="bg-green-600 px-4 py-2 rounded text-sm font-bold">Tandai Sudah Dikirim</button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =====================================
        // PESERTA: BERANDA KUIS
        // =====================================
        function ParticipantHome({ setView, setActiveQuiz }) {
            const [quizzes, setQuizzes] = useState([]);
            useEffect(() => {
                const fetch = async () => { const { data } = await supabase.from('quizzes').select('*').eq('is_active', true); if(data) setQuizzes(data); };
                fetch();
            }, []);

            return (
                <div className="space-y-8 mt-4">
                    <h3 className="text-2xl font-bold">🔥 Kuis Tersedia</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {quizzes.map(q => (
                            <div key={q.id} className="glass-card rounded-2xl p-6 flex flex-col hover:border-brand-500/50">
                                <span className={`text-xs font-bold px-2 py-1 rounded w-max mb-2 ${q.quiz_type === 'ESSAY' ? 'bg-purple-500/20 text-purple-400' : 'bg-brand-500/20 text-brand-400'}`}>{q.quiz_type === 'ESSAY' ? 'ESSAY' : 'PILIHAN GANDA'}</span>
                                <h4 className="text-xl font-bold mb-4">{q.title}</h4>
                                <span className="text-yellow-400 font-bold mb-4">Hadiah: Rp {q.reward_amount.toLocaleString()}</span>
                                <button onClick={() => { setActiveQuiz(q); setView('quiz_runner'); }} className="w-full bg-white text-slate-900 font-bold py-3 rounded-xl">Mulai Kerjakan</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // =====================================
        // PESERTA: GAMEPLAY & KLAIM HADIAH
        // =====================================
        function QuizRunner({ quiz, setView, user, userName }) {
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [essayAnswer, setEssayAnswer] = useState('');
            const [result, setResult] = useState(null);
            
            // Klaim Hadiah
            const [danaNumber, setDanaNumber] = useState('');
            const [claimStatus, setClaimStatus] = useState('');

            useEffect(() => {
                const fetchQ = async () => { const { data } = await supabase.from('questions').select('*').eq('quiz_id', quiz.id); if (data) setQuestions(data); };
                fetchQ();
            }, [quiz.id]);

            const handleSubmit = async () => {
                if (quiz.quiz_type === 'ESSAY') {
                    await supabase.from('attempts').insert({ quiz_id: quiz.id, user_id: user.id, score: 0, total_points: 1, percentage: 0, essay_answer: essayAnswer, review_status: 'menunggu_pemeriksaan' });
                    setResult({ type: 'essay_submitted' });
                } else {
                    let correctCount = 0;
                    questions.forEach(q => { if (answers[q.id] === q.correct_answer) correctCount++; });
                    const pct = Math.round((correctCount / questions.length) * 100);
                    await supabase.from('attempts').insert({ quiz_id: quiz.id, user_id: user.id, score: correctCount, total_points: questions.length, percentage: pct, review_status: 'selesai' });
                    setResult({ type: 'mcq_done', percentage: pct, correct: correctCount, total: questions.length });
                }
            };

            const submitClaim = async (e) => {
                e.preventDefault();
                await supabase.from('reward_claims').insert({ quiz_id: quiz.id, user_id: user.id, user_name: userName, quiz_title: quiz.title, phone_or_dana: danaNumber, reward_amount: quiz.reward_amount });
                setClaimStatus('berhasil');
            };

            const resetQuiz = () => { setCurrentIndex(0); setAnswers({}); setResult(null); };

            if (questions.length === 0) return <div className="text-center py-10">Memuat soal...</div>;

            if (result) {
                if (result.type === 'essay_submitted') {
                    return (
                        <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <h2 className="text-2xl font-bold mb-4">Jawaban Essay Terkirim!</h2>
                            <p className="text-slate-300 mb-6">Admin akan memeriksa jawaban Anda secara manual. Cek papan skor nanti untuk melihat hasilnya!</p>
                            <button onClick={()=>setView('home')} className="w-full bg-slate-700 py-3 rounded-xl font-bold">Kembali</button>
                        </div>
                    );
                }

                if (result.type === 'mcq_done') {
                    return (
                        <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center">
                            <div className="text-6xl mb-4">{result.percentage === 100 ? '🎉' : '💪'}</div>
                            <h2 className="text-3xl font-bubble text-white mb-2">Skor: {result.percentage}%</h2>
                            
                            {result.percentage === 100 ? (
                                claimStatus === 'berhasil' ? (
                                    <div className="bg-green-500/20 p-6 rounded-xl border border-green-500">
                                        <p className="text-green-400 font-bold text-lg mb-2">Nomor Terkirim!</p>
                                        <p className="text-sm">Admin akan segera memproses saldo DANA / Pulsa Anda.</p>
                                        <button onClick={()=>setView('home')} className="mt-4 bg-slate-700 px-4 py-2 rounded font-bold w-full">Kembali</button>
                                    </div>
                                ) : (
                                    <div className="mt-6 text-left">
                                        <p className="text-yellow-400 font-bold text-center mb-4">Selamat! Klaim Hadiah Rp {quiz.reward_amount.toLocaleString()}</p>
                                        <form onSubmit={submitClaim} className="space-y-4">
                                            <input type="number" required value={danaNumber} onChange={e=>setDanaNumber(e.target.value)} placeholder="Masukkan Nomor DANA / HP" className="w-full bg-slate-900 border border-yellow-400 rounded-xl p-4 text-white font-bold" />
                                            <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 rounded-xl text-lg shadow-[0_0_15px_rgba(234,179,8,0.5)]">Klaim Sekarang</button>
                                        </form>
                                    </div>
                                )
                            ) : (
                                <div>
                                    <p className="text-slate-300 mb-6">Benar {result.correct} dari {result.total}. Harus 100% untuk dapat hadiah.</p>
                                    <button onClick={resetQuiz} className="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-4 rounded-xl mb-3 shadow-lg flex justify-center items-center gap-2 text-lg">
                                        <span>🔄</span> Ulangi Quiz
                                    </button>
                                    <button onClick={()=>setView('home')} className="w-full text-slate-400 py-2">Kembali ke Beranda</button>
                                </div>
                            )}
                        </div>
                    );
                }
            }

            const curQ = questions[currentIndex];
            return (
                <div className="max-w-2xl mx-auto mt-4">
                    <div className="glass-card p-6 rounded-3xl mb-6">
                        <h3 className="text-2xl font-bold mb-6">{curQ.question}</h3>
                        {quiz.quiz_type === 'ESSAY' ? (
                            <textarea value={essayAnswer} onChange={e=>setEssayAnswer(e.target.value)} placeholder="Tulis jawaban essay di sini..." className="w-full h-40 bg-slate-900 rounded-xl p-4 text-white outline-none focus:border-brand-500 border border-transparent"></textarea>
                        ) : (
                            <div className="space-y-3">
                                {['option_a', 'option_b', 'option_c', 'option_d'].map((k, i) => {
                                    const val = curQ[k]; const isSel = answers[curQ.id] === val;
                                    return (
                                        <button key={i} onClick={()=>setAnswers(p=>({...p, [curQ.id]: val}))} className={`w-full text-left p-4 rounded-xl border-2 ${isSel ? 'border-brand-500 bg-brand-500/20' : 'border-slate-700 bg-slate-800'}`}>{val}</button>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                    <div className="flex gap-4">
                        {currentIndex < questions.length - 1 ? (
                            <button onClick={()=>setCurrentIndex(p=>p+1)} className="flex-1 py-3 rounded-xl font-bold bg-brand-600 text-white">Lanjut</button>
                        ) : (
                            <button onClick={handleSubmit} className="flex-1 py-3 rounded-xl font-bold bg-green-600 text-white">Selesai & Kumpulkan</button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
