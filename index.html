<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendang Tampel Lauq Quiz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], bubble: ['DynaPuff', 'cursive'] },
                    colors: { brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' } },
                    animation: { 'bounce-slow': 'bounce 2s infinite', 'fade-in-up': 'fadeInUp 0.4s ease-out' },
                    keyframes: { fadeInUp: { '0%': { opacity: '0', transform: 'translateY(20px) scale(0.95)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } } }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #0f172a; color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed; min-height: 100vh;
        }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex flex-col items-center justify-center min-h-screen">
            <div class="w-12 h-12 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <h2 class="text-xl font-bold text-yellow-400 animate-pulse">Menyiapkan Aplikasi Kuis...</h2>
        </div>
    </div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://iktcnbgafhlavgoymykg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JvJbQz4v9DSmJI7UvSII7A_6MLyEtdh';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { useState, useEffect } = React;

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null, errorInfo: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("Aplikasi Crash:", error, errorInfo); this.setState({ errorInfo }); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 text-center z-50 relative">
                            <div className="bg-red-900/80 border-2 border-red-500 p-8 rounded-3xl max-w-2xl w-full text-white shadow-2xl backdrop-blur-md">
                                <div className="text-6xl mb-4">⚠️</div>
                                <h1 className="text-3xl font-bold mb-4">Aplikasi Mengalami Kendala</h1>
                                <p className="mb-4 text-red-200">Terjadi kesalahan sistem saat memuat data. Screenshot kotak di bawah ini dan berikan ke Admin:</p>
                                <div className="bg-black/50 p-4 rounded-xl text-left overflow-auto text-xs text-red-300 font-mono h-48 border border-red-500/30">
                                    {this.state.error && this.state.error.toString()}<br/><br/>
                                    {this.state.errorInfo && this.state.errorInfo.componentStack}
                                </div>
                                <button onClick={() => window.location.reload()} className="mt-6 w-full bg-red-600 hover:bg-red-500 py-4 rounded-xl font-bold text-white transition">Muat Ulang Halaman</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [session, setSession] = useState(null);
            const [userRole, setUserRole] = useState(null);
            const [userName, setUserName] = useState('');
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [activeQuiz, setActiveQuiz] = useState(null);
            
            const [onlineUsers, setOnlineUsers] = useState({});

            useEffect(() => {
                let mounted = true;
                const initialize = async () => {
                    try {
                        const { data: { session }, error } = await supabase.auth.getSession();
                        if (error) throw error;
                        if (mounted) {
                            setSession(session);
                            await checkUserRole(session?.user);
                        }
                    } catch (err) {
                        console.error("Gagal getSession:", err);
                        if (mounted) setLoading(false);
                    }
                };
                
                initialize();

                const { data } = supabase.auth.onAuthStateChange(async (_event, session) => {
                    if (mounted) {
                        setSession(session);
                        await checkUserRole(session?.user);
                    }
                });

                return () => { mounted = false; data?.subscription?.unsubscribe(); };
            }, []);

            const checkUserRole = async (user) => {
                if (!user) { 
                    setUserRole(null); 
                    setUserName('');
                    setLoading(false); 
                    return; 
                }
                try {
                    const { data, error } = await supabase.from('profiles').select('role, name').eq('id', user.id).maybeSingle();
                    if (data) { 
                        setUserName(data.name || 'Anonim'); 
                        setUserRole(data.role || 'peserta'); 
                    } else if (user.email && !user.email.includes('@peserta.quiz')) { 
                        setUserRole('admin'); 
                        setUserName('Admin'); 
                    } else { 
                        setUserRole('peserta'); 
                        setUserName('Peserta Baru');
                    }
                } catch (err) {
                    console.error("Error checkUserRole:", err);
                    setUserRole('peserta');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (!session?.user || !userRole) return;
                
                const channel = supabase.channel('global_quiz_presence', { 
                    config: { presence: { key: session.user.id } } 
                });

                channel.on('presence', { event: 'sync' }, () => {
                    setOnlineUsers(channel.presenceState());
                });

                channel.subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await channel.track({ 
                            name: userName || (userRole === 'admin' ? 'Admin' : 'Peserta'), 
                            role: userRole, 
                            online_at: new Date().toISOString() 
                        });
                    }
                });

                return () => { supabase.removeChannel(channel); };
            }, [session?.user, userName, userRole]);

            const logout = async () => { 
                setLoading(true);
                await supabase.auth.signOut(); 
                setView('home'); 
                setLoading(false);
            };

            if (loading) return (
                <div className="flex flex-col items-center justify-center min-h-screen z-50">
                    <div className="w-16 h-16 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-brand-300 font-bold animate-pulse text-lg">Menyiapkan Data...</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden">
                    <BroadcastPopup />
                    {/* LEBAH PENYEMANGAT MENGAMBANG (Khusus Peserta) */}
                    {session && userRole === 'peserta' && <FloatingBees />}

                    <header className="glass-card sticky top-0 z-40 px-4 py-4 mb-6 transition-all">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-gradient-to-br from-yellow-400 to-yellow-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                                    <span className="text-slate-900 font-bold text-xl font-bubble">Q</span>
                                </div>
                                <div><h1 className="text-2xl md:text-3xl font-bubble text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">Lendang Tampel Lauq</h1></div>
                            </div>
                            <div className="flex items-center gap-3">
                                {session ? (
                                    <>
                                        {userRole === 'admin' && <button onClick={() => setView('admin')} className="text-sm bg-purple-600 hover:bg-purple-500 px-3 py-2 rounded-lg font-bold transition shadow-lg">⚙️ Admin</button>}
                                        {userRole === 'peserta' && <button onClick={() => setView('leaderboard')} className="text-sm bg-brand-600 hover:bg-brand-500 text-white px-3 py-2 rounded-lg font-bold transition shadow-lg">🏆 Skor</button>}
                                        <button onClick={logout} className="p-2 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/40 transition text-sm font-bold">Keluar</button>
                                    </>
                                ) : (
                                    <button onClick={() => setView('admin_login')} className="text-slate-400 hover:text-white transition text-sm">⚙️ Login Admin</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-6xl mx-auto px-4 pb-12 z-10 relative">
                        {!session && view === 'home' && <ParticipantLogin />}
                        {!session && view === 'admin_login' && <AdminLogin setView={setView} />}
                        
                        {session && userRole === 'peserta' && view === 'home' && <ParticipantHome setView={setView} setActiveQuiz={setActiveQuiz} />}
                        {session && userRole === 'peserta' && view === 'quiz_runner' && activeQuiz && <QuizRunner quiz={activeQuiz} setView={setView} user={session.user} userName={userName} />}
                        {session && view === 'leaderboard' && <Leaderboard />}
                        
                        {session && userRole === 'admin' && (view === 'admin' || view === 'home') && <AdminDashboard onlineUsers={onlineUsers} />}
                    </main>
                </div>
            );
        }

        // =====================================
        // KOMPONEN: LEBAH ANIMASI (BARU)
        // =====================================
        function FloatingBees() {
            return (
                <>
                    <div className="fixed bottom-6 left-4 md:left-10 z-[60] flex flex-col items-center pointer-events-none animate-bounce-slow">
                        <div className="bg-white text-slate-900 text-[10px] md:text-xs font-black px-3 py-2 rounded-2xl rounded-bl-none shadow-[0_0_15px_rgba(255,255,255,0.3)] mb-2 animate-pulse border-2 border-yellow-400">SEMANGAT! 🔥</div>
                        <div className="text-4xl md:text-5xl transform scale-x-[-1] drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">🐝</div>
                    </div>
                    <div className="fixed bottom-6 right-4 md:right-10 z-[60] flex flex-col items-center pointer-events-none animate-bounce-slow" style={{ animationDelay: '1s' }}>
                        <div className="bg-white text-slate-900 text-[10px] md:text-xs font-black px-3 py-2 rounded-2xl rounded-br-none shadow-[0_0_15px_rgba(255,255,255,0.3)] mb-2 animate-pulse border-2 border-brand-400">BISA YUK! 🚀</div>
                        <div className="text-4xl md:text-5xl drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">🐝</div>
                    </div>
                </>
            );
        }

        function BroadcastPopup() {
            const [message, setMessage] = useState(null);
            useEffect(() => {
                const channel = supabase.channel('public:chat_messages')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => { setMessage(payload.new); })
                    .subscribe();
                return () => { supabase.removeChannel(channel); };
            }, []);

            if (!message) return null;
            return (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-gradient-to-b from-yellow-400 to-yellow-600 rounded-3xl p-8 max-w-lg w-full text-center shadow-[0_0_80px_rgba(250,204,21,0.6)] animate-fade-in-up border-4 border-yellow-300">
                        <div className="text-8xl mb-4 animate-bounce-slow">🐝</div>
                        <h2 className="text-3xl font-bubble text-slate-900 mb-6 font-black tracking-widest drop-shadow-sm uppercase">PENGUMUMAN!</h2>
                        <div className="bg-white/90 p-6 rounded-2xl mb-8 shadow-inner border border-yellow-200">
                            <p className="text-2xl text-slate-900 font-bold leading-relaxed">{message?.message || ''}</p>
                        </div>
                        <button onClick={() => setMessage(null)} className="w-full bg-slate-900 text-yellow-400 font-bold text-xl px-8 py-4 rounded-xl hover:bg-slate-800 transition shadow-2xl">SIAP, LAKSANAKAN!</button>
                    </div>
                </div>
            );
        }

        function ParticipantLogin() {
            const [name, setName] = useState(''); const [phone, setPhone] = useState('');
            const [loading, setLoading] = useState(false); const [error, setError] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true); setError(null);
                const pseudoEmail = `${phone}@peserta.quiz`; const pseudoPassword = `LTQ_${phone}_2026`;
                
                try {
                    const { count } = await supabase.from('profiles').select('id', { count: 'exact', head: true }).eq('role', 'peserta');
                    let { data, error: signInError } = await supabase.auth.signInWithPassword({ email: pseudoEmail, password: pseudoPassword });
                    
                    if (signInError && signInError.message.includes("Invalid login")) {
                        if (count >= 50) throw new Error("Mohon Maaf, Kuota Maksimal 50 Peserta Telah Penuh!");
                        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email: pseudoEmail, password: pseudoPassword });
                        if (signUpError) throw signUpError;
                        await supabase.from('profiles').upsert({ id: signUpData.user.id, name: name, phone: phone, role: 'peserta' });
                    } else if (signInError) {
                        throw signInError;
                    }
                } catch (err) { setError(err.message); } finally { setLoading(false); }
            };

            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl text-center shadow-2xl border-t-4 border-t-yellow-400 relative z-20">
                    <h2 className="text-3xl font-bubble text-white mb-2">Masuk ke Arena!</h2>
                    <p className="text-slate-400 mb-6">Maksimal 50 Peserta. Siapa cepat dia dapat!</p>
                    {error && <div className="bg-red-500/20 text-red-200 p-3 rounded-lg mb-4 text-sm font-semibold border border-red-500/30">{error}</div>}
                    <form onSubmit={handleLogin} className="space-y-4">
                        <input type="text" required value={name} onChange={e=>setName(e.target.value)} placeholder="Nama Panggilan / Lengkap" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold outline-none focus:border-yellow-400" />
                        <input type="tel" required value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g, ''))} placeholder="Nomor WhatsApp" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold outline-none focus:border-yellow-400" />
                        <button type="submit" disabled={loading} className="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3.5 rounded-xl text-lg shadow-[0_0_15px_rgba(234,179,8,0.4)] transition">{loading ? 'Memuat...' : 'GAS MAIN!'}</button>
                    </form>
                </div>
            );
        }

        function AdminLogin({ setView }) {
            const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false); const [error, setError] = useState(null);
            
            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setError(`Gagal: ${error.message}`);
                setLoading(false);
            };
            
            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl border-t-4 border-t-purple-500 text-center shadow-2xl relative z-20">
                    <h2 className="text-2xl font-bold mb-6 text-white">Login Admin</h2>
                    {error && <div className="bg-red-500/20 text-red-200 p-3 rounded-lg mb-4 text-sm">{error}</div>}
                    <form onSubmit={handleLogin} className="space-y-4">
                        <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email Admin" className="w-full bg-slate-900 rounded-xl px-4 py-3 text-white outline-none focus:border-purple-500" />
                        <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" className="w-full bg-slate-900 rounded-xl px-4 py-3 text-white outline-none focus:border-purple-500" />
                        <button type="submit" disabled={loading} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl text-lg transition shadow-lg">Masuk Dashboard</button>
                        <button type="button" onClick={() => setView('home')} className="text-sm text-slate-400 hover:text-white mt-2">Kembali ke Depan</button>
                    </form>
                </div>
            );
        }

        // =====================================
        // DASHBOARD ADMIN
        // =====================================
        function AdminDashboard({ onlineUsers }) {
            const [tab, setTab] = useState('kuis'); 

            const usersArray = Object.keys(onlineUsers || {})
                .map(key => onlineUsers[key]?.[0])
                .filter(u => u !== undefined && u !== null);

            return (
                <div className="glass-card rounded-3xl border-t-4 border-t-purple-500 overflow-hidden shadow-2xl animate-fade-in-up">
                    <div className="flex flex-wrap border-b border-slate-700 bg-slate-900/50">
                        <button onClick={()=>setTab('kuis')} className={`flex-1 min-w-[100px] p-4 text-sm font-bold transition ${tab==='kuis'?'bg-purple-600 text-white':'text-slate-400 hover:text-white'}`}>📝 Kuis</button>
                        <button onClick={()=>setTab('essay')} className={`flex-1 min-w-[100px] p-4 text-sm font-bold transition ${tab==='essay'?'bg-brand-600 text-white':'text-slate-400 hover:text-white'}`}>📄 Essay</button>
                        <button onClick={()=>setTab('hadiah')} className={`flex-1 min-w-[100px] p-4 text-sm font-bold transition ${tab==='hadiah'?'bg-green-600 text-white':'text-slate-400 hover:text-white'}`}>💰 Hadiah</button>
                        <button onClick={()=>setTab('broadcast')} className={`flex-1 min-w-[100px] p-4 text-sm font-bold transition ${tab==='broadcast'?'bg-yellow-500 text-slate-900':'text-slate-400 hover:text-white'}`}>📢 Chat</button>
                        <button onClick={()=>setTab('skor')} className={`flex-1 min-w-[100px] p-4 text-sm font-bold transition ${tab==='skor'?'bg-blue-600 text-white':'text-slate-400 hover:text-white'}`}>🏆 Papan Skor</button>
                        <button onClick={()=>setTab('online')} className={`flex-1 min-w-[100px] p-4 text-sm font-bold transition ${tab==='online'?'bg-slate-800 text-white':'text-slate-400 hover:text-white'}`}>
                            <span className="w-2 h-2 bg-green-500 rounded-full inline-block mr-2 animate-pulse"></span> Online ({usersArray.length})
                        </button>
                    </div>
                    <div className="p-6 md:p-10">
                        {tab === 'kuis' && <AdminQuizManager />}
                        {tab === 'essay' && <AdminEssayChecker />}
                        {tab === 'hadiah' && <AdminRewardSender />}
                        {tab === 'broadcast' && <AdminBroadcast />}
                        {tab === 'skor' && <AdminLeaderboardManager />}
                        {tab === 'online' && <AdminOnlineMonitor usersArray={usersArray} />}
                    </div>
                </div>
            );
        }

        // =====================================
        // KOMPONEN: MANAJER PAPAN SKOR DI ADMIN
        // =====================================
        function AdminLeaderboardManager() {
            return (
                <div className="animate-fade-in-up">
                    <AdminLeaderboardReset />
                    
                    <div className="mt-12 pt-8 border-t border-slate-700">
                        <h3 className="font-bold text-2xl mb-6 text-white">🏆 Klasemen Peserta Saat Ini</h3>
                        <Leaderboard inAdmin={true} />
                    </div>
                </div>
            );
        }

        function AdminBroadcast() {
            const [msg, setMsg] = useState('');
            const [history, setHistory] = useState([]);
            const [confirmDelete, setConfirmDelete] = useState(false);

            useEffect(() => { loadHistory(); }, []);
            const loadHistory = async () => { 
                const { data } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: false }); 
                if (data) setHistory(data); 
            };

            const sendBroadcast = async (e) => {
                e.preventDefault();
                await supabase.from('chat_messages').insert({ user_id: (await supabase.auth.getUser()).data.user.id, user_name: 'ADMINISTRATOR', message: msg });
                setMsg(''); loadHistory();
            };

            const clearAllHistory = async () => {
                const { error } = await supabase.from('chat_messages').delete().not('id', 'is', null);
                if (error) alert("Gagal Menghapus! Pastikan Policy DELETE Supabase sudah dibuat.");
                else { setConfirmDelete(false); loadHistory(); }
            };

            return (
                <div className="animate-fade-in-up">
                    <h3 className="font-bold text-2xl mb-2 text-yellow-400">Broadcast Pengumuman 🐝</h3>
                    <form onSubmit={sendBroadcast} className="bg-slate-800 p-6 rounded-2xl border border-yellow-500/30 mb-8">
                        <textarea required value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Tulis pengumuman..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white font-bold h-32 outline-none focus:border-yellow-400 mb-4"></textarea>
                        <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-4 rounded-xl text-lg shadow-lg">KIRIM BROADCAST</button>
                    </form>

                    <div className="flex justify-between items-center mb-4">
                        <h4 className="font-bold text-lg text-white">Riwayat Broadcast</h4>
                        {!confirmDelete ? (
                            <button onClick={() => setConfirmDelete(true)} className="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-4 py-2 rounded-lg font-bold text-sm transition">Bersihkan Riwayat</button>
                        ) : (
                            <div className="flex gap-2">
                                <button onClick={clearAllHistory} className="bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-lg">Yakin Hapus?</button>
                                <button onClick={() => setConfirmDelete(false)} className="bg-slate-700 text-white px-4 py-2 rounded-lg font-bold text-sm">Batal</button>
                            </div>
                        )}
                    </div>
                    
                    <div className="space-y-3">
                        {history.length === 0 && <p className="text-slate-400 text-sm">Belum ada riwayat broadcast.</p>}
                        {history.map(h => (
                            <div key={h.id} className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <p className="text-white font-medium">{h.message}</p>
                                <p className="text-xs text-slate-500 mt-2">{new Date(h.created_at).toLocaleString('id-ID')}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AdminQuizManager() {
            const [quizzes, setQuizzes] = useState([]);
            const [selectedQuiz, setSelectedQuiz] = useState(null);
            const [newTitle, setNewTitle] = useState('');

            useEffect(() => { loadQuizzes(); }, []);
            const loadQuizzes = async () => { const { data } = await supabase.from('quizzes').select('*').order('created_at', { ascending: false }); if (data) setQuizzes(data); };

            const handleCreate = async (e) => {
                e.preventDefault();
                await supabase.from('quizzes').insert({ title: newTitle, quiz_type: 'MCQ', reward_amount: 0, is_active: false });
                setNewTitle(''); loadQuizzes();
            };

        function Leaderboard({ inAdmin = false }) {
            const [scores, setScores] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchScores = async () => {
                    try {
                        const { data } = await supabase.from('attempts').select('score, user_id, profiles(name)');
                        if (data) {
                            const aggregated = {};
                            data.forEach(row => {
                                const profileName = Array.isArray(row.profiles) ? row.profiles[0]?.name : row.profiles?.name;
                                if (!profileName) return; 
                                const uid = row.user_id;
                                if (!aggregated[uid]) aggregated[uid] = { name: profileName, totalScore: 0 };
                                aggregated[uid].totalScore += (row.score || 0);
                            });
                            setScores(Object.values(aggregated).sort((a, b) => b.totalScore - a.totalScore));
                        }
                    } catch (e) { console.error(e); } finally { setLoading(false); }
                };
                fetchScores();
            }, []);

            return (
                <div className={inAdmin ? "bg-slate-800 rounded-3xl p-6 border border-slate-700" : "glass-card rounded-3xl p-6 md:p-10 border-t-4 border-t-brand-500 animate-fade-in-up"}>
                    {!inAdmin && <h2 className="text-4xl font-bubble text-transparent bg-clip-text bg-gradient-to-r from-brand-300 to-brand-500 mb-2 text-center">🏆 Papan Skor Global</h2>}
                    {!inAdmin && <p className="text-center text-slate-400 mb-8 font-semibold">Akumulasi Murni!</p>}
                    
                    {loading ? <div className="text-center text-brand-400 font-bold animate-pulse py-8">Menghitung akumulasi poin...</div> : (
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="border-b-2 border-slate-700 text-brand-400 text-lg">
                                        <th className="p-4">Rank</th>
                                        <th className="p-4">Nama Peserta</th>
                                        <th className="p-4 text-right">Total Poin</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {scores.map((s, idx) => (
                                        <tr key={idx} className="border-b border-slate-700/50 hover:bg-slate-800/80 transition-colors">
                                            <td className="p-4 font-bold text-2xl">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}</td>
                                            <td className="p-4 font-bold text-lg text-white">{s.name}</td>
                                            <td className="p-4 text-right">
                                                <span className={`px-4 py-2 rounded-xl font-bold text-lg shadow-lg ${s.totalScore >= 1000 ? 'bg-yellow-500 text-slate-900 border-2 border-yellow-400' : 'bg-slate-800 text-brand-400'}`}>
                                                    {s.totalScore} Pts
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                    {scores.length === 0 && <tr><td colSpan="3" className="text-center py-8 text-slate-500">Belum ada poin yang terkumpul.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        // =====================================
        // PESERTA: GAMEPLAY & NOTIFIKASI POIN
        // =====================================
        function QuizRunner({ quiz, setView, user, userName }) {
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [result, setResult] = useState(null);
            const [danaNumber, setDanaNumber] = useState('');
            const [claimStatus, setClaimStatus] = useState('');

            useEffect(() => { const fetchQ = async () => { const { data } = await supabase.from('questions').select('*').eq('quiz_id', quiz.id); if (data) setQuestions(data); }; fetchQ(); }, [quiz.id]);

            const handleSubmit = async () => {
                // Hitung poin didapat
                let earnedScore = 0;
                questions.forEach(q => { if (answers[q.id] === q.correct_answer) earnedScore += (q.points || 0); });
                
                await supabase.from('attempts').insert({ quiz_id: quiz.id, user_id: user.id, score: earnedScore, total_points: 1000, percentage: earnedScore, review_status: 'selesai' });
                
                // Hitung Akumulasi Total
                const { data } = await supabase.from('attempts').select('score').eq('user_id', user.id);
                let grandTotal = 0;
                if(data) data.forEach(row => { grandTotal += (row.score || 0); });

                if (grandTotal >= 1000) {
                    const { count } = await supabase.from('reward_claims').select('id', { count: 'exact' }); 
                    if (count < 3) setResult({ type: 'mcq_winner', earnedScore, grandTotal });
                    else setResult({ type: 'mcq_late_winner', earnedScore, grandTotal });
                } else {
                    setResult({ type: 'mcq_done', earnedScore, grandTotal });
                }
            };

            const submitClaim = async (e) => {
                e.preventDefault();
                await supabase.from('reward_claims').insert({ quiz_id: quiz.id, user_id: user.id, user_name: userName, quiz_title: 'Mencapai Target Poin', phone_or_dana: danaNumber, reward_amount: 25000 });
                setClaimStatus('berhasil');
            };

            if (questions.length === 0) return <div className="text-center py-20 font-bold text-xl text-brand-400 animate-pulse">Menyiapkan Arena...</div>;

            if (result) {
                if (result.type === 'mcq_winner') {
                    return (
                        <div className="max-w-xl mx-auto mt-10 glass-card p-10 rounded-3xl text-center border-4 border-yellow-400 shadow-[0_0_50px_rgba(250,204,21,0.3)] animate-fade-in-up">
                            {claimStatus === 'berhasil' ? (
                                <div>
                                    <div className="text-8xl mb-6">✅</div>
                                    <h2 className="text-4xl font-bubble text-green-400 mb-4">Klaim Berhasil!</h2>
                                    <p className="text-lg text-slate-300 font-semibold mb-8">Admin akan segera mengirimkan hadiah Anda. Terima kasih!</p>
                                    <button onClick={()=>setView('home')} className="bg-slate-800 text-white px-8 py-4 rounded-xl font-bold w-full text-xl shadow-lg">Kembali ke Beranda</button>
                                </div>
                            ) : (
                                <div>
                                    <div className="text-8xl mb-6 animate-bounce">🏆</div>
                                    <h2 className="text-4xl font-bubble text-yellow-400 mb-2 drop-shadow-md">SELAMAT! ANDA JUARA!</h2>
                                    <div className="bg-slate-800 p-6 rounded-2xl mb-8 border border-slate-700">
                                        <p className="text-xl text-green-400 font-bold mb-2">+{result.earnedScore} Poin Terakhir</p>
                                        <p className="text-slate-300 font-semibold text-lg">Total Akumulasi Anda: <span className="text-white font-bold">{result.grandTotal} Poin</span> 🎯</p>
                                    </div>
                                    <p className="text-slate-300 mb-8 font-semibold">Anda mencapai target dan masuk kuota 3 pemenang. Masukkan nomor DANA/Pulsa Anda!</p>
                                    <form onSubmit={submitClaim} className="space-y-4">
                                        <input type="number" required value={danaNumber} onChange={e=>setDanaNumber(e.target.value)} placeholder="Nomor DANA / HP..." className="w-full bg-slate-900 border-2 border-yellow-400 rounded-2xl p-5 text-white font-bold text-xl outline-none text-center shadow-inner" />
                                        <button type="submit" className="w-full bg-gradient-to-r from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 text-slate-900 font-black py-5 rounded-2xl text-2xl shadow-[0_0_20px_rgba(250,204,21,0.6)] transform hover:scale-105 transition-all">AMBIL HADIAH!</button>
                                    </form>
                                </div>
                            )}
                        </div>
                    );
                }

                if (result.type === 'mcq_late_winner') {
                    return (
                        <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center border-t-4 border-t-yellow-400 animate-fade-in-up">
                            <div className="text-7xl mb-6">😥</div>
                            <h2 className="text-3xl font-bubble text-white mb-4">Target Tercapai, Tapi...</h2>
                            <div className="bg-slate-800 p-6 rounded-2xl mb-8 border border-slate-700">
                                <p className="text-xl text-brand-400 font-bold mb-2">+{result.earnedScore} Poin Didapat!</p>
                                <p className="text-slate-300 font-semibold text-lg">Total Akumulasi Anda: <span className="text-white font-bold">{result.grandTotal} Poin</span></p>
                            </div>
                            <p className="text-slate-300 mb-8 font-semibold leading-relaxed">Anda berhasil mencapai target poin, namun <span className="text-white">kuota 3 pemenang sudah habis diambil peserta lain yang lebih cepat.</span></p>
                            <button onClick={()=>setView('home')} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg transition">Kembali ke Beranda</button>
                        </div>
                    );
                }

                if (result.type === 'mcq_done') {
                    return (
                        <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center border-t-4 border-t-brand-500 animate-fade-in-up relative z-20">
                            <div className="text-7xl mb-6">💪</div>
                            <h2 className="text-3xl font-bubble text-white mb-4">Selesai!</h2>
                            <div className="bg-slate-800 p-6 rounded-2xl mb-8 border border-slate-700 shadow-inner">
                                <p className="text-xl text-brand-400 font-bold mb-2">+{result.earnedScore} Poin Didapat!</p>
                                <p className="text-slate-300 font-semibold text-lg">Total Akumulasi: <span className="text-white font-bold">{result.grandTotal} Poin</span></p>
                            </div>
                            <button onClick={()=>setView('home')} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition">Kembali ke Beranda</button>
                        </div>
                    );
                }
            }

            const curQ = questions[currentIndex];
            if (!curQ) return null;

            return (
                <div className="max-w-2xl mx-auto mt-4 animate-fade-in-up">
                    <div className="flex justify-between items-center mb-4">
                        <div className="text-slate-400 font-bold bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">Soal {currentIndex + 1} / {questions.length}</div>
                        <div className="text-slate-500 font-bold text-sm flex items-center gap-2">
                            <span className="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span> Poin Dirahasiakan
                        </div>
                    </div>
                    
                    <div className="glass-card p-6 md:p-10 rounded-3xl mb-6 shadow-2xl border border-slate-700/50">
                        <h3 className="text-2xl md:text-3xl font-bold text-white mb-8 leading-snug">{curQ?.question}</h3>
                        <div className="space-y-4">
                            {['option_a', 'option_b', 'option_c', 'option_d'].map((k, i) => {
                                const val = curQ?.[k]; const isSel = answers[curQ?.id] === val;
                                if (!val) return null;
                                return (
                                    <button key={i} onClick={()=>setAnswers(p=>({...p, [curQ.id]: val}))} className={`w-full text-left p-5 rounded-2xl border-2 transition-all duration-200 flex items-center gap-4 ${isSel ? 'border-brand-500 bg-brand-500/20 shadow-[0_0_20px_rgba(14,165,233,0.3)] transform scale-[1.02]' : 'border-slate-700 bg-slate-800/80 hover:border-slate-500 hover:bg-slate-700'}`}>
                                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isSel ? 'border-brand-400' : 'border-slate-500'}`}>
                                            {isSel && <div className="w-3 h-3 bg-brand-400 rounded-full"></div>}
                                        </div>
                                        <span className="text-xl text-white font-medium">{val}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    
                    <div className="flex gap-4 relative z-20">
                        {currentIndex > 0 && <button onClick={()=>setCurrentIndex(p=>p-1)} className="px-6 py-4 rounded-2xl font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Kembali</button>}
                        
                        {currentIndex < questions.length - 1 ? (
                            <button onClick={()=>setCurrentIndex(p=>p+1)} className="flex-1 py-4 rounded-2xl font-bold bg-brand-600 hover:bg-brand-500 text-white text-xl shadow-lg transition">Lanjut</button>
                        ) : (
                            <button onClick={handleSubmit} className="flex-1 py-4 rounded-2xl font-bold bg-gradient-to-r from-green-500 to-green-600 hover:from-green-400 hover:to-green-500 text-white text-xl shadow-lg transform hover:-translate-y-1 transition-all">Kirim Jawaban!</button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
