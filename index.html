<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendang Tampel Lauq Quiz</title>
    
    <!-- Google Fonts: DynaPuff (Bubble Font) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        bubble: ['DynaPuff', 'cursive'],
                    },
                    colors: {
                        brand: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, Babel & Supabase JS -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // KONFIGURASI SUPABASE SESUAI PERMINTAAN
        const SUPABASE_URL = 'https://rklpxilcmtnrdduocmpu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_GJrrFT8jvULtRvd0e-EFjw_m8s-Amd5';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { useState, useEffect } = React;

        function App() {
            const [session, setSession] = useState(null);
            const [userRole, setUserRole] = useState(null); // 'admin' atau 'peserta'
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); // home, admin, quiz_runner
            const [activeQuiz, setActiveQuiz] = useState(null);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    checkUserRole(session?.user);
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    checkUserRole(session?.user);
                });
            }, []);

            const checkUserRole = async (user) => {
                if (!user) {
                    setUserRole(null);
                    setLoading(false);
                    return;
                }
                // Cek email admin
                if (user.email && !user.email.includes('@peserta.quiz')) {
                    setUserRole('admin');
                } else {
                    setUserRole('peserta');
                }
                setLoading(false);
            };

            const logout = async () => {
                await supabase.auth.signOut();
                setView('home');
            };

            if (loading) return (
                <div className="flex items-center justify-center min-h-screen">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-500"></div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* HEADER */}
                    <header className="glass-card sticky top-0 z-50 px-4 py-4 mb-6">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-gradient-to-br from-brand-400 to-blue-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                                    <span className="text-white font-bold text-xl font-bubble">Q</span>
                                </div>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-bubble text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-blue-300 drop-shadow-md tracking-wide">
                                        Lendang Tampel Lauq
                                    </h1>
                                    <p className="text-xs text-blue-200 tracking-widest font-semibold uppercase hidden md:block">
                                        Asah Pengetahuan, Raih Hadiah!
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                {session ? (
                                    <>
                                        <div className="text-right hidden md:block">
                                            <p className="text-sm font-semibold">{session.user.user_metadata?.name || 'Admin'}</p>
                                            <p className="text-xs text-slate-400">{userRole === 'admin' ? 'Administrator' : 'Peserta'}</p>
                                        </div>
                                        {userRole === 'admin' && (
                                            <button onClick={() => setView('admin')} className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition">
                                                Dashboard Admin
                                            </button>
                                        )}
                                        <button onClick={logout} className="p-2 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/40 transition text-sm">
                                            Keluar
                                        </button>
                                    </>
                                ) : (
                                    <button onClick={() => setView('admin_login')} className="text-slate-500 hover:text-white transition">
                                        <i data-lucide="settings" className="w-5 h-5">⚙️</i> Admin
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 w-full max-w-6xl mx-auto px-4 pb-12">
                        {!session && view === 'home' && <ParticipantLogin />}
                        {!session && view === 'admin_login' && <AdminLogin setView={setView} />}
                        
                        {session && userRole === 'peserta' && view === 'home' && (
                            <ParticipantHome setView={setView} setActiveQuiz={setActiveQuiz} />
                        )}
                        {session && userRole === 'peserta' && view === 'quiz_runner' && activeQuiz && (
                            <QuizRunner quiz={activeQuiz} setView={setView} user={session.user} />
                        )}

                        {session && userRole === 'admin' && <AdminDashboard />}
                    </main>
                </div>
            );
        }

        // ==========================================
        // KOMPONEN: LOGIN PESERTA (HANYA HP & NAMA)
        // ==========================================
        function ParticipantLogin() {
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);

                // Trik Autentikasi: Menggunakan nomor HP sebagai pseudo-email
                const pseudoEmail = `${phone}@peserta.quiz`;
                const pseudoPassword = `LTQ_${phone}_2026`; // Password statis tersembunyi

                try {
                    // Coba login dulu
                    let { data, error: signInError } = await supabase.auth.signInWithPassword({
                        email: pseudoEmail,
                        password: pseudoPassword
                    });

                    // Jika belum terdaftar, lakukan pendaftaran (Register)
                    if (signInError && signInError.message.includes("Invalid login")) {
                        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                            email: pseudoEmail,
                            password: pseudoPassword,
                            options: {
                                data: { name: name, phone: phone }
                            }
                        });
                        
                        if (signUpError) throw signUpError;
                        
                        // Simpan ke tabel profiles jika perlu
                        await supabase.from('profiles').upsert({
                            id: signUpData.user.id,
                            name: name,
                            phone: phone,
                            role: 'peserta'
                        });
                    } else if (signInError) {
                        throw signInError;
                    }

                } catch (err) {
                    setError(err.message || 'Terjadi kesalahan saat masuk.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bubble text-white mb-2">Mulai Main!</h2>
                        <p className="text-slate-400">Masukkan Nama dan Nomor HP untuk mengikuti kuis & raih hadiahnya.</p>
                    </div>
                    
                    {error && <div className="bg-red-500/20 border border-red-500 text-red-200 p-3 rounded-lg mb-6 text-sm">{error}</div>}
                    
                    <form onSubmit={handleLogin} className="space-y-5">
                        <div>
                            <label className="block text-sm font-medium text-slate-300 mb-1">Nama Lengkap</label>
                            <input 
                                type="text" 
                                required
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
                                placeholder="Cth: Ahmad Rian"
                            />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-300 mb-1">Nomor HP (WhatsApp)</label>
                            <input 
                                type="tel" 
                                required
                                value={phone}
                                onChange={(e) => setPhone(e.target.value.replace(/\D/g, ''))} // Hanya angka
                                className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
                                placeholder="Cth: 081234567890"
                            />
                        </div>
                        <button 
                            type="submit" 
                            disabled={loading || !name || !phone}
                            className="w-full bg-gradient-to-r from-brand-500 to-blue-600 hover:from-brand-400 hover:to-blue-500 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg hover:shadow-brand-500/30 transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            {loading ? 'Memproses...' : 'Masuk & Mulai Kuis'}
                        </button>
                    </form>
                </div>
            );
        }

        // ==========================================
        // KOMPONEN: LOGIN ADMIN (EMAIL & PASSWORD)
        // ==========================================
        function AdminLogin({ setView }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setError('Email atau Password salah.');
                setLoading(false);
            };

            return (
                <div className="max-w-md mx-auto mt-12 glass-card p-8 rounded-3xl border-t-4 border-t-purple-500">
                    <div className="text-center mb-8">
                        <h2 className="text-2xl font-bold text-white mb-2">Portal Admin</h2>
                        <p className="text-slate-400 text-sm">Akses khusus pengelola Lendang Tampel Lauq Quiz.</p>
                    </div>
                    
                    {error && <div className="bg-red-500/20 text-red-200 p-3 rounded-lg mb-6 text-sm">{error}</div>}
                    
                    <form onSubmit={handleLogin} className="space-y-5">
                        <div>
                            <label className="block text-sm font-medium text-slate-300 mb-1">Email Admin</label>
                            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
                                className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-300 mb-1">Password</label>
                            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
                                className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                        </div>
                        <button type="submit" disabled={loading}
                            className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition">
                            {loading ? 'Authenticating...' : 'Login Admin'}
                        </button>
                        <button type="button" onClick={() => setView('home')} className="w-full text-slate-400 text-sm hover:text-white mt-4">
                            Kembali ke Halaman Peserta
                        </button>
                    </form>
                </div>
            );
        }

        // ==========================================
        // KOMPONEN: BERANDA PESERTA (DAFTAR KUIS)
        // ==========================================
        function ParticipantHome({ setView, setActiveQuiz }) {
            const [quizzes, setQuizzes] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchQuizzes = async () => {
                    const { data, error } = await supabase
                        .from('quizzes')
                        .select('*')
                        .eq('is_active', true)
                        .order('created_at', { ascending: false });
                    
                    if (data) setQuizzes(data);
                    setLoading(false);
                };
                fetchQuizzes();
            }, []);

            const startQuiz = (quiz) => {
                setActiveQuiz(quiz);
                setView('quiz_runner');
            };

            return (
                <div className="space-y-8 animate-fade-in">
                    {/* Hero Section */}
                    <div className="glass-card rounded-3xl p-8 md:p-12 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-brand-500/10 to-purple-500/10 z-0"></div>
                        <div className="relative z-10">
                            <h2 className="text-4xl md:text-5xl font-bubble text-white mb-4 shadow-sm">
                                Siap Menguji Pengetahuanmu?
                            </h2>
                            <p className="text-lg text-slate-300 mb-8 max-w-2xl mx-auto">
                                Pilih kuis di bawah ini, jawab dengan benar, dan raih hadiah saldo DANA / Pulsa langsung dari admin!
                            </p>
                        </div>
                    </div>

                    {/* Quiz List */}
                    <div>
                        <h3 className="text-2xl font-bold mb-6 flex items-center gap-2">
                            🔥 Kuis Sedang Aktif
                        </h3>
                        {loading ? (
                            <div className="text-center py-10 text-slate-400 animate-pulse">Memuat kuis terbaru...</div>
                        ) : quizzes.length === 0 ? (
                            <div className="glass-card p-10 text-center rounded-2xl text-slate-400">
                                <p className="text-xl mb-2">😔 Belum ada kuis yang aktif.</p>
                                <p className="text-sm">Tunggu admin membuka kuis baru ya!</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {quizzes.map(quiz => (
                                    <div key={quiz.id} className="glass-card rounded-2xl p-6 flex flex-col hover:border-brand-500/50 transition-all hover:shadow-lg hover:shadow-brand-500/20 transform hover:-translate-y-1">
                                        <div className="flex justify-between items-start mb-4">
                                            <span className="bg-brand-500/20 text-brand-300 px-3 py-1 rounded-full text-xs font-bold border border-brand-500/30">
                                                {quiz.category || 'Umum'}
                                            </span>
                                            <span className="text-yellow-400 font-bold text-sm bg-yellow-400/10 px-3 py-1 rounded-full">
                                                Hadiah: Rp {quiz.reward_amount.toLocaleString()}
                                            </span>
                                        </div>
                                        <h4 className="text-xl font-bold mb-2 text-white">{quiz.title}</h4>
                                        <p className="text-sm text-slate-400 mb-6 flex-1 line-clamp-2">{quiz.description}</p>
                                        
                                        <button 
                                            onClick={() => startQuiz(quiz)}
                                            className="w-full bg-white text-slate-900 hover:bg-brand-50 font-bold py-3 rounded-xl transition flex justify-center items-center gap-2"
                                        >
                                            Mulai Kerjakan 🚀
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // KOMPONEN: RUNNER KUIS (LANGSUNG JAWAB)
        // ==========================================
        function QuizRunner({ quiz, setView, user }) {
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);
            const [result, setResult] = useState(null);

            useEffect(() => {
                const fetchQuestions = async () => {
                    const { data, error } = await supabase
                        .from('questions')
                        .select('*')
                        .eq('quiz_id', quiz.id)
                        .order('created_at', { ascending: true });
                    
                    if (data) setQuestions(data);
                    setLoading(false);
                };
                fetchQuestions();
            }, [quiz.id]);

            const handleSelectOption = (questionId, option) => {
                setAnswers(prev => ({ ...prev, [questionId]: option }));
            };

            const handleSubmit = async () => {
                setSubmitting(true);
                let correctCount = 0;
                
                questions.forEach(q => {
                    if (q.question_type === 'pilihan_ganda' && answers[q.id] === q.correct_answer) {
                        correctCount++;
                    }
                });

                const percentage = Math.round((correctCount / questions.length) * 100);

                // Simulasi simpan nilai (Dalam produksi, validasi harus di backend RLS/Trigger)
                await supabase.from('attempts').insert({
                    quiz_id: quiz.id,
                    user_id: user.id,
                    score: correctCount,
                    total_points: questions.length,
                    percentage: percentage,
                    status: 'selesai'
                });

                setResult({ correct: correctCount, total: questions.length, percentage });
                setSubmitting(false);
            };

            if (loading) return <div className="text-center py-20 animate-pulse">Memuat Soal...</div>;
            
            if (questions.length === 0) return (
                <div className="glass-card text-center py-20 rounded-3xl">
                    <p className="text-xl text-red-400 mb-4">Maaf, admin belum memasukkan soal ke kuis ini.</p>
                    <button onClick={() => setView('home')} className="bg-slate-700 px-6 py-2 rounded-lg">Kembali</button>
                </div>
            );

            if (result) {
                return (
                    <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center">
                        <div className="mb-6 text-6xl">
                            {result.percentage === 100 ? '🎉' : '💪'}
                        </div>
                        <h2 className="text-3xl font-bubble mb-2 text-white">Hasil Kuis</h2>
                        <div className="text-5xl font-bold text-brand-400 mb-6">{result.percentage}%</div>
                        <p className="text-lg text-slate-300 mb-8">Benar {result.correct} dari {result.total} soal.</p>
                        
                        {result.percentage === 100 ? (
                            <div className="bg-green-500/20 border border-green-500/50 p-6 rounded-2xl mb-8">
                                <h3 className="text-xl font-bold text-green-400 mb-2">SELAMAT! Anda Berhasil 100%</h3>
                                <p className="text-sm text-green-200">Silakan hubungi Admin via Live Chat/WA untuk mengklaim hadiah Rp {quiz.reward_amount.toLocaleString()}.</p>
                            </div>
                        ) : (
                            <div className="bg-red-500/10 border border-red-500/30 p-6 rounded-2xl mb-8">
                                <p className="text-red-300">Belum berhasil mencapai 100%. Jangan menyerah, coba lagi!</p>
                            </div>
                        )}

                        <button onClick={() => setView('home')} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition">
                            Kembali ke Beranda
                        </button>
                    </div>
                );
            }

            const currentQ = questions[currentIndex];

            return (
                <div className="max-w-2xl mx-auto mt-4">
                    {/* Progress */}
                    <div className="flex justify-between items-center mb-6 text-sm text-slate-400 font-semibold">
                        <span>Soal {currentIndex + 1} dari {questions.length}</span>
                        <div className="w-1/2 bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div className="bg-brand-500 h-full transition-all duration-300" style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}></div>
                        </div>
                    </div>

                    {/* Question Card */}
                    <div className="glass-card p-6 md:p-10 rounded-3xl mb-6 shadow-2xl">
                        <h3 className="text-2xl font-bold text-white mb-8 leading-relaxed">
                            {currentQ.question}
                        </h3>

                        {currentQ.question_type === 'pilihan_ganda' ? (
                            <div className="space-y-3">
                                {['option_a', 'option_b', 'option_c', 'option_d'].map((optKey, idx) => {
                                    const optionValue = currentQ[optKey];
                                    if (!optionValue) return null;
                                    const isSelected = answers[currentQ.id] === optionValue;
                                    
                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => handleSelectOption(currentQ.id, optionValue)}
                                            className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center gap-4 ${
                                                isSelected 
                                                ? 'border-brand-500 bg-brand-500/20 shadow-[0_0_15px_rgba(14,165,233,0.3)]' 
                                                : 'border-slate-700 bg-slate-800/50 hover:border-slate-500 hover:bg-slate-700/50'
                                            }`}
                                        >
                                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isSelected ? 'border-brand-400' : 'border-slate-500'}`}>
                                                {isSelected && <div className="w-3 h-3 bg-brand-400 rounded-full"></div>}
                                            </div>
                                            <span className="text-lg">{optionValue}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        ) : (
                            <div>
                                <textarea 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:border-brand-500 focus:ring-1 focus:ring-brand-500 h-32"
                                    placeholder="Ketik jawaban essay Anda di sini..."
                                    value={answers[currentQ.id] || ''}
                                    onChange={(e) => handleSelectOption(currentQ.id, e.target.value)}
                                ></textarea>
                                <p className="text-xs text-yellow-400 mt-2">Jawaban essay akan diperiksa manual oleh admin.</p>
                            </div>
                        )}
                    </div>

                    {/* Navigation */}
                    <div className="flex justify-between gap-4">
                        <button 
                            onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))}
                            disabled={currentIndex === 0}
                            className="px-6 py-3 rounded-xl font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
                        >
                            Sebelumnya
                        </button>
                        
                        {currentIndex === questions.length - 1 ? (
                            <button 
                                onClick={handleSubmit}
                                disabled={submitting || !answers[currentQ.id]}
                                className="flex-1 px-6 py-3 rounded-xl font-bold bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white shadow-lg transition transform hover:-translate-y-0.5 disabled:opacity-50"
                            >
                                {submitting ? 'Memeriksa...' : 'Kirim Jawaban'}
                            </button>
                        ) : (
                            <button 
                                onClick={() => setCurrentIndex(prev => Math.min(questions.length - 1, prev + 1))}
                                disabled={!answers[currentQ.id]} // Wajib isi sebelum lanjut
                                className="flex-1 px-6 py-3 rounded-xl font-bold bg-brand-600 hover:bg-brand-500 text-white transition disabled:opacity-50"
                            >
                                Lanjut
                            </button>
                        )}
                    </div>
                </div>
            );
        }
