<style>
:root{--bg:#04122e;--bg2:#061b42;--panel:rgba(7,28,69,.92);--panel2:rgba(10,42,92,.9);--line:#168cff;--cyan:#18d7ff;--gold:#ffd42a;--gold2:#ff9f00;--text:#f7fbff;--muted:#a9c2e9;--green:#19e28a;--purple:#a85cff;--danger:#ff5577;--shadow:0 18px 50px rgba(0,0,0,.38)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#020b20;color:var(--text)}body{overflow-x:hidden}

#app{min-height:100vh;background:radial-gradient(circle at 50% -10%,#15488c 0,#061b42 35%,#020b20 85%);padding-bottom:78px}

.topbar .brand-mini{font-weight:900;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back{width:42px;height:42px;border-radius:14px;background:#0b2a59;color:#fff;font-size:20px;border:1px solid #1764a5}
.top-actions{margin-left:auto;display:flex;gap:8px}.iconbtn{width:42px;height:42px;border-radius:50%;background:#0b2a59;color:#fff;border:1px solid #1c72b5}

.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 20%,rgba(29,157,255,.35),transparent 30%),radial-gradient(circle at 25% 65%,rgba(0,255,210,.12),transparent 25%),linear-gradient(180deg,transparent,rgba(1,9,27,.78));pointer-events:none}
.hero-bg{position:absolute;inset:0;background-position:center;background-size:cover;opacity:.34;filter:saturate(1.15);z-index:0}.hero-content{position:relative;z-index:1}
.profile{display:flex;align-items:center;gap:10px}.avatar{width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);background:#102e60;object-fit:cover}.profile-name{font-weight:900;font-size:18px}.level{display:inline-block;margin-top:4px;padding:4px 11px;border-radius:9px;background:linear-gradient(180deg,#ffd83b,#ffab00);color:#0a1a37;font-weight:900;font-size:12px}.xp{height:8px;width:160px;background:#07152e;border-radius:9px;margin-top:5px;overflow:hidden}.xp>i{display:block;height:100%;background:linear-gradient(90deg,#11a8ff,#00e4ff);width:64%}
.resources{display:flex;gap:8px;margin-left:auto}.resource{padding:9px 12px;border:1px solid #1768ad;border-radius:22px;background:rgba(2,19,48,.82);font-weight:900}.resource b{color:var(--gold)}.resource span{color:#5eeaff}
.logo{font-size:clamp(34px,7vw,72px);line-height:.9;font-weight:1000;letter-spacing:-2px;text-transform:uppercase;text-shadow:0 5px 0 #05285c,0 0 30px rgba(0,200,255,.45);max-width:650px;margin:44px 0 8px}.logo em{display:inline-block;color:#071a3d;background:linear-gradient(#ffe74e,#ffad00);padding:7px 22px;border-radius:14px;transform:skew(-5deg);font-style:normal;box-shadow:0 7px 0 #b26a00}
.tagline{font-size:17px;font-weight:800;color:#fff;max-width:560px}.mascot{position:absolute;right:2%;bottom:8%;width:min(44%,430px);max-height:420px;object-fit:contain;filter:drop-shadow(0 20px 25px rgba(0,0,0,.45))}
.hero-cta{display:flex;align-items:stretch;gap:10px;margin-top:26px;position:relative;z-index:2}.mainbtn{flex:1;min-height:76px;border-radius:25px;background:linear-gradient(180deg,#fff04e,#ffb400);color:#07152e;font-weight:1000;font-size:28px;box-shadow:0 8px 0 #a86400,0 0 35px rgba(255,196,0,.4);border:2px solid #fff6a3}.mainbtn small{display:block;font-size:13px;margin-top:2px}.info-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:300px}.info{border:1px solid #1684d9;border-radius:22px;padding:15px;background:rgba(4,25,58,.9);display:flex;gap:12px;align-items:center}.info .ico{font-size:30px}.info b{display:block;color:#ffd83b;font-size:18px}
.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}.section-head h2{margin:0;font-size:22px}.link{color:#27dcff;font-weight:900;background:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick{min-height:150px;padding:17px;border-radius:22px;border:1px solid #1283d7;background:linear-gradient(145deg,#0c3978,#071d4b);box-shadow:var(--shadow);color:#fff;text-align:left}.quick .qicon{font-size:40px}.quick h3{margin:7px 0 4px}.quick p{margin:0;color:var(--muted);font-size:13px}.games{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.game-card{overflow:hidden;border:1px solid #187bd0;border-radius:22px;background:#071d49;box-shadow:var(--shadow)}.cover{height:150px;background:linear-gradient(145deg,#1e62a6,#071c47);display:flex;align-items:center;justify-content:center;font-size:62px}.game-body{padding:13px}.game-body h3{margin:8px 0 5px}.game-body p{color:var(--muted);font-size:13px;min-height:36px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#0a3267;color:#7feaff;font-size:11px;font-weight:900}.play{width:100%;margin-top:9px;padding:11px;border-radius:15px;background:linear-gradient(180deg,#21c8ff,#1370ff);color:#fff;font-weight:1000}.players{display:flex;gap:10px;overflow:auto;padding-bottom:6px}.player{min-width:84px;text-align:center}.player img{width:55px;height:55px;border-radius:50%;border:2px solid #8bcfff;object-fit:cover;background:#123}.player b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player small{color:#ffd83b}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(3,17,46,.95);backdrop-filter:blur(18px);border-top:1px solid #1a67a9;display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom))}.bottomnav .navitem{flex:1;max-width:160px;background:none;color:#9fb7df;padding:5px;border-radius:16px;font-weight:800}.navitem.active{color:#ffd62b}.navitem span{display:block;font-size:24px}.navitem small{font-size:11px}
.page{min-height:calc(100vh - 70px)}.panel{background:rgba(6,25,57,.94);border:1px solid #185f9d;border-radius:22px;padding:16px;box-shadow:var(--shadow)}.panel h2{margin-top:0}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;color:#9dbbe4;font-size:12px;font-weight:800;margin:0 0 5px}.field input,.field textarea,.field select{width:100%;background:#031533;color:#fff;border:1px solid #1a5e99;border-radius:12px;padding:11px;outline:none}.field textarea{min-height:100px;resize:vertical}.btn{padding:11px 15px;border-radius:13px;background:#0e4c8b;color:#fff;font-weight:900;border:1px solid #258ddd}.btn.gold{background:linear-gradient(#ffe64c,#ffae00);color:#06142e}.btn.red{background:#7b1737}.btn.green{background:#087c5a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:10px;border-bottom:1px solid rgba(76,139,195,.22);text-align:left;font-size:13px}.table th{color:#80dcff}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border-radius:20px;background:linear-gradient(145deg,#0b3974,#071a42);border:1px solid #1c76bf}.stat strong{font-size:30px;display:block;color:#ffd73b}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;padding:10px 13px;border-radius:999px;background:#092a57;color:#9fc4ed;border:1px solid #15548b}.tab.active{background:#1178c5;color:#fff}.preview{max-width:100%;max-height:180px;border-radius:12px;border:1px solid #276da7;margin-top:8px}.modal{position:fixed;inset:0;z-index:100;background:rgba(0,4,17,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#061a3d;border:1px solid #1d75bc;border-radius:24px;padding:18px;box-shadow:0 25px 80px #000}.toast{position:fixed;right:14px;top:76px;z-index:150;max-width:330px;background:#092d61;border:1px solid #25bfff;border-radius:16px;padding:13px 15px;box-shadow:var(--shadow);animation:pop .25s ease}.toast b{display:block;color:#ffd83b;margin-bottom:3px}@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 20%,#1451a1,#020b20 65%)}.login{width:min(460px,100%);padding:26px;border-radius:28px;background:rgba(4,20,48,.94);border:1px solid #1b70b4;box-shadow:0 25px 90px #000}.login h1{text-align:center;font-size:32px}.login .logo-mini{text-align:center;color:#ffd62a;font-size:14px;font-weight:1000;letter-spacing:1px}.error{color:#ff7b95;background:#4a1230;padding:10px;border-radius:10px;margin-top:10px}.success{color:#7effc1;background:#063f32;padding:10px;border-radius:10px;margin-top:10px}.quiz-option{width:100%;padding:15px;text-align:left;border-radius:16px;background:#082654;border:1px solid #1b6bab;color:#fff;margin:7px 0;font-weight:800}.quiz-option.selected{background:#116eb1;border-color:#58dcff;box-shadow:0 0 20px rgba(0,204,255,.22)}.timer{font-size:28px;font-weight:1000;color:#ffd62a}.chatbox{height:58vh;overflow:auto;padding:10px;background:#031331;border-radius:16px}.bubble{max-width:82%;padding:10px 13px;border-radius:16px;margin:8px 0}.bubble.admin{background:#0b4f87}.bubble.player{background:#263b60;margin-left:auto}.muted{color:var(--muted)}.empty{text-align:center;padding:30px;color:#8da9cf}
@media(max-width:900px){.grid4,.games,.admin-grid{grid-template-columns:repeat(2,1fr)}.hero{min-height:590px}.mascot{width:48%;bottom:12%;right:0}.logo{max-width:58%}.hero-cta{flex-direction:column}.info-strip{min-width:0}.mainbtn{min-height:68px}}
@media(max-width:600px){.container{padding:10px}.topbar{padding:10px}.resources .resource:nth-child(2){display:none}.hero{min-height:610px;padding:16px;border-radius:22px}.profile{max-width:65%}.logo{font-size:36px;max-width:65%;margin-top:38px}.mascot{width:56%;bottom:17%;opacity:.95}.tagline{max-width:60%;font-size:13px}.hero-cta{margin-top:210px}.info-strip{grid-template-columns:1fr 1fr}.info{padding:10px}.info b{font-size:15px}.grid4,.games,.admin-grid{grid-template-columns:1fr 1fr;gap:8px}.quick{min-height:125px;padding:12px}.quick .qicon{font-size:30px}.game-card .cover{height:110px}.section-head h2{font-size:18px}.formgrid{grid-template-columns:1fr}.table{min-width:650px}.panel{padding:12px}.mainbtn{font-size:22px}}
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
(()=>{'use strict';
const cfg=window.SUPABASE_CONFIG||{};const supaReady=!!(window.supabase&&cfg.url&&cfg.anonKey&&!String(cfg.url).includes('YOUR-PROJECT')&&!String(cfg.anonKey).includes('YOUR_SUPABASE'));const sb=supaReady?window.supabase.createClient(cfg.url,cfg.anonKey):null;const demoMode=!supaReady;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state={user:null,profile:null,settings:{},games:[],prizes:[],players:[],view:'home',adminTab:'overview',selectedGame:null,quiz:null,chat:[],chatChannel:null};
const defaults={site_title:'LENDANG TAMPEL LAUQ QUIZ',tagline:'Asah Pengetahuan, Uji Kemampuan, Raih Prestasi!',description:'Platform kuis interaktif untuk belajar, bermain, dan menguji pengetahuan bersama masyarakat Lendang Tampel Lauq.',encouragement:'Jangan Lupa Berpikir Positif & Terus Belajar!',hero_bg:'',mascot:'',default_prize:'25000',default_winner_count:'3'};
function toast(t,m){const e=document.createElement('div');e.className='toast';e.innerHTML='<b>'+esc(t)+'</b><div>'+esc(m)+'</div>';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function go(v,o={}){state.view=v;if(o.game)state.selectedGame=o.game;location.hash=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function goBack(){if(state.view.startsWith('admin'))go('admin');else if(history.length>1)history.back();else go('home')}window.goBack=goBack;
window.addEventListener('hashchange',()=>{
 const v=location.hash.replace('#','')||'home';
 if(v==='admin'&&!isAdmin()){state.view=state.user?'home':'login';render();return}
 if(state.view!==v){state.view=v;render()}
});
async function getSession(){
 if(!sb){state.user=null;state.profile=null;return null}
 const{data,error}=await sb.auth.getSession();
 if(error){state.user=null;state.profile=null;return null}
 state.user=data.session?.user||null;
 if(state.user)await loadProfile();else state.profile=null;
 return state.user;
}
async function loadProfile(){
 if(!sb||!state.user){state.profile=null;return null}
 const{data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();
 state.profile=error?null:data||null;
 return state.profile;
}
function isAdmin(){return String(state.profile?.role||'').trim().toLowerCase()==='admin'}
function routeAfterAuth(){
 if(!state.user){go('login');return}
 go(isAdmin()?'admin':'home');
}

async function loadAll(){
 if(!sb){
  state.settings={...defaults};
  state.games=[
   {id:'demo1',title:'Pengetahuan Umum',description:'Uji wawasanmu tentang berbagai hal.',icon:'💡',duration_seconds:300,points:10,sort_order:1,active:true},
   {id:'demo2',title:'Keislaman',description:'Tingkatkan ilmu agama dan akhlak.',icon:'🕌',duration_seconds:300,points:10,sort_order:2,active:true},
   {id:'demo3',title:'Sains & Teknologi',description:'Jelajahi dunia pengetahuan.',icon:'🔬',duration_seconds:300,points:10,sort_order:3,active:true},
   {id:'demo4',title:'Hiburan',description:'Kuis seru untuk bersenang-senang.',icon:'⭐',duration_seconds:300,points:10,sort_order:4,active:true}
  ];
  state.prizes=[{id:'pr1',title:'Hadiah Utama',description:'Hadiah untuk pemenang quiz.',amount:25000,winner_count:3,icon:'🎁',active:true}];
  state.players=[
   {id:'p1',full_name:'Rani_Quiz',points:980,level:5,xp:320},
   {id:'p2',full_name:'AhmadJr',points:950,level:5,xp:300},
   {id:'p3',full_name:'SitiQ12',points:930,level:4,xp:410},
   {id:'p4',full_name:'BudiSantoso',points:910,level:4,xp:390},
   {id:'p5',full_name:'Lia_Manis',points:890,level:4,xp:350},
   {id:'p6',full_name:'AndiPro',points:860,level:4,xp:320},
   {id:'p7',full_name:'Dewi99',points:820,level:3,xp:280},
   {id:'p8',full_name:'FajarKing',points:780,level:3,xp:240}
  ];
  return;
 }
 const admin=state.profile?.role==='admin';
 const gs=admin?sb.from('games').select('*').order('sort_order'):sb.from('games').select('*').eq('active',true).order('sort_order');
 const ps=admin?sb.from('prizes').select('*').order('sort_order'):sb.from('prizes').select('*').eq('active',true).order('sort_order');
 const[setR,gR,pR,plR]=await Promise.all([sb.from('site_settings').select('key,value'),gs,ps,sb.from('profiles').select('id,full_name,avatar_url,points,level,xp,is_online,last_seen').eq('role','player').order('points',{ascending:false}).limit(20)]);
 state.settings={...defaults};(setR.data||[]).forEach(x=>state.settings[x.key]=x.value?.value??x.value);state.games=gR.data||[];state.prizes=pR.data||[];state.players=plR.data||[];
}
function authGuard(){if(!state.user){go('login');return false}return true}
function nav(v,i,l,a){return `<button class="navitem ${a===v?'active':''}" onclick="go('${v}')"><span>${i}</span><small>${l}</small></button>`}
function layout(body,a='home'){const back=state.view!=='home'&&!state.view.startsWith('admin')?'<button class="back" onclick="goBack()">‹</button>':state.view.startsWith('admin')?'<button class="back" onclick="go(\'admin\')">‹</button>':'';return `<div class="topbar">${back}<div class="brand-mini">🐾 ${esc(state.settings.site_title||defaults.site_title)}</div><div class="top-actions"><button class="iconbtn" onclick="openChatOrAdmin()">💬</button>${state.user?'<button class="iconbtn" onclick="logout()">↪</button>':'<button class="iconbtn" onclick="go(\'login\')">👤</button>'}</div></div>${body}<nav class="bottomnav">${nav('home','🏠','Beranda',a)}${nav('games','🎮','Game',a)}${nav('ranking','🏆','Ranking',a)}${nav('participants','👥','Peserta',a)}${nav('prizes','🎁','Hadiah',a)}</nav>`}
function home(){const s=state.settings,p=state.profile||{};return layout(`<main class="container page"><section class="hero">${s.hero_bg?`<img class="hero-bg" src="${esc(s.hero_bg)}">`:''}<div class="hero-content"><div style="display:flex;align-items:center"><div class="profile"><img class="avatar" src="${esc(p.avatar_url||'')}" onerror="this.style.display='none'"><div><div class="profile-name">${esc(p.full_name||'Tamu')}</div><span class="level">Lv. ${p.level||1}</span><div class="xp"><i style="width:${Math.min(100,((p.xp||0)%500)/5)}%"></i></div></div></div><div class="resources"><div class="resource">🪙 <b>${Number(p.points||0).toLocaleString('id-ID')}</b></div><div class="resource">💎 <span>${Number(p.diamonds||0)}</span></div></div></div><div class="logo">${esc(s.site_title||defaults.site_title)} <em>QUIZ</em></div><div class="tagline">“${esc(s.tagline||defaults.tagline)}”<br><span class="muted">${esc(s.encouragement||defaults.encouragement)}</span></div>${s.mascot?`<img class="mascot" src="${esc(s.mascot)}">`:'<div class="mascot" style="font-size:170px;text-align:center">🐱</div>'}<div class="hero-cta"><button class="mainbtn" onclick="go('games')">🎮 &nbsp; MULAI GAME <small>Tantang dirimu sekarang!</small></button><div class="info-strip"><div class="info"><div class="ico">🎁</div><div>Hadiah<br><b>Rp${Number(s.default_prize||25000).toLocaleString('id-ID')}</b><small> untuk ${esc(s.default_winner_count||3)} pemenang</small></div></div><div class="info"><div class="ico">⏱️</div><div>Waktu Quiz<br><b>${state.games[0]?.duration_seconds?Math.round(state.games[0].duration_seconds/60):5} Menit</b></div></div></div></div></div></section><section class="section grid4">${quick('🏆','Daftar Game','Pilih game favoritmu dan mulai bermain!','games')}${quick('👥','Daftar Peserta','Lihat siapa saja yang sedang online','participants')}${quick('👑','Papan Skor','Pantau peringkat terbaik','ranking')}${quick('🎁','Hadiah & Achievement','Kumpulkan badge dan raih hadiah!','prizes')}</section><section class="section"><div class="section-head"><h2>🎮 Game Tersedia</h2><button class="link" onclick="go('games')">Lihat Semua ›</button></div><div class="games">${state.games.filter(g=>g.active).slice(0,4).map(gameCard).join('')||'<div class="panel empty">Belum ada game aktif.</div>'}</div></section><section class="section panel"><div class="section-head"><h2>👥 Peserta Online</h2><button class="link" onclick="go('participants')">Lihat Semua ›</button></div><div class="players">${state.players.slice(0,8).map(playerCard).join('')||'<div class="empty">Belum ada peserta.</div>'}</div></section></main>`,'home')}
function quick(i,t,d,v){return `<button class="quick" onclick="go('${v}')"><div class="qicon">${i}</div><h3>${esc(t)}</h3><p>${esc(d)}</p></button>`}
function gameCard(g){return `<article class="game-card"><div class="cover">${g.cover_base64?`<img src="${esc(g.cover_base64)}" style="width:100%;height:100%;object-fit:cover">`:(g.icon||'🧠')}</div><div class="game-body"><span class="pill">${Math.round((g.duration_seconds||300)/60)} Menit • ${g.points||10} Poin</span><h3>${esc(g.title)}</h3><p>${esc(g.description||'Uji kemampuanmu sekarang.')}</p><button class="play" onclick="startGame('${g.id}')">Main Sekarang</button></div></article>`}
function playerCard(p){return `<div class="player"><img src="${esc(p.avatar_url||'')}" onerror="this.style.fontSize='25px';this.alt='👤'"><b>${esc(p.full_name||'Peserta')}</b><small>${Number(p.points||0).toLocaleString('id-ID')}</small></div>`}
function games(){return layout(`<main class="container page"><div class="panel"><div class="section-head"><div><h2>🎮 Daftar Game</h2><div class="muted">Semua game diatur oleh admin.</div></div></div><div class="games">${state.games.filter(g=>g.active).map(gameCard).join('')||'<div class="empty">Belum ada game.</div>'}</div></div></main>`,'games')}
function ranking(){return layout(`<main class="container page"><div class="panel"><h2>🏆 Papan Skor</h2><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Peserta</th><th>Level</th><th>Poin</th></tr></thead><tbody>${state.players.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.full_name)}</td><td>Lv. ${p.level||1}</td><td><b style="color:#ffd83b">${Number(p.points||0).toLocaleString('id-ID')}</b></td></tr>`).join('')}</tbody></table></div></div></main>`,'ranking')}
function participants(){return layout(`<main class="container page"><div class="panel"><h2>👥 Daftar Peserta</h2><div class="players">${state.players.map(playerCard).join('')||'<div class="empty">Belum ada peserta.</div>'}</div></div></main>`,'participants')}
function prizes(){return layout(`<main class="container page"><div class="panel"><h2>🎁 Hadiah & Achievement</h2><div class="grid4">${state.prizes.filter(p=>p.active).map(p=>`<div class="quick"><div class="qicon">${esc(p.icon||'🎁')}</div><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><h3 style="color:#ffd83b">Rp${Number(p.amount||0).toLocaleString('id-ID')}</h3><span class="pill">${p.winner_count||1} pemenang</span></div>`).join('')||'<div class="empty">Hadiah belum diatur admin.</div>'}</div></div></main>`,'prizes')}
function login(){if(demoMode)return `<div class="login-wrap"><div class="login"><div class="logo-mini">🐾 LENDANG TAMPEL LAUQ QUIZ</div><h1>Mode Preview</h1><p class="muted">Website berhasil dimuat. Supabase belum dikonfigurasi, jadi halaman sedang berjalan dalam mode tampilan/demo.</p><div class="actions"><button class="btn gold" style="flex:1" onclick="go('home')">Kembali ke Beranda</button></div><div class="error">Isi config.js dengan Project URL dan anon key Supabase agar login, database, quiz, admin, dan chat aktif.</div></div></div>`;return `<div class="login-wrap"><div class="login"><div class="logo-mini">🐾 LENDANG TAMPEL LAUQ QUIZ</div><h1>Masuk ke Game</h1><div class="field"><label>Email</label><input id="email" type="email" placeholder="email@contoh.com"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div><div id="authmsg"></div><div class="actions"><button class="btn gold" style="flex:1" onclick="signIn()">Masuk</button><button class="btn" onclick="signUp()">Daftar</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="go('home')">← Kembali ke Beranda</button><p class="muted" style="font-size:12px;margin-top:18px">Akun admin tidak dibuat dari halaman ini. Buat akun Auth pertama lalu naikkan role menjadi admin melalui SQL.</p></div></div>`}
async function signIn(){
 const email=$('#email').value.trim(),password=$('#password').value;
 const{error}=await sb.auth.signInWithPassword({email,password});
 if(error)return $('#authmsg').innerHTML='<div class="error">'+esc(error.message)+'</div>';
 await getSession();
 if(!state.profile){
  return $('#authmsg').innerHTML='<div class="error">Profil akun belum ditemukan. Pastikan akun sudah memiliki data di tabel profiles.</div>';
 }
 await loadAll();
 routeAfterAuth();
}
async function signUp(){const email=$('#email').value.trim(),password=$('#password').value,name=prompt('Nama peserta:')||email.split('@')[0];const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)return $('#authmsg').innerHTML='<div class="error">'+esc(error.message)+'</div>';if(data.user)$('#authmsg').innerHTML='<div class="success">Pendaftaran berhasil. Jika email confirmation aktif, konfirmasi email lalu masuk.</div>'}
async function logout(){await sb.auth.signOut();state.user=null;state.profile=null;go('home')}
function openChatOrAdmin(){if(demoMode)return toast('Mode Preview','Live chat aktif setelah Supabase dikonfigurasi.');if(!state.user)return go('login');if(isAdmin()){state.adminTab='chat';return go('admin')}go('chat')}
async function startGame(id){if(!authGuard())return;const g=state.games.find(x=>x.id===id);if(!g)return;const{data,error}=await sb.from('questions').select('*').eq('game_id',id).eq('active',true).order('sort_order');if(error)return toast('Gagal',error.message);if(!data?.length)return toast('Game belum siap','Admin belum menambahkan soal aktif.');state.quiz={game:g,questions:data,index:0,answers:[],score:0,end:Date.now()+(g.duration_seconds||300)*1000};go('quiz')}
function quiz(){const q=state.quiz;if(!q)return games();const item=q.questions[q.index];return `<main class="container page"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><button class="btn" onclick="confirmQuit()">← Kembali</button><div class="timer" id="timer">--:--</div></div><div class="pill" style="margin-top:12px">Soal ${q.index+1}/${q.questions.length} • ${q.game.points||10} Poin</div><h2>${esc(item.question_text)}</h2>${item.image_base64?`<img class="preview" style="max-height:280px;width:100%;object-fit:contain" src="${esc(item.image_base64)}">`:''}<div style="margin-top:12px">${(item.options||[]).map((o,i)=>`<button class="quiz-option ${q.answers[q.index]===i?'selected':''}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="actions"><button class="btn gold" style="margin-left:auto" onclick="${q.index+1<q.questions.length?'nextQuestion()':'finishQuiz()'}">${q.index+1<q.questions.length?'Soal Berikutnya →':'Selesai & Lihat Hasil'}</button></div></div></main>`}
function answer(i){state.quiz.answers[state.quiz.index]=i;render()}function nextQuestion(){if(state.quiz.answers[state.quiz.index]===undefined)return toast('Pilih jawaban','Silakan pilih salah satu jawaban.');state.quiz.index++;render()}
async function finishQuiz(){const q=state.quiz;if(q.answers.length<q.questions.length)return toast('Belum selesai','Jawab semua soal terlebih dahulu.');let score=0;q.questions.forEach((x,i)=>{if(Number(q.answers[i])===Number(x.correct_index))score+=Number(x.points||q.game.points||10)});const{data:p}=await sb.from('profiles').select('points,xp,level').eq('id',state.user.id).single();const newPoints=Number(p?.points||0)+score,newXp=Number(p?.xp||0)+score,newLevel=Math.max(1,Math.floor(newXp/500)+1);await sb.from('profiles').update({points:newPoints,xp:newXp,level:newLevel,is_online:true,last_seen:new Date().toISOString()}).eq('id',state.user.id);const r=await sb.from('game_results').insert({user_id:state.user.id,game_id:q.game.id,score,answers:q.answers});if(r.error)return toast('Hasil gagal disimpan',r.error.message);state.quiz={result:{score,total:q.questions.reduce((a,x)=>a+Number(x.points||q.game.points||10),0)},game:q.game};await loadAll();go('result')}
function result(){return `<main class="container page"><div class="panel" style="text-align:center;padding:34px"><div style="font-size:80px">🏆</div><h1>Game Selesai!</h1><p class="muted">${esc(state.quiz?.game?.title||'Quiz')}</p><div style="font-size:58px;font-weight:1000;color:#ffd83b">${state.quiz?.result?.score||0}</div><p>Poin kamu</p><div class="actions" style="justify-content:center"><button class="btn gold" onclick="go('games')">Main Lagi</button><button class="btn" onclick="go('ranking')">Lihat Ranking</button><button class="btn" onclick="go('home')">Beranda</button></div></div></main>`}
function confirmQuit(){if(confirm('Keluar dari quiz? Progres saat ini akan hilang.'))go('games')}
function admin(){if(demoMode){toast('Mode Preview','Konfigurasi Supabase terlebih dahulu untuk membuka admin.');return home()}if(!isAdmin())return login();return `<main class="container page"><div class="panel"><div class="section-head"><div><h2>⚙️ Admin Dashboard</h2><div class="muted">Kelola seluruh isi aplikasi dari sini.</div></div><button class="btn" onclick="go('home')">Lihat Beranda</button></div><div class="tabs">${['overview','home','games','questions','prizes','chat','participants'].map(t=>`<button class="tab ${state.adminTab===t?'active':''}" onclick="adminTab('${t}')">${adminLabel(t)}</button>`).join('')}</div>${adminContent()}</div></main>`}
function adminLabel(t){return({overview:'Ringkasan',home:'Beranda',games:'Game',questions:'Soal',prizes:'Hadiah',chat:'Live Chat',participants:'Peserta'})[t]||t}
function adminTab(t){state.adminTab=t;render()}
function adminContent(){switch(state.adminTab){case'home':return adminHome();case'games':return adminGames();case'questions':return adminQuestions();case'prizes':return adminPrizes();case'chat':return adminChat();case'participants':return adminParticipants();default:return adminOverview()}}
function adminOverview(){return `<div class="admin-grid"><div class="stat">Peserta<strong>${state.players.length}</strong></div><div class="stat">Game<strong>${state.games.length}</strong></div><div class="stat">Hadiah<strong>${state.prizes.length}</strong></div><div class="stat">Status<strong style="font-size:20px;color:#25e69a">ONLINE</strong></div></div><div class="section panel"><h3>🔐 Akun Admin</h3><p class="muted">${esc(state.user?.email||'')}</p><p>Kelola konten beranda, game, soal, hadiah, peserta, dan live chat.</p><div class="actions"><button class="btn" onclick="seedDefaults()">Pasang Data Awal</button><button class="btn gold" onclick="go('home')">Preview Beranda</button></div></div>`}
function field(id,label,val,type='text'){return `<div class="field"><label>${esc(label)}</label><input id="f_${id}" type="${type}" value="${esc(val??'')}"></div>`}
function adminHome(){const s=state.settings;return `<h3>🏠 Pengaturan Beranda</h3><div class="formgrid">${field('site_title','Judul Website',s.site_title)}${field('tagline','Tagline',s.tagline)}${field('description','Deskripsi',s.description)}${field('encouragement','Pesan Motivasi',s.encouragement)}${field('default_prize','Total Hadiah Utama',s.default_prize,'number')}${field('default_winner_count','Jumlah Pemenang',s.default_winner_count,'number')}</div><div class="section formgrid"><div class="field"><label>Background Hero (Base64 terkompresi)</label><input type="file" accept="image/*" onchange="uploadSettingImage(this,'hero_bg')"><img class="preview" id="heroPreview" src="${esc(s.hero_bg||'')}" ${s.hero_bg?'':'style="display:none"'}></div><div class="field"><label>Maskot Kucing</label><input type="file" accept="image/*" onchange="uploadSettingImage(this,'mascot')"><img class="preview" id="mascotPreview" src="${esc(s.mascot||'')}" ${s.mascot?'':'style="display:none"'}></div></div><div class="actions"><button class="btn gold" onclick="saveHomeSettings()">Simpan Beranda</button></div>`}
async function upsertSetting(key,value){return sb.from('site_settings').upsert({key,value:{value},updated_at:new Date().toISOString()})}
async function saveHomeSettings(){for(const id of ['site_title','tagline','description','encouragement','default_prize','default_winner_count'])await upsertSetting(id,$('#f_'+id).value);await loadAll();toast('Berhasil','Pengaturan beranda disimpan.');render()}
async function uploadSettingImage(input,key){const file=input.files?.[0];if(!file)return;const data=await compressImage(file,1400,.72);const r=await upsertSetting(key,data);if(r.error)return toast('Gagal',r.error.message);state.settings[key]=data;const p=key==='hero_bg'?'#heroPreview':'#mascotPreview';$(p).src=data;$(p).style.display='block';toast('Upload berhasil','Gambar dikompres dan disimpan sebagai Base64.')}
function adminGames(){return `<div class="actions"><button class="btn gold" onclick="gameEditor()">＋ Tambah Game</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Game</th><th>Durasi</th><th>Poin</th><th>Aktif</th><th>Aksi</th></tr></thead><tbody>${state.games.map(g=>`<tr><td><b>${esc(g.title)}</b><br><small>${esc(g.description||'')}</small></td><td>${Math.round((g.duration_seconds||300)/60)} mnt</td><td>${g.points}</td><td>${g.active?'Ya':'Tidak'}</td><td><button class="btn" onclick='gameEditor(${JSON.stringify(g)})'>Edit</button> <button class="btn red" onclick="deleteGame('${g.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function gameEditor(g=null){modal(`<h2>${g?'Edit':'Tambah'} Game</h2><div class="formgrid">${field('g_title','Nama Game',g?.title||'Pengetahuan Umum')}${field('g_points','Poin Dasar',g?.points||10,'number')}${field('g_duration','Waktu (detik)',g?.duration_seconds||300,'number')}${field('g_sort','Urutan',g?.sort_order||0,'number')}<div class="field"><label>Deskripsi</label><textarea id="g_desc">${esc(g?.description||'')}</textarea></div><div class="field"><label>Icon</label><input id="g_icon" value="${esc(g?.icon||'🧠')}"></div><div class="field"><label>Status</label><select id="g_active"><option value="true" ${g?.active!==false?'selected':''}>Aktif</option><option value="false" ${g?.active===false?'selected':''}>Nonaktif</option></select></div></div><div class="field" style="margin-top:10px"><label>Cover Game</label><input id="g_file" type="file" accept="image/*" onchange="previewCompress(this,'g_cover')"><input id="g_cover" type="hidden" value="${esc(g?.cover_base64||'')}"><img id="g_cover_preview" class="preview" src="${esc(g?.cover_base64||'')}" ${g?.cover_base64?'':'style="display:none"'}></div><div class="actions"><button class="btn gold" onclick='saveGame(${JSON.stringify(g?.id||null)})'>Simpan</button><button class="btn" onclick="closeModal()">Batal</button></div>`)}
async function saveGame(id){const obj={title:$('#g_title').value,description:$('#g_desc').value,points:Number($('#g_points').value||10),duration_seconds:Number($('#g_duration').value||300),sort_order:Number($('#g_sort').value||0),icon:$('#g_icon').value,cover_base64:$('#g_cover').value,active:$('#g_active').value==='true'};const r=id?await sb.from('games').update(obj).eq('id',id):await sb.from('games').insert(obj);if(r.error)return toast('Gagal',r.error.message);closeModal();await loadAll();render()}
async function deleteGame(id){if(!confirm('Hapus game ini beserta soal-soalnya?'))return;const r=await sb.from('games').delete().eq('id',id);if(r.error)toast('Gagal',r.error.message);else{await loadAll();render()}}
async function previewCompress(input,target){const f=input.files?.[0];if(!f)return;const d=await compressImage(f,1200,.7);$('#'+target).value=d;$('#'+target+'_preview').src=d;$('#'+target+'_preview').style.display='block'}
async function compressImage(file,maxW=1200,quality=.72){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=url})}
async function adminQuestions(){const{data:games}=await sb.from('games').select('id,title').order('sort_order');const gid=state.selectedGame||games?.[0]?.id;if(gid)state.selectedGame=gid;const{data:q}=gid?await sb.from('questions').select('*').eq('game_id',gid).order('sort_order'):{data:[]};return `<div class="actions"><select onchange="state.selectedGame=this.value;render()">${(games||[]).map(g=>`<option value="${g.id}" ${g.id===gid?'selected':''}>${esc(g.title)}</option>`).join('')}</select><button class="btn gold" onclick="questionEditor()">＋ Tambah Soal</button></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Pertanyaan</th><th>Opsi</th><th>Kunci</th><th>Poin</th><th>Aksi</th></tr></thead><tbody>${(q||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.question_text)}${x.image_base64?' 📷':''}</td><td>${(x.options||[]).map(esc).join(' / ')}</td><td><b style="color:#ffd83b">${String.fromCharCode(65+Number(x.correct_index))}</b></td><td>${x.points}</td><td><button class="btn" onclick='questionEditor(${JSON.stringify(x)})'>Edit</button> <button class="btn red" onclick="deleteQuestion('${x.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
async function questionEditor(q=null){const{data:games}=await sb.from('games').select('id,title').order('sort_order');modal(`<h2>${q?'Edit':'Tambah'} Soal</h2><div class="field"><label>Game</label><select id="q_game">${(games||[]).map(g=>`<option value="${g.id}" ${(q?.game_id||state.selectedGame)===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Pertanyaan</label><textarea id="q_text">${esc(q?.question_text||'')}</textarea></div><div class="formgrid">${['A','B','C','D'].map((l,i)=>field('q_o'+i,'Opsi '+l,q?.options?.[i]||''))}${field('q_correct','Kunci Jawaban (0=A, 1=B, 2=C, 3=D)',q?.correct_index??0,'number')}${field('q_points','Poin Soal',q?.points||10,'number')}${field('q_time','Waktu Soal (detik, 0=ikuti game)',q?.time_seconds||0,'number')}${field('q_sort','Urutan',q?.sort_order||0,'number')}</div><div class="field" style="margin-top:10px"><label>Foto Soal (Base64 terkompresi)</label><input id="q_file" type="file" accept="image/*" onchange="previewCompress(this,'q_img')"><input id="q_img" type="hidden" value="${esc(q?.image_base64||'')}"><img id="q_img_preview" class="preview" src="${esc(q?.image_base64||'')}" ${q?.image_base64?'':'style="display:none"'}></div><div class="actions"><button class="btn gold" onclick='saveQuestion(${JSON.stringify(q?.id||null)})'>Simpan</button><button class="btn" onclick="closeModal()">Batal</button></div>`)}
async function saveQuestion(id){const options=[0,1,2,3].map(i=>$('#q_o'+i).value);const obj={game_id:$('#q_game').value,question_text:$('#q_text').value,options,correct_index:Number($('#q_correct').value||0),points:Number($('#q_points').value||10),time_seconds:Number($('#q_time').value||0),sort_order:Number($('#q_sort').value||0),image_base64:$('#q_img').value,active:true};if(obj.correct_index<0||obj.correct_index>3)return toast('Kunci tidak valid','Gunakan angka 0 sampai 3.');const r=id?await sb.from('questions').update(obj).eq('id',id):await sb.from('questions').insert(obj);if(r.error)return toast('Gagal',r.error.message);closeModal();render()}
async function deleteQuestion(id){if(!confirm('Hapus soal?'))return;const r=await sb.from('questions').delete().eq('id',id);if(r.error)toast('Gagal',r.error.message);else render()}
function adminPrizes(){return `<div class="actions"><button class="btn gold" onclick="prizeEditor()">＋ Tambah Hadiah</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Hadiah</th><th>Nominal</th><th>Pemenang</th><th>Aktif</th><th>Aksi</th></tr></thead><tbody>${state.prizes.map(p=>`<tr><td>${esc(p.icon||'🎁')} ${esc(p.title)}</td><td>Rp${Number(p.amount||0).toLocaleString('id-ID')}</td><td>${p.winner_count}</td><td>${p.active?'Ya':'Tidak'}</td><td><button class="btn" onclick='prizeEditor(${JSON.stringify(p)})'>Edit</button> <button class="btn red" onclick="deletePrize('${p.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function prizeEditor(p=null){modal(`<h2>${p?'Edit':'Tambah'} Hadiah</h2><div class="formgrid">${field('p_title','Nama Hadiah',p?.title||'Hadiah Utama')}${field('p_amount','Nominal',p?.amount||25000,'number')}${field('p_winners','Jumlah Pemenang',p?.winner_count||1,'number')}${field('p_icon','Icon',p?.icon||'🎁')}</div><div class="field" style="margin-top:10px"><label>Deskripsi</label><textarea id="p_desc">${esc(p?.description||'')}</textarea></div><div class="field"><label>Status</label><select id="p_active"><option value="true" ${p?.active!==false?'selected':''}>Aktif</option><option value="false" ${p?.active===false?'selected':''}>Nonaktif</option></select></div><div class="actions"><button class="btn gold" onclick='savePrize(${JSON.stringify(p?.id||null)})'>Simpan</button><button class="btn" onclick="closeModal()">Batal</button></div>`)}
async function savePrize(id){const obj={title:$('#p_title').value,amount:Number($('#p_amount').value||0),winner_count:Number($('#p_winners').value||1),icon:$('#p_icon').value,description:$('#p_desc').value,active:$('#p_active').value==='true',sort_order:0};const r=id?await sb.from('prizes').update(obj).eq('id',id):await sb.from('prizes').insert(obj);if(r.error)return toast('Gagal',r.error.message);closeModal();await loadAll();render()}
async function deletePrize(id){if(!confirm('Hapus hadiah?'))return;const r=await sb.from('prizes').delete().eq('id',id);if(r.error)toast('Gagal',r.error.message);else{await loadAll();render()}}
async function adminParticipants(){const{data}=await sb.from('profiles').select('*').eq('role','player').order('points',{ascending:false});return `<div class="tablewrap"><table class="table"><thead><tr><th>Peserta</th><th>Email</th><th>Level</th><th>Poin</th><th>Online</th><th>Aksi</th></tr></thead><tbody>${(data||[]).map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email||'-')}</td><td>${p.level||1}</td><td>${p.points||0}</td><td>${p.is_online?'🟢':'⚪'}</td><td><button class="btn" onclick="resetPoints('${p.id}')">Reset Poin</button></td></tr>`).join('')}</tbody></table></div>`}
async function resetPoints(id){if(!confirm('Reset poin peserta menjadi 0?'))return;const r=await sb.from('profiles').update({points:0,xp:0,level:1}).eq('id',id);if(r.error)toast('Gagal',r.error.message);else render()}
async function adminChat(){const{data}=await sb.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(200);state.chat=data||[];return `<div class="chatbox" id="chatbox">${state.chat.map(chatBubble).join('')||'<div class="empty">Belum ada pesan. Peserta hanya dapat membaca pesan admin.</div>'}</div><div class="actions"><input id="adminChatText" style="flex:1;min-width:220px;background:#031533;color:#fff;border:1px solid #1a5e99;border-radius:12px;padding:11px" placeholder="Tulis pengumuman/chat untuk semua peserta..."><button class="btn gold" onclick="sendAdminChat()">Kirim</button></div><p class="muted" style="font-size:12px">🔒 Peserta tidak memiliki izin INSERT ke tabel chat. Hanya admin yang dapat mengirim.</p>`}
function chatBubble(m){return `<div class="bubble ${m.sender_role==='admin'?'admin':'player'}"><b>${m.sender_role==='admin'?'👑 Admin':'👤 Peserta'}</b><div>${esc(m.message)}</div><small class="muted">${new Date(m.created_at).toLocaleString('id-ID')}</small></div>`}
async function sendAdminChat(){const t=$('#adminChatText').value.trim();if(!t)return;const r=await sb.from('chat_messages').insert({sender_role:'admin',sender_id:state.user.id,message:t});if(r.error)return toast('Gagal mengirim',r.error.message);$('#adminChatText').value='';await loadChat();render()}
async function loadChat(){const{data}=await sb.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(200);state.chat=data||[]}
function participantChat(){return `<main class="container page"><div class="panel"><div class="section-head"><h2>💬 Pengumuman Admin</h2><button class="btn" onclick="goBack()">← Kembali</button></div><div class="chatbox">${state.chat.map(chatBubble).join('')||'<div class="empty">Belum ada pengumuman admin.</div>'}</div><p class="muted">🔒 Peserta hanya dapat membaca pesan admin.</p></div></main>`}
function modal(html){let el=document.getElementById('modal');if(!el){el=document.createElement('div');el.id='modal';document.body.appendChild(el)}el.className='modal';el.innerHTML='<div class="modal-card">'+html+'</div>'}
function closeModal(){document.getElementById('modal')?.remove()}
async function seedDefaults(){if(!confirm('Pasang data game dan hadiah awal? Data baru akan ditambahkan.'))return;await sb.from('games').insert([{title:'Pengetahuan Umum',description:'Uji wawasanmu tentang berbagai hal.',icon:'💡',duration_seconds:300,points:10,sort_order:1,active:true},{title:'Keislaman',description:'Tingkatkan ilmu agama dan akhlak.',icon:'🕌',duration_seconds:300,points:10,sort_order:2,active:true},{title:'Sains & Teknologi',description:'Jelajahi dunia pengetahuan.',icon:'🔬',duration_seconds:300,points:10,sort_order:3,active:true},{title:'Hiburan',description:'Kuis seru untuk bersenang-senang.',icon:'⭐',duration_seconds:300,points:10,sort_order:4,active:true}]);await sb.from('prizes').insert([{title:'Hadiah Utama',description:'Hadiah untuk pemenang quiz.',amount:Number(state.settings.default_prize||25000),winner_count:Number(state.settings.default_winner_count||3),icon:'🎁',sort_order:1,active:true}]);await loadAll();toast('Berhasil','Data awal ditambahkan.');render()}
let timerId=null;function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(!state.quiz?.end){clearInterval(timerId);return}const left=Math.max(0,state.quiz.end-Date.now()),el=$('#timer');if(el){const sec=Math.ceil(left/1000),m=Math.floor(sec/60),s=sec%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}if(left<=0){clearInterval(timerId);toast('Waktu habis','Quiz akan diakhiri.');setTimeout(()=>finishQuiz(),200)}},250)}
function render(){const app=$('#app');if(state.view==='login'){app.innerHTML=login();return}let body=state.view==='home'?home():state.view==='games'?games():state.view==='ranking'?ranking():state.view==='participants'?participants():state.view==='prizes'?prizes():state.view==='quiz'?quiz():state.view==='result'?result():state.view==='chat'?layout(participantChat(),'participants'):state.view==='admin'?admin():home();app.innerHTML=body;if(state.view==='quiz')startTimer()}
function setupRealtime(){if(state.chatChannel)sb.removeChannel(state.chatChannel);state.chatChannel=sb.channel('public-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},payload=>{state.chat.push(payload.new);if(payload.new.sender_role==='admin'&&state.user?.id!==payload.new.sender_id){toast('💬 Pesan Admin',payload.new.message);if(state.view==='chat'||state.view==='admin'){loadChat().then(render)}}}).subscribe()}
if(sb)sb.auth.onAuthStateChange(async(event,session)=>{
 state.user=session?.user||null;
 if(state.user)await loadProfile();else state.profile=null;
 if(state.user)await loadAll();
 if(event==='SIGNED_IN'){
  routeAfterAuth();
 }else if(event==='SIGNED_OUT'){
  state.view='home';
  location.hash='home';
  render();
 }
});
(async()=>{
 await getSession();
 await loadAll();
 if(sb)setupRealtime();
 if(state.user){
  // Setelah refresh, admin selalu masuk Dashboard Admin; peserta masuk Beranda.
  state.view=isAdmin()?'admin':'home';
  location.hash=state.view;
 }else{
  const h=location.hash.replace('#','')||'home';
  state.view=h==='admin'?'login':h;
 }
 if(state.view==='chat'&&!state.user)state.view='login';
 render();
})();
Object.assign(window,{go,signIn,signUp,logout,startGame,answer,nextQuestion,finishQuiz,confirmQuit,adminTab,gameEditor,saveGame,deleteGame,questionEditor,saveQuestion,deleteQuestion,prizeEditor,savePrize,deletePrize,sendAdminChat,seedDefaults,closeModal,previewCompress,uploadSettingImage,saveHomeSettings,openChatOrAdmin});
})();
</script>
</body>
