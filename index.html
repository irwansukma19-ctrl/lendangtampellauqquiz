<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendang Tampel Lauq Quiz</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 900: '#312e81' },
                        dark: { 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        /* Simple Loader */
        .loader { border: 3px solid #334155; border-bottom-color: #6366f1; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- React, ReactDOM, Babel, Supabase -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext, useRef } = React;

        // --- CONTEXTS ---
        const AppContext = createContext();

        // --- UTILS ---
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        const formatDate = (dateString) => new Date(dateString).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });

        // --- COMPONENTS ---
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type="button" }) => {
            const baseStyle = "px-4 py-2 rounded-xl font-semibold transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-gradient-to-r from-brand-600 to-indigo-500 hover:from-brand-500 hover:to-indigo-400 text-white shadow-lg shadow-brand-500/30",
                secondary: "bg-slate-800 hover:bg-slate-700 text-white border border-slate-700",
                danger: "bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/20",
                success: "bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20",
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = 'text', value, onChange, placeholder, required = false, className="" }) => (
            <div class={`flex flex-col gap-1.5 ${className}`}>
                {label && <label className="text-sm font-medium text-slate-400">{label}</label>}
                <input 
                    type={type} value={value} onChange={onChange} placeholder={placeholder} required={required}
                    className="bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all placeholder:text-slate-600"
                />
            </div>
        );

        const SupabaseSetup = ({ onSave }) => {
            const [url, setUrl] = useState('');
            const [key, setKey] = useState('');

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass-card p-8 rounded-2xl w-full max-w-md shadow-2xl">
                        <div className="text-center mb-8">
                            <h1 className="text-2xl font-bold text-white mb-2">Setup Database</h1>
                            <p className="text-slate-400 text-sm">Masukkan kredensial Supabase Anda untuk memulai aplikasi.</p>
                        </div>
                        <div className="space-y-4">
                            <Input label="Supabase Project URL" placeholder="https://xyz.supabase.co" value={url} onChange={(e) => setUrl(e.target.value)} />
                            <Input label="Supabase Anon Key" type="password" placeholder="eyJh..." value={key} onChange={(e) => setKey(e.target.value)} />
                            <Button className="w-full mt-4" onClick={() => {
                                localStorage.setItem('sb_url', url); localStorage.setItem('sb_key', key); onSave(url, key);
                            }}>Hubungkan Aplikasi</Button>
                        </div>
                    </div>
                </div>
            )
        }

        const App = () => {
            const [supabase, setSupabase] = useState(null);
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [route, setRoute] = useState('home'); // home, quiz_list, leaderboard, chat, admin, profile, quiz_play, reward_claim
            const [activeQuizId, setActiveQuizId] = useState(null);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null); // {msg, type}

            const showToast = (msg, type = 'success') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                const initSupabase = async () => {
                    const savedUrl = localStorage.getItem('sb_url');
                    const savedKey = localStorage.getItem('sb_key');
                    if (savedUrl && savedKey) {
                        try {
                            const sb = window.supabase.createClient(savedUrl, savedKey);
                            setSupabase(sb);
                            
                            // Check Auth
                            const { data: { session } } = await sb.auth.getSession();
                            if (session?.user) {
                                setUser(session.user);
                                await fetchProfile(sb, session.user.id);
                            }

                            // Listen for auth changes
                            sb.auth.onAuthStateChange(async (_event, session) => {
                                setUser(session?.user || null);
                                if (session?.user) await fetchProfile(sb, session.user.id);
                                else setProfile(null);
                            });
                        } catch (err) {
                            console.error("Supabase init error", err);
                            localStorage.removeItem('sb_url'); localStorage.removeItem('sb_key');
                        }
                    }
                    setLoading(false);
                };
                initSupabase();
            }, []);

            const fetchProfile = async (sb, userId) => {
                const { data } = await sb.from('profiles').select('*').eq('id', userId).single();
                setProfile(data);
            };

            const navigate = (newRoute, params = {}) => {
                setRoute(newRoute);
                if (params.quizId) setActiveQuizId(params.quizId);
                window.scrollTo(0, 0);
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader w-12 h-12"></div></div>;
            if (!supabase) return <SupabaseSetup onSave={() => window.location.reload()} />;

            return (
                <AppContext.Provider value={{ supabase, user, profile, navigate, showToast }}>
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-4 right-4 z-50 animate-bounce">
                            <div className={`px-4 py-3 rounded-xl shadow-lg border ${toast.type === 'error' ? 'bg-red-900/90 border-red-500 text-red-200' : 'glass-card border-brand-500 text-white'}`}>
                                {toast.msg}
                            </div>
                        </div>
                    )}

                    <Navbar />
                    
                    <main className="flex-grow container mx-auto px-4 py-8 max-w-6xl">
                        {route === 'home' && <Home />}
                        {route === 'auth' && <Auth />}
                        {route === 'quiz_detail' && <QuizDetail quizId={activeQuizId} />}
                        {route === 'quiz_play' && <QuizEngine quizId={activeQuizId} />}
                        {route === 'leaderboard' && <Leaderboard />}
                        {route === 'chat' && <LiveChat />}
                        {route === 'profile' && <UserProfile />}
                        {route === 'admin' && profile?.role === 'admin' && <AdminDashboard />}
                    </main>

                    <Footer />
                </AppContext.Provider>
            );
        };

        const Navbar = () => {
            const { user, profile, navigate, supabase } = useContext(AppContext);
            const [isOpen, setIsOpen] = useState(false);

            const handleLogout = async () => {
                await supabase.auth.signOut();
                navigate('home');
                setIsOpen(false);
            };

            const NavLinks = () => (
                <>
                    <button onClick={() => {navigate('home'); setIsOpen(false)}} className="hover:text-brand-400 font-medium transition-colors">Beranda</button>
                    <button onClick={() => {navigate('leaderboard'); setIsOpen(false)}} className="hover:text-brand-400 font-medium transition-colors">Papan Skor</button>
                    <button onClick={() => {navigate('chat'); setIsOpen(false)}} className="hover:text-brand-400 font-medium transition-colors">Live Chat</button>
                    {profile?.role === 'admin' && (
                        <button onClick={() => {navigate('admin'); setIsOpen(false)}} className="text-amber-400 hover:text-amber-300 font-medium transition-colors">Admin Panel</button>
                    )}
                </>
            );

            return (
                <nav className="glass sticky top-0 z-40 border-b border-slate-800">
                    <div className="container mx-auto px-4 py-4 flex justify-between items-center max-w-6xl">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigate('home')}>
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/20">
                                LQ
                            </div>
                            <div>
                                <h1 className="font-bold text-lg text-white leading-tight">Lendang Tampel</h1>
                                <p className="text-xs text-brand-400 font-medium tracking-wider">LAUQ QUIZ</p>
                            </div>
                        </div>

                        {/* Desktop Nav */}
                        <div className="hidden md:flex items-center gap-8 text-sm text-slate-300">
                            <NavLinks />
                            {user ? (
                                <div className="flex items-center gap-4 border-l border-slate-700 pl-6">
                                    <button onClick={() => navigate('profile')} className="flex items-center gap-2 hover:text-white">
                                        <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center overflow-hidden">
                                            {profile?.avatar_url ? <img src={profile.avatar_url} className="w-full h-full object-cover"/> : <span className="text-xs">{profile?.name?.charAt(0)}</span>}
                                        </div>
                                        <span className="font-semibold truncate max-w-[100px]">{profile?.name}</span>
                                    </button>
                                    <button onClick={handleLogout} className="text-slate-500 hover:text-red-400">
                                        <i data-lucide="log-out" className="w-5 h-5"></i>
                                    </button>
                                </div>
                            ) : (
                                <Button onClick={() => navigate('auth')} variant="primary" className="text-sm py-1.5">Masuk / Daftar</Button>
                            )}
                        </div>

                        {/* Mobile Menu Toggle */}
                        <button className="md:hidden text-slate-300" onClick={() => setIsOpen(!isOpen)}>
                            <i data-lucide={isOpen ? "x" : "menu"} className="w-6 h-6"></i>
                        </button>
                    </div>

                    {/* Mobile Nav */}
                    {isOpen && (
                        <div className="md:hidden glass border-t border-slate-800 p-4 flex flex-col gap-4">
                            <NavLinks />
                            <hr className="border-slate-800" />
                            {user ? (
                                <>
                                    <button onClick={() => {navigate('profile'); setIsOpen(false)}} className="text-left font-medium">Profil Saya ({profile?.name})</button>
                                    <button onClick={handleLogout} className="text-left text-red-400 font-medium">Keluar</button>
                                </>
                            ) : (
                                <Button onClick={() => {navigate('auth'); setIsOpen(false)}} className="w-full">Masuk / Daftar</Button>
                            )}
                        </div>
                    )}
                </nav>
            );
        };

        const Footer = () => (
            <footer className="border-t border-slate-800 bg-slate-900/50 py-8 text-center text-slate-500 text-sm mt-auto">
                <p>&copy; {new Date().getFullYear()} Lendang Tampel Lauq Quiz. Asah Pengetahuan, Raih Hadiah.</p>
            </footer>
        );

        const Auth = () => {
            const { supabase, navigate, showToast } = useContext(AppContext);
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (isLogin) {
                        const { error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        showToast("Berhasil masuk!");
                        navigate('home');
                    } else {
                        const { error } = await supabase.auth.signUp({ 
                            email, password, 
                            options: { data: { name, phone } }
                        });
                        if (error) throw error;
                        showToast("Berhasil mendaftar! Anda sudah login.");
                        navigate('home');
                    }
                } catch (error) {
                    showToast(error.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-md mx-auto mt-10">
                    <div className="glass-card p-8 rounded-3xl shadow-xl border border-slate-700/50">
                        <div className="text-center mb-8">
                            <h2 className="text-2xl font-bold text-white mb-2">{isLogin ? 'Selamat Datang Kembali!' : 'Buat Akun Baru'}</h2>
                            <p className="text-slate-400 text-sm">Masuk untuk mengikuti quiz dan meraih hadiah DANA/Pulsa.</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <>
                                    <Input label="Nama Lengkap" value={name} onChange={e=>setName(e.target.value)} required />
                                    <Input label="Nomor WhatsApp" type="tel" value={phone} onChange={e=>setPhone(e.target.value)} required />
                                </>
                            )}
                            <Input label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} required />
                            <Input label="Password" type="password" value={password} onChange={e=>setPassword(e.target.value)} required />
                            
                            <Button type="submit" className="w-full mt-6 py-3" disabled={loading}>
                                {loading ? <span className="loader w-5 h-5 border-2"></span> : (isLogin ? 'Masuk' : 'Daftar Sekarang')}
                            </Button>
                        </form>

                        <div className="mt-6 text-center text-sm text-slate-400">
                            {isLogin ? "Belum punya akun? " : "Sudah punya akun? "}
                            <button onClick={() => setIsLogin(!isLogin)} className="text-brand-400 font-semibold hover:underline">
                                {isLogin ? 'Daftar di sini' : 'Masuk di sini'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Home = () => {
            const { supabase, navigate } = useContext(AppContext);
            const [quizzes, setQuizzes] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchQuizzes = async () => {
                    const { data } = await supabase.from('quizzes').select('*').eq('is_active', true).order('created_at', { ascending: false });
                    setQuizzes(data || []);
                    setLoading(false);
                };
                fetchQuizzes();
                // Re-init icons
                setTimeout(() => lucide.createIcons(), 100);
            }, []);

            return (
                <div className="space-y-16">
                    {/* Hero Section */}
                    <section className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand-900 to-slate-900 border border-slate-800 p-8 md:p-16 text-center">
                        <div className="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                        <div className="absolute -top-24 -left-24 w-64 h-64 bg-brand-500 rounded-full blur-[100px] opacity-30"></div>
                        <div className="absolute -bottom-24 -right-24 w-64 h-64 bg-indigo-500 rounded-full blur-[100px] opacity-30"></div>
                        
                        <div className="relative z-10 max-w-2xl mx-auto">
                            <span className="inline-block py-1 px-3 rounded-full bg-brand-500/20 text-brand-300 text-xs font-bold tracking-widest mb-6 border border-brand-500/30 uppercase">Platform Kuis Edukatif</span>
                            <h1 className="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 mb-6 leading-tight">
                                Jawab Kuis.<br/>Dapatkan Skor.<br/>Raih Hadiah.
                            </h1>
                            <p className="text-lg text-slate-300 mb-10">
                                Uji pengetahuan Anda, dapatkan nilai sempurna 100%, dan menangkan saldo DANA atau Pulsa langsung dari admin!
                            </p>
                            <div className="flex flex-col sm:flex-row justify-center gap-4">
                                <Button onClick={() => document.getElementById('quiz-section').scrollIntoView({behavior: 'smooth'})} className="px-8 py-4 text-lg">Mulai Main Sekarang</Button>
                                <Button onClick={() => navigate('leaderboard')} variant="secondary" className="px-8 py-4 text-lg">Lihat Papan Skor</Button>
                            </div>
                        </div>
                    </section>

                    {/* Stats / Info */}
                    <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="glass-card p-6 rounded-2xl flex flex-col items-center text-center">
                            <div className="w-14 h-14 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mb-4"><i data-lucide="check-circle" className="w-7 h-7"></i></div>
                            <h3 className="font-bold text-lg text-white mb-2">Kuis Pilihan Ganda</h3>
                            <p className="text-slate-400 text-sm">Jawab soal dengan cepat dan tepat. Hadiah default Rp25.000 untuk skor 100%.</p>
                        </div>
                        <div className="glass-card p-6 rounded-2xl flex flex-col items-center text-center">
                            <div className="w-14 h-14 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mb-4"><i data-lucide="pen-tool" className="w-7 h-7"></i></div>
                            <h3 className="font-bold text-lg text-white mb-2">Kuis Essay & Foto</h3>
                            <p className="text-slate-400 text-sm">Tantangan ekstra! Dinilai langsung oleh Admin. Hadiah spesial hingga Rp50.000.</p>
                        </div>
                        <div className="glass-card p-6 rounded-2xl flex flex-col items-center text-center">
                            <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mb-4"><i data-lucide="gift" className="w-7 h-7"></i></div>
                            <h3 className="font-bold text-lg text-white mb-2">Hadiah Menarik</h3>
                            <p className="text-slate-400 text-sm">Tersedia pencairan berupa saldo DANA atau Pulsa ke nomor HP Anda.</p>
                        </div>
                    </section>

                    {/* Active Quizzes */}
                    <section id="quiz-section">
                        <h2 className="text-2xl font-bold text-white mb-8 flex items-center gap-2"><i data-lucide="zap" className="text-brand-500"></i> Kuis Tersedia</h2>
                        
                        {loading ? (
                            <div className="text-center py-10"><div className="loader w-10 h-10"></div></div>
                        ) : quizzes.length === 0 ? (
                            <div className="glass-card p-10 rounded-2xl text-center text-slate-400">Belum ada kuis yang aktif saat ini. Tunggu admin membuka kuis ya!</div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {quizzes.map(q => (
                                    <div key={q.id} className="glass-card rounded-2xl overflow-hidden hover:shadow-xl hover:shadow-brand-500/10 transition-all duration-300 border border-slate-700/50 group">
                                        <div className="h-40 bg-slate-800 relative">
                                            {q.thumbnail_url ? (
                                                <img src={q.thumbnail_url} className="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-500" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 group-hover:scale-105 transition-transform duration-500">
                                                    <i data-lucide="help-circle" className="w-12 h-12 text-slate-700"></i>
                                                </div>
                                            )}
                                            <div className="absolute top-3 right-3 bg-black/50 backdrop-blur-sm text-xs font-bold px-3 py-1.5 rounded-full text-brand-300 border border-brand-500/30">
                                                {q.category || 'Umum'}
                                            </div>
                                        </div>
                                        <div className="p-6">
                                            <h3 className="font-bold text-xl text-white mb-2 line-clamp-1">{q.title}</h3>
                                            <div className="flex justify-between items-center text-sm text-slate-400 mb-6">
                                                <span className="flex items-center gap-1"><i data-lucide="clock" className="w-4 h-4"></i> {q.duration} Menit</span>
                                                <span className="text-emerald-400 font-semibold">{formatRupiah(q.reward_amount)}</span>
                                            </div>
                                            <Button onClick={() => navigate('quiz_detail', {quizId: q.id})} className="w-full">Lihat Detail</Button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </section>
                </div>
            );
        };

        const QuizDetail = ({ quizId }) => {
            const { supabase, navigate, user, showToast } = useContext(AppContext);
            const [quiz, setQuiz] = useState(null);
            const [questionsCount, setQuestionsCount] = useState(0);
            const [attempts, setAttempts] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadData = async () => {
                    if (!quizId) return navigate('home');
                    const [qRes, cRes] = await Promise.all([
                        supabase.from('quizzes').select('*').eq('id', quizId).single(),
                        supabase.from('questions').select('id', { count: 'exact' }).eq('quiz_id', quizId)
                    ]);
                    setQuiz(qRes.data);
                    setQuestionsCount(cRes.count);

                    if (user) {
                        const { data } = await supabase.from('attempts').select('*').eq('quiz_id', quizId).eq('user_id', user.id).order('created_at', {ascending: false});
                        setAttempts(data || []);
                    }
                    setLoading(false);
                };
                loadData();
                setTimeout(() => lucide.createIcons(), 100);
            }, [quizId, user]);

            const startQuiz = async () => {
                if (!user) return navigate('auth');
                
                // Check attempts limit
                if (attempts.length >= quiz.max_attempts) {
                    return showToast("Anda telah mencapai batas maksimal percobaan untuk kuis ini.", 'error');
                }

                // Check for in-progress attempt to resume
                const inProgress = attempts.find(a => a.status === 'in_progress');
                if (inProgress) {
                    navigate('quiz_play', {quizId: quiz.id});
                    return;
                }

                try {
                    const { data, error } = await supabase.from('attempts').insert({
                        quiz_id: quiz.id, user_id: user.id, status: 'in_progress'
                    }).select().single();
                    if (error) throw error;
                    navigate('quiz_play', {quizId: quiz.id});
                } catch(err) {
                    showToast(err.message, 'error');
                }
            };

            if (loading) return <div className="text-center py-20"><div className="loader w-10 h-10"></div></div>;

            return (
                <div className="max-w-3xl mx-auto">
                    <button onClick={()=>navigate('home')} className="text-slate-400 hover:text-white flex items-center gap-2 mb-6"><i data-lucide="arrow-left" className="w-4 h-4"></i> Kembali</button>
                    
                    <div className="glass-card rounded-3xl overflow-hidden border border-slate-700/50">
                        {quiz.thumbnail_url && <img src={quiz.thumbnail_url} className="w-full h-64 object-cover opacity-60" />}
                        <div className="p-8">
                            <h1 className="text-3xl font-bold text-white mb-4">{quiz.title}</h1>
                            <p className="text-slate-300 mb-8 whitespace-pre-wrap">{quiz.description}</p>
                            
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                                <div className="text-center">
                                    <div className="text-slate-500 text-xs mb-1 uppercase tracking-wider">Soal</div>
                                    <div className="text-lg font-semibold text-white">{questionsCount}</div>
                                </div>
                                <div className="text-center border-l border-slate-700">
                                    <div className="text-slate-500 text-xs mb-1 uppercase tracking-wider">Durasi</div>
                                    <div className="text-lg font-semibold text-white">{quiz.duration}m</div>
                                </div>
                                <div className="text-center border-l border-slate-700">
                                    <div className="text-slate-500 text-xs mb-1 uppercase tracking-wider">Kesempatan</div>
                                    <div className="text-lg font-semibold text-white">{attempts.length}/{quiz.max_attempts}</div>
                                </div>
                                <div className="text-center border-l border-slate-700">
                                    <div className="text-slate-500 text-xs mb-1 uppercase tracking-wider">Hadiah</div>
                                    <div className="text-lg font-semibold text-emerald-400">{formatRupiah(quiz.reward_amount)}</div>
                                </div>
                            </div>

                            <Button onClick={startQuiz} className="w-full py-4 text-lg">Mulai Kerjakan Sekarang</Button>
                        </div>
                    </div>

                    {/* History */}
                    {attempts.length > 0 && (
                        <div className="mt-8">
                            <h3 className="text-lg font-bold text-white mb-4">Riwayat Pengerjaan</h3>
                            <div className="space-y-3">
                                {attempts.map((a, i) => (
                                    <div key={a.id} className="glass-card p-4 rounded-xl flex justify-between items-center border border-slate-700/50">
                                        <div>
                                            <div className="text-white font-medium">Percobaan {attempts.length - i}</div>
                                            <div className="text-xs text-slate-400">{formatDate(a.started_at)}</div>
                                        </div>
                                        <div className="text-right">
                                            {a.status === 'in_progress' ? <span className="text-amber-400 font-semibold text-sm">Sedang Berjalan</span> :
                                             a.status === 'pending_review' ? <span className="text-brand-400 font-semibold text-sm">Menunggu Review Admin</span> :
                                             <span className={`font-bold text-lg ${a.percentage === 100 ? 'text-emerald-400' : 'text-slate-300'}`}>{a.percentage}%</span>
                                            }
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const QuizEngine = ({ quizId }) => {
            const { supabase, user, navigate, showToast } = useContext(AppContext);
            const [quiz, setQuiz] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [attempt, setAttempt] = useState(null);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            // Format: { question_id: { selected_answer: 'A', answer_text: '...', photo_url: '...' } }
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(0);
            const [uploading, setUploading] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [finished, setFinished] = useState(false);

            useEffect(() => {
                const initQuiz = async () => {
                    // Fetch Quiz, Questions, and current Attempt
                    const { data: qz } = await supabase.from('quizzes').select('*').eq('id', quizId).single();
                    const { data: qsts } = await supabase.from('questions').select('*').eq('quiz_id', quizId).order('created_at');
                    
                    // Fetch latest in-progress attempt
                    const { data: att } = await supabase.from('attempts').select('*')
                        .eq('quiz_id', quizId).eq('user_id', user.id).eq('status', 'in_progress')
                        .order('created_at', {ascending: false}).limit(1).single();

                    if (!att) { showToast("Sesi kuis tidak valid", 'error'); return navigate('home'); }

                    setQuiz(qz); setQuestions(qsts); setAttempt(att);
                    
                    // Calculate time left (in seconds)
                    const startTime = new Date(att.started_at).getTime();
                    const now = new Date().getTime();
                    const diff = (now - startTime) / 1000;
                    const remaining = Math.max(0, (qz.duration * 60) - diff);
                    setTimeLeft(Math.floor(remaining));
                    
                    if (remaining <= 0) handleAutoSubmit();
                };
                initQuiz();
            }, [quizId]);

            // Timer
            useEffect(() => {
                if (timeLeft <= 0 || finished) return;
                const t = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { clearInterval(t); handleAutoSubmit(); return 0; }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(t);
            }, [timeLeft, finished]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60); const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleAnswerChange = (qId, field, value) => {
                setAnswers(prev => ({
                    ...prev,
                    [qId]: { ...prev[qId], [field]: value }
                }));
            };

            const handlePhotoUpload = async (e, qId) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) return showToast("Ukuran foto maksimal 2MB", 'error');
                
                setUploading(true);
                const fileExt = file.name.split('.').pop();
                const fileName = `${user.id}_${qId}_${Math.random()}.${fileExt}`;
                
                try {
                    const { error, data } = await supabase.storage.from('answer-photos').upload(fileName, file);
                    if (error) throw error;
                    
                    const { data: publicUrlData } = supabase.storage.from('answer-photos').getPublicUrl(fileName);
                    handleAnswerChange(qId, 'photo_url', publicUrlData.publicUrl);
                    showToast("Foto berhasil diupload");
                } catch(err) {
                    showToast("Gagal upload foto", 'error');
                } finally {
                    setUploading(false);
                }
            };

            const handleSubmit = async () => {
                if (!confirm("Yakin ingin mengumpulkan jawaban sekarang?")) return;
                await processSubmission();
            };

            const handleAutoSubmit = async () => {
                showToast("Waktu habis! Menyimpan otomatis...", 'error');
                await processSubmission();
            };

            const processSubmission = async () => {
                setSubmitting(true);
                setFinished(true);
                
                // Format payload for secure RPC function
                const payload = questions.map(q => ({
                    question_id: q.id,
                    selected_answer: answers[q.id]?.selected_answer || null,
                    answer_text: answers[q.id]?.answer_text || null,
                    photo_url: answers[q.id]?.photo_url || null
                }));

                try {
                    // Call the secure RPC function to grade on server
                    const { error } = await supabase.rpc('submit_quiz_attempt', {
                        p_attempt_id: attempt.id,
                        p_answers: payload
                    });
                    
                    if (error) throw error;
                    
                    // Fetch updated attempt to see result
                    const { data: updatedAttempt } = await supabase.from('attempts').select('*').eq('id', attempt.id).single();
                    setAttempt(updatedAttempt);
                    
                } catch(err) {
                    showToast("Gagal menyimpan kuis: " + err.message, 'error');
                    setFinished(false);
                } finally {
                    setSubmitting(false);
                }
            };

            if (!quiz || !questions.length) return <div className="text-center py-20"><div className="loader"></div></div>;

            // --- RENDER RESULT VIEW ---
            if (finished && !submitting) {
                const isPerfect = attempt.percentage === 100;
                const isPending = attempt.status === 'pending_review';
                
                return (
                    <div className="max-w-2xl mx-auto text-center">
                        <div className="glass-card p-10 rounded-3xl border border-slate-700/50 shadow-2xl">
                            {isPending ? (
                                <>
                                    <div className="w-20 h-20 bg-brand-500/20 text-brand-400 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="clock" className="w-10 h-10"></i></div>
                                    <h2 className="text-2xl font-bold text-white mb-2">Jawaban Tersimpan!</h2>
                                    <p className="text-slate-400 mb-6">Jawaban essay/foto Anda sedang menunggu pemeriksaan dari Admin. Cek riwayat secara berkala.</p>
                                    <Button onClick={()=>navigate('home')} className="mx-auto">Kembali ke Beranda</Button>
                                </>
                            ) : isPerfect ? (
                                <>
                                    <div className="w-24 h-24 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="award" className="w-12 h-12"></i></div>
                                    <h2 className="text-3xl font-bold text-emerald-400 mb-2">🎉 SELAMAT! 🎉</h2>
                                    <p className="text-slate-300 text-lg mb-6">Nilai Anda 100% Sempurna! Anda berhak mengklaim hadiah <strong className="text-white">{formatRupiah(quiz.reward_amount)}</strong>.</p>
                                    <RewardClaimForm quiz={quiz} attempt={attempt} />
                                </>
                            ) : (
                                <>
                                    <div className="text-7xl font-bold text-white mb-4">{Number(attempt.percentage).toFixed(0)}%</div>
                                    <p className="text-slate-400 mb-8">Skor: {attempt.score} dari {attempt.total_points}</p>
                                    <h3 className="text-xl font-bold text-amber-400 mb-4">Belum Berhasil Mendapatkan Hadiah</h3>
                                    <p className="text-slate-400 mb-8">Dibutuhkan nilai 100% untuk mengklaim hadiah. Jangan menyerah!</p>
                                    <div className="flex justify-center gap-4">
                                        <Button onClick={()=>navigate('quiz_detail', {quizId: quiz.id})} variant="primary">Ulangi Kuis</Button>
                                        <Button onClick={()=>navigate('home')} variant="secondary">Kembali</Button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                );
            }

            // --- RENDER QUIZ ENGINE ---
            const currentQ = questions[currentIndex];

            return (
                <div className="max-w-3xl mx-auto">
                    {/* Header: Timer & Progress */}
                    <div className="glass-card p-4 rounded-2xl flex justify-between items-center mb-6 sticky top-20 z-30">
                        <div className="text-sm font-semibold text-slate-400">Soal {currentIndex + 1} / {questions.length}</div>
                        <div className={`text-xl font-mono font-bold flex items-center gap-2 ${timeLeft < 60 ? 'text-red-400 animate-pulse' : 'text-brand-400'}`}>
                            <i data-lucide="timer" className="w-5 h-5"></i> {formatTime(timeLeft)}
                        </div>
                    </div>

                    {/* Question Card */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl border border-slate-700/50 mb-6">
                        <h3 className="text-xl md:text-2xl font-medium text-white mb-8">{currentQ.question}</h3>
                        
                        {/* MCQ */}
                        {currentQ.question_type === 'mcq' && (
                            <div className="space-y-3">
                                {['A', 'B', 'C', 'D'].map(opt => (
                                    currentQ[`option_${opt.toLowerCase()}`] && (
                                        <label key={opt} className={`flex items-start gap-4 p-4 rounded-xl cursor-pointer border transition-all ${answers[currentQ.id]?.selected_answer === opt ? 'bg-brand-500/20 border-brand-500 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'bg-slate-800/50 border-slate-700 hover:bg-slate-800'}`}>
                                            <input type="radio" name={`q_${currentQ.id}`} value={opt} 
                                                checked={answers[currentQ.id]?.selected_answer === opt}
                                                onChange={() => handleAnswerChange(currentQ.id, 'selected_answer', opt)}
                                                className="mt-1 w-5 h-5 accent-brand-500" />
                                            <span className="text-slate-200 text-lg leading-snug">{currentQ[`option_${opt.toLowerCase()}`]}</span>
                                        </label>
                                    )
                                ))}
                            </div>
                        )}

                        {/* Essay */}
                        {currentQ.question_type === 'essay' && (
                            <textarea 
                                className="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-white min-h-[150px] focus:outline-none focus:border-brand-500"
                                placeholder="Ketik jawaban Anda di sini..."
                                value={answers[currentQ.id]?.answer_text || ''}
                                onChange={(e) => handleAnswerChange(currentQ.id, 'answer_text', e.target.value)}
                            ></textarea>
                        )}

                        {/* Photo Upload */}
                        {currentQ.requires_photo && (
                            <div className="mt-8 p-6 bg-slate-900/50 border border-dashed border-slate-600 rounded-xl">
                                <label className="block text-sm font-semibold text-slate-400 mb-2">Upload Foto (Wajib)</label>
                                {answers[currentQ.id]?.photo_url ? (
                                    <div className="relative group rounded-xl overflow-hidden">
                                        <img src={answers[currentQ.id].photo_url} className="w-full h-48 object-cover" />
                                        <div className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                            <label className="cursor-pointer bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium">
                                                Ganti Foto
                                                <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(e, currentQ.id)} />
                                            </label>
                                        </div>
                                    </div>
                                ) : (
                                    <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-700 border-dashed rounded-xl cursor-pointer bg-slate-800 hover:bg-slate-700 transition-colors">
                                        <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                            {uploading ? <span className="loader w-6 h-6 border-2 border-brand-500"></span> : (
                                                <>
                                                    <i data-lucide="camera" className="w-8 h-8 text-slate-400 mb-2"></i>
                                                    <p className="text-sm text-slate-400"><span className="font-semibold">Klik untuk upload</span> foto</p>
                                                </>
                                            )}
                                        </div>
                                        <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(e, currentQ.id)} disabled={uploading} />
                                    </label>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Navigation Buttons */}
                    <div className="flex justify-between items-center">
                        <Button variant="secondary" onClick={() => setCurrentIndex(p=>Math.max(0, p-1))} disabled={currentIndex === 0}>Sebelumnya</Button>
                        
                        {currentIndex === questions.length - 1 ? (
                            <Button variant="primary" className="px-8" onClick={handleSubmit} disabled={submitting}>
                                {submitting ? 'Menyimpan...' : 'Kumpulkan Jawaban'}
                            </Button>
                        ) : (
                            <Button variant="primary" onClick={() => setCurrentIndex(p=>p+1)}>Selanjutnya</Button>
                        )}
                    </div>
                </div>
            );
        };

        const RewardClaimForm = ({ quiz, attempt }) => {
            const { supabase, user, showToast } = useContext(AppContext);
            const [rewardType, setRewardType] = useState('Pulsa');
            const [number, setNumber] = useState('');
            const [name, setName] = useState('');
            const [loading, setLoading] = useState(false);
            const [submitted, setSubmitted] = useState(false);

            const onSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const { error } = await supabase.from('rewards').insert({
                        user_id: user.id, quiz_id: quiz.id, attempt_id: attempt.id,
                        reward_type: rewardType, amount: quiz.reward_amount, recipient_number: number, recipient_name: name
                    });
                    if (error) throw error;
                    setSubmitted(true);
                } catch(err) {
                    showToast(err.message, 'error');
                } finally { setLoading(false); }
            };

            if (submitted) {
                return (
                    <div className="mt-8 p-6 bg-brand-900/30 border border-brand-500/50 rounded-2xl">
                        <h3 className="text-xl font-bold text-white mb-2">Permintaan Hadiah Terkirim!</h3>
                        <p className="text-slate-300">Admin akan segera memproses hadiah Anda. Cek statusnya di halaman Profil -> Riwayat Hadiah.</p>
                    </div>
                );
            }

            return (
                <form onSubmit={onSubmit} className="mt-8 text-left bg-slate-900/50 p-6 rounded-2xl border border-slate-700">
                    <h3 className="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2">Klaim Hadiah Anda</h3>
                    <div className="space-y-4">
                        <div className="flex gap-4 mb-4">
                            <label className={`flex-1 flex justify-center p-3 rounded-xl border cursor-pointer transition-all ${rewardType==='Pulsa'?'bg-brand-600 border-brand-400 text-white':'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                <input type="radio" name="r_type" className="hidden" checked={rewardType==='Pulsa'} onChange={()=>setRewardType('Pulsa')} /> Pulsa
                            </label>
                            <label className={`flex-1 flex justify-center p-3 rounded-xl border cursor-pointer transition-all ${rewardType==='DANA'?'bg-blue-600 border-blue-400 text-white':'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                <input type="radio" name="r_type" className="hidden" checked={rewardType==='DANA'} onChange={()=>setRewardType('DANA')} /> DANA
                            </label>
                        </div>
                        <Input label={`Nomor HP / ${rewardType}`} value={number} onChange={e=>setNumber(e.target.value)} required placeholder="Contoh: 081234567890" />
                        {rewardType === 'DANA' && <Input label="Nama Pemilik Akun DANA" value={name} onChange={e=>setName(e.target.value)} required />}
                        <Button type="submit" className="w-full mt-4" disabled={loading}>{loading ? 'Memproses...' : 'Kirim Permintaan'}</Button>
                    </div>
                </form>
            );
        };

        const Leaderboard = () => {
            const { supabase } = useContext(AppContext);
            const [leaders, setLeaders] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchLeaders = async () => {
                    // Fetching from the view we created in SQL
                    const { data } = await supabase.from('leaderboard').select('*').limit(50);
                    setLeaders(data || []);
                    setLoading(false);
                    setTimeout(() => lucide.createIcons(), 100);
                };
                fetchLeaders();
            }, []);

            const maskName = (name) => {
                if (!name) return 'Anonim';
                const parts = name.split(' ');
                if (parts.length > 1) {
                    return `${parts[0]} ${parts[1].charAt(0)}.`;
                }
                return name.substring(0, name.length - 2) + '**';
            }

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="text-center mb-10">
                        <div className="inline-block p-4 bg-brand-500/20 rounded-full mb-4">
                            <i data-lucide="trophy" className="w-10 h-10 text-brand-400"></i>
                        </div>
                        <h1 className="text-3xl font-bold text-white mb-2">Papan Skor Global</h1>
                        <p className="text-slate-400">Peringkat berdasarkan persentase tertinggi dan total skor terbanyak.</p>
                    </div>

                    {loading ? <div className="text-center py-10"><div className="loader"></div></div> : (
                        <div className="glass-card rounded-3xl overflow-hidden border border-slate-700/50">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-900/80 text-slate-400 text-sm uppercase tracking-wider">
                                        <tr>
                                            <th className="px-6 py-4 font-medium">Rank</th>
                                            <th className="px-6 py-4 font-medium">Peserta</th>
                                            <th className="px-6 py-4 font-medium text-center">Total Kuis</th>
                                            <th className="px-6 py-4 font-medium text-center">Skor Tertinggi</th>
                                            <th className="px-6 py-4 font-medium text-right">Total Poin</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/50">
                                        {leaders.map((l, i) => (
                                            <tr key={l.user_id} className={`hover:bg-slate-800/30 transition-colors ${i < 3 ? 'bg-gradient-to-r from-brand-900/20 to-transparent' : ''}`}>
                                                <td className="px-6 py-4">
                                                    {i === 0 ? <span className="text-2xl">🥇</span> :
                                                     i === 1 ? <span className="text-2xl">🥈</span> :
                                                     i === 2 ? <span className="text-2xl">🥉</span> :
                                                     <span className="text-slate-500 font-bold ml-2">{i + 1}</span>}
                                                </td>
                                                <td className="px-6 py-4">
                                                    <div className="font-semibold text-white">{maskName(l.name)}</div>
                                                </td>
                                                <td className="px-6 py-4 text-center text-slate-300">{l.total_quizzes}</td>
                                                <td className="px-6 py-4 text-center">
                                                    <span className={`px-2 py-1 rounded text-xs font-bold ${l.highest_score == 100 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-300'}`}>{Number(l.highest_score).toFixed(0)}%</span>
                                                </td>
                                                <td className="px-6 py-4 text-right font-mono text-brand-400 font-bold">{l.total_score}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {leaders.length === 0 && <div className="text-center py-10 text-slate-500">Belum ada data skor.</div>}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LiveChat = () => {
            const { supabase, user, profile, navigate } = useContext(AppContext);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const chatEndRef = useRef(null);

            useEffect(() => {
                const fetchChats = async () => {
                    const { data } = await supabase.from('chat_messages').select('*, profiles(name, avatar_url, role)').eq('is_deleted', false).order('created_at', { ascending: true }).limit(50);
                    setMessages(data || []);
                    setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 200);
                };
                fetchChats();

                // Setup Realtime Subscription
                const channel = supabase.channel('public-chat')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                        // Fetch relation data manually since realtime payload doesn't include joined tables
                        supabase.from('profiles').select('name, avatar_url, role').eq('id', payload.new.user_id).single().then(({data}) => {
                            setMessages(prev => [...prev, { ...payload.new, profiles: data }]);
                            setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                        });
                    })
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_messages' }, payload => {
                        if (payload.new.is_deleted) {
                            setMessages(prev => prev.filter(m => m.id !== payload.new.id));
                        }
                    })
                    .subscribe();

                return () => { supabase.removeChannel(channel); };
            }, []);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || !user) return;
                const msg = input.trim();
                setInput('');
                await supabase.from('chat_messages').insert({ user_id: user.id, message: msg, is_admin: profile?.role === 'admin' });
            };

            const deleteMessage = async (id) => {
                if (profile?.role !== 'admin') return;
                await supabase.from('chat_messages').update({ is_deleted: true }).eq('id', id);
            };

            return (
                <div className="max-w-3xl mx-auto h-[80vh] flex flex-col">

                        <button onClick={()=>setActiveTab('overview')} className={`w-full text-left px-4 py-3 rounded-xl transition-colors font-medium flex items-center gap-3 ${activeTab==='overview'?'bg-brand-600 text-white':'text-slate-400 hover:bg-slate-800'}`}><i data-lucide="layout-dashboard" className="w-5 h-5"></i> Overview</button>

                        <button onClick={()=>setActiveTab('review')} className={`w-full text-left px-4 py-3 rounded-xl transition-colors font-medium flex items-center gap-3 justify-between ${activeTab==='review'?'bg-brand-600 text-white':'text-slate-400 hover:bg-slate-800'}`}>
                            <div className="flex items-center gap-3"><i data-lucide="check-square" className="w-5 h-5"></i> Review Essay {stats.pendingReview > 0 && <span className="bg-amber-500 text-black text-[10px] px-2 py-0.5 rounded-full">{stats.pendingReview}</span>}</div>

                                    <div className="bg-slate-900/80 p-5 rounded-2xl border border-amber-500/30 text-center"><div className="text-amber-400 text-sm mb-1">Menunggu Review</div><div className="text-3xl font-bold text-amber-400">{stats.pendingReview}</div></div>
                                    <div className="bg-slate-900/80 p-5 rounded-2xl border border-emerald-500/30 text-center"><div className="text-emerald-400 text-sm mb-1">Menunggu Hadiah</div><div className="text-3xl font-bold text-emerald-400">{stats.pendingRewards}</div></div>
