        function App() {
            const [session, setSession] = useState(null);

            const [toastMsg, setToastMsg] = useState(null);
            const [onlineUsers, setOnlineUsers] = useState([]); // Variabel untuk menyimpan data peserta online

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session); checkUserRole(session?.user);
                });

                const { data: authListener } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session); checkUserRole(session?.user);
                });
                return () => { authListener.subscription.unsubscribe(); };
            }, []);

            const checkUserRole = async (user) => {
                if (!user) { setUserRole(null); setLoading(false); return; }
                const { data } = await supabase.from('profiles').select('role, name').eq('id', user.id).single();
                if (data) { setUserName(data.name); setUserRole(data.role); }
                else if (user.email && !user.email.includes('@peserta.quiz')) { setUserRole('admin'); setUserName('Admin'); }
                else { setUserRole('peserta'); }
                setLoading(false);
            };

            const logout = async () => { await supabase.auth.signOut(); setView('home'); };
            
            useEffect(() => {
                if (!session || !userName || !userRole) return;
                
                // Membuat channel khusus untuk melacak siapa saja yang online
                const presenceChannel = supabase.channel('online-users');

                presenceChannel
                    .on('presence', { event: 'sync' }, () => {
                        const state = presenceChannel.presenceState();
                        const users = [];
                        for (const id in state) {
                            if (state[id] && state[id].length > 0) {
                                users.push(state[id][0]); // Ambil data status terbaru tiap user
                            }
                        }
                        setOnlineUsers(users);
                    })
                    .subscribe(async (status) => {
                        if (status === 'SUBSCRIBED') {
                            // Saat tersambung, laporkan kehadiran diri sendiri ke server
                            await presenceChannel.track({ 
                                user_id: session.user.id, 
                                user_name: userName, 
                                role: userRole 
                            });
                        }
                    });

                return () => { supabase.removeChannel(presenceChannel); };
            }, [session, userName, userRole]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 3000);
            };

                                        {userRole === 'peserta' && <button onClick={() => setView('leaderboard')} className="text-sm bg-brand-600 hover:bg-brand-500 text-white px-3 py-2 rounded-lg font-bold transition shadow-lg">🏆 Papan Skor</button>}

                                )}

                    <main className="flex-1 w-full max-w-6xl mx-auto px-4 pb-12">
                        {!session && view === 'home' && <ParticipantLogin />}
                        {!session && view === 'admin_login' && <AdminLogin setView={setView} />}

        function BroadcastPopup() {
            const [message, setMessage] = useState(null);

            useEffect(() => {
                const channel = supabase.channel('public:chat_messages')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                        setMessage(payload.new);
                    }).subscribe();
                return () => { supabase.removeChannel(channel); };
            }, []);

            if (!message) return null;

            return (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-gradient-to-b from-yellow-400 to-yellow-600 rounded-3xl p-8 max-w-lg w-full text-center shadow-[0_0_80px_rgba(250,204,21,0.6)] animate-fade-in-up border-4 border-yellow-300">

                            <p className="text-2xl text-slate-900 font-bold leading-relaxed">{message.message}</p>
                        </div>
                        <button onClick={() => setMessage(null)} className="w-full bg-slate-900 text-yellow-400 font-bold text-xl px-8 py-4 rounded-xl hover:bg-slate-800 transition shadow-2xl">
                            SIAP, LAKSANAKAN!
                        </button>
                    </div>
                </div>
            );
        }

        function Leaderboard() {
            const [scores, setScores] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchScores = async () => {
                    // Ambil seluruh attempts untuk mengakumulasi skor
                    const { data } = await supabase.from('attempts').select('score, user_id, profiles(name)');
                    
                    if (data) {
                        const grouped = {};
                        data.forEach(d => {
                            if (!grouped[d.user_id]) grouped[d.user_id] = { name: d.profiles?.name || 'Anonim', totalScore: 0 };
                            grouped[d.user_id].totalScore += (d.score || 0);
                        });
                        
                        // Sort by totalScore Descending
                        const sorted = Object.values(grouped).sort((a, b) => b.totalScore - a.totalScore);
                        setScores(sorted.slice(0, 20)); // Top 20
                    }
                    setLoading(false);
                };
                fetchScores();
            }, []);

            return (
                <div className="glass-card rounded-3xl p-6 md:p-10 border-t-4 border-t-brand-500 animate-fade-in-up">
                    <h2 className="text-4xl font-bubble text-transparent bg-clip-text bg-gradient-to-r from-brand-300 to-brand-500 mb-2 text-center">🏆 Papan Skor Global</h2>
                    <p className="text-center text-slate-400 mb-8 font-semibold">Akumulasi Poin dari Semua Sesi. Siapa Cepat Capai 1000 Poin, Dia Dapat!</p>
                    {loading ? <p className="text-center text-slate-400">Memuat data balapan...</p> : (
                        <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="border-b-2 border-slate-700 text-brand-400 text-lg">
                                        <th className="p-4">Rank</th>
                                        <th className="p-4">Nama Pahlawan</th>
                                        <th className="p-4 text-right">Total Akumulasi Poin</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {scores.map((s, idx) => (
                                        <tr key={idx} className="border-b border-slate-700/50 hover:bg-slate-800/80 transition-colors">
                                            <td className="p-4 font-bold text-2xl">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}</td>
                                            <td className="p-4 font-bold text-lg text-white">{s.name}</td>
                                            <td className="p-4 text-right">
                                                <span className={`px-4 py-2 rounded-xl font-bold text-lg shadow-lg ${s.totalScore >= 1000 ? 'bg-yellow-500 text-slate-900 border-2 border-yellow-400' : 'bg-slate-800 text-brand-400'}`}>
                                                    {s.totalScore} Pts
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                    {scores.length === 0 && <tr><td colSpan="3" className="text-center py-8 text-slate-500">Belum ada skor tercatat. Ayo mainkan kuis!</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

                try {

                            throw new Error("Maaf, kuota pendaftaran maksimal 50 peserta sudah penuh.");

                        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email: pseudoEmail, password: pseudoPassword });
        function AdminDashboard({ showToast, onlineUsers }) {

                        <button onClick={()=>setTab('kuis')} className={`flex-1 min-w-[120px] p-4 font-bold transition ${tab==='kuis'?'bg-purple-600 text-white':'text-slate-400 hover:bg-slate-700'}`}>📝 Kuis</button>
                        <button onClick={()=>setTab('essay')} className={`flex-1 min-w-[120px] p-4 font-bold transition ${tab==='essay'?'bg-brand-600 text-white':'text-slate-400 hover:bg-slate-700'}`}>📄 Essay</button>
                        <button onClick={()=>setTab('hadiah')} className={`flex-1 min-w-[120px] p-4 font-bold transition ${tab==='hadiah'?'bg-green-600 text-white':'text-slate-400 hover:bg-slate-700'}`}>💰 Hadiah</button>
                        <button onClick={()=>setTab('skor')} className={`flex-1 min-w-[120px] p-4 font-bold transition ${tab==='skor'?'bg-blue-600 text-white':'text-slate-400 hover:bg-slate-700'}`}>🏆 Skor & Reset</button>
                        <button onClick={()=>setTab('broadcast')} className={`flex-1 min-w-[120px] p-4 font-bold transition ${tab==='broadcast'?'bg-yellow-500 text-slate-900':'text-slate-400 hover:bg-slate-700'}`}>📢 Broadcast</button>
                        {/* Tab baru untuk melihat Peserta Online */}

                    <div className="p-6 md:p-10">

        function AdminOnlineMonitor({ onlineUsers }) {
            // Kita filter hanya menampilkan yang rolenya 'peserta'
            const pesertaOnline = onlineUsers?.filter(u => u.role === 'peserta') || [];

                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

                </div>
            );

        function AdminLeaderboardManager({ showToast }) {
            const [scores, setScores] = useState([]);
            const [confirmReset, setConfirmReset] = useState(false);

            useEffect(() => { loadScores(); }, []);
            const loadScores = async () => {
                const { data } = await supabase.from('attempts').select('score, user_id, profiles(name)');
                if (data) {
                    const grouped = {};
                    data.forEach(d => {
                        if (!grouped[d.user_id]) grouped[d.user_id] = { name: d.profiles?.name || 'Anonim', totalScore: 0 };
                        grouped[d.user_id].totalScore += (d.score || 0);
                    });
                    const sorted = Object.values(grouped).sort((a, b) => b.totalScore - a.totalScore);
                    setScores(sorted);
                }
            };

            const resetAllScores = async () => {
                // Delete all rows in attempts to reset points
                await supabase.from('attempts').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                showToast('Semua Riwayat Poin Berhasil Dihapus!');
                setConfirmReset(false);
                loadScores();
            };

            return (
                <div className="animate-fade-in-up">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="font-bold text-2xl text-white">Kelola Papan Skor</h3>
                        <button onClick={() => confirmReset ? resetAllScores() : setConfirmReset(true)} className={`px-6 py-3 rounded-xl font-bold transition shadow-lg ${confirmReset ? 'bg-red-600 text-white animate-pulse' : 'bg-red-500/20 text-red-400 hover:bg-red-600 hover:text-white'}`}>
                            {confirmReset ? 'YAKIN HAPUS SEMUA POIN?' : 'Reset Semua Poin & Riwayat'}
                        </button>
                    </div>
                    
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">

                                        <td className="p-3 font-bold">{idx + 1}</td><td className="p-3 text-white">{s.name}</td><td className="p-3 text-yellow-400 font-bold">{s.totalScore}</td>
                                    </tr>
                                ))}
                                {scores.length === 0 && <tr><td colSpan="3" className="text-center py-6 text-slate-400">Belum ada skor tercatat.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function AdminBroadcast({ showToast }) {
            const [msg, setMsg] = useState('');
            const [history, setHistory] = useState([]);
            const [confirmId, setConfirmId] = useState(null);

            useEffect(() => { loadHistory(); }, []);
            const loadHistory = async () => {
                const { data } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: false });
                if (data) setHistory(data);
            };

            const sendBroadcast = async (e) => {
                e.preventDefault();
                await supabase.from('chat_messages').insert({ user_id: (await supabase.auth.getUser()).data.user.id, user_name: 'ADMINISTRATOR', message: msg });
                setMsg(''); showToast('Pesan Broadcast Berhasil Dikirim!'); loadHistory();
            };

            const deleteMsg = async (id) => {
                await supabase.from('chat_messages').delete().eq('id', id);
                setConfirmId(null); showToast('Pesan dihapus.'); loadHistory();
            };

            return (
                <div className="animate-fade-in-up">
                    <h3 className="font-bold text-2xl mb-2 text-yellow-400">Broadcast Pengumuman Lebah 🐝</h3>
                    <p className="text-slate-400 mb-6">Pesan yang dikirim dari sini akan muncul sebagai pop-up besar di layar semua peserta secara realtime.</p>
                    
                    <form onSubmit={sendBroadcast} className="bg-slate-800 p-6 rounded-2xl border border-yellow-500/30 mb-8">
                        <textarea required value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Tuliskan pengumuman yang ingin di broadcast..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white font-bold h-32 outline-none focus:border-yellow-400 mb-4"></textarea>
                        <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-4 rounded-xl text-lg shadow-lg">KIRIM BROADCAST SEKARANG</button>
                    </form>

                    <h4 className="font-bold text-xl mb-4 text-white">Riwayat Broadcast</h4>
                    <div className="space-y-3 h-64 overflow-y-auto custom-scrollbar pr-2">
                        {history.length === 0 && <p className="text-slate-400">Belum ada riwayat pesan.</p>}
                        {history.map(h => (
                            <div key={h.id} className="bg-slate-800 p-4 rounded-xl flex justify-between items-center border border-slate-700">

                                </div>
                                <button onClick={() => confirmId === h.id ? deleteMsg(h.id) : setConfirmId(h.id)} className={`px-4 py-2 rounded-lg text-sm font-bold transition ${confirmId === h.id ? 'bg-red-600 text-white' : 'bg-red-500/20 text-red-400 hover:bg-red-500/40'}`}>
                                    {confirmId === h.id ? 'Yakin Hapus?' : 'Hapus'}
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function QuizRunner({ quiz, setView, user, userName }) {
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [essayAnswer, setEssayAnswer] = useState('');
            const [result, setResult] = useState(null);
            
            const [danaNumber, setDanaNumber] = useState('');
            const [claimStatus, setClaimStatus] = useState('');

            useEffect(() => { const fetchQ = async () => { const { data } = await supabase.from('questions').select('*').eq('quiz_id', quiz.id); if (data) setQuestions(data); }; fetchQ(); }, [quiz.id]);

            const handleSubmit = async () => {
                if (quiz.quiz_type === 'ESSAY') {
                    await supabase.from('attempts').insert({ quiz_id: quiz.id, user_id: user.id, score: 0, total_points: 1000, percentage: 0, essay_answer: essayAnswer, review_status: 'menunggu_pemeriksaan' });
                    setResult({ type: 'essay_submitted' });
                } else {
                    let earnedScore = 0;
                    questions.forEach(q => { if (answers[q.id] === q.correct_answer) earnedScore += (q.points || 0); });
                    
                    // 1. Simpan nilai kuis ini ke attempts (sehingga terakumulasi di Papan Skor)
                    await supabase.from('attempts').insert({ quiz_id: quiz.id, user_id: user.id, score: earnedScore, total_points: 1000, percentage: earnedScore, review_status: 'selesai' });
                    
                    // 2. Hitung TOTAL AKUMULASI POIN PESERTA INI DARI SEMUA KUIS
                    const { data: allAttempts } = await supabase.from('attempts').select('score').eq('user_id', user.id);
                    const totalCumulativeScore = allAttempts.reduce((sum, att) => sum + (att.score || 0), 0);

                    // 3. Cek Pemenang (Total Poin >= 1000)
                    if (totalCumulativeScore >= 1000) {
                        const { count } = await supabase.from('reward_claims').select('id', { count: 'exact' }); // Cek total hadiah dibagikan sesi ini
                        if (count < 3) setResult({ type: 'mcq_winner', score: totalCumulativeScore });
                        else setResult({ type: 'mcq_late_winner', score: totalCumulativeScore });
                    } else {
                        setResult({ type: 'mcq_done', score: totalCumulativeScore });
                    }
                }
            };

            const submitClaim = async (e) => {
                e.preventDefault();
                await supabase.from('reward_claims').insert({ quiz_id: quiz.id, user_id: user.id, user_name: userName, quiz_title: quiz.title, phone_or_dana: danaNumber, reward_amount: quiz.reward_amount });
                setClaimStatus('berhasil');
            };

            if (questions.length === 0) return <div className="text-center py-20 animate-pulse font-bold text-xl">Menyiapkan Arena Balapan...</div>;

            if (result) {
                if (result.type === 'essay_submitted') {
                    return (
                        <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center border-t-4 border-t-brand-500 shadow-2xl animate-fade-in-up">
                            <div className="text-7xl mb-6">⏳</div>
                            <h2 className="text-3xl font-bubble mb-4 text-white">Jawaban Terkirim!</h2>
                            <p className="text-slate-300 mb-8 font-semibold">Admin akan memeriksa essay Anda. Jawaban yang tepat akan menambahkan poin ke Papan Skor Anda!</p>
                            <button onClick={()=>setView('home')} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg transition">Kembali ke Beranda</button>
                        </div>
                    );
                }

                if (result.type === 'mcq_winner') {
                    return (
                        <div className="max-w-xl mx-auto mt-10 glass-card p-10 rounded-3xl text-center border-4 border-yellow-400 shadow-[0_0_50px_rgba(250,204,21,0.3)] animate-fade-in-up">
                            {claimStatus === 'berhasil' ? (
                                <div>
                                    <div className="text-8xl mb-6">✅</div>
                                    <h2 className="text-4xl font-bubble text-green-400 mb-4">Klaim Berhasil!</h2>
                                    <p className="text-lg text-slate-300 font-semibold mb-8">Admin akan segera mengirimkan saldo DANA / Pulsa Anda. Terima kasih telah berpartisipasi!</p>
                                    <button onClick={()=>setView('home')} className="bg-slate-800 text-white px-8 py-4 rounded-xl font-bold w-full text-xl shadow-lg">Kembali ke Arena</button>
                                </div>
                            ) : (
                                <div>
                                    <div className="text-8xl mb-6 animate-bounce">🏆</div>
                                    <h2 className="text-4xl font-bubble text-yellow-400 mb-2 drop-shadow-md">SELAMAT! ANDA JUARA!</h2>
                                    <p className="text-xl text-white font-bold mb-6 bg-slate-800 p-4 rounded-xl">Total Poin Terkumpul: {result.score} Pts 🎯</p>
                                    <p className="text-slate-300 mb-8 font-semibold">Anda berhasil mencapai target 1000 Poin dan masuk dalam kuota 3 pemenang tercepat. Segera masukkan nomor DANA/Pulsa Anda!</p>
                                    <form onSubmit={submitClaim} className="space-y-4">
                                        <input type="number" required value={danaNumber} onChange={e=>setDanaNumber(e.target.value)} placeholder="Masukkan Nomor DANA / HP Anda..." className="w-full bg-slate-900 border-2 border-yellow-400 rounded-2xl p-5 text-white font-bold text-xl outline-none focus:bg-slate-800 transition text-center shadow-inner" />
                                        <button type="submit" className="w-full bg-gradient-to-r from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 text-slate-900 font-black py-5 rounded-2xl text-2xl shadow-[0_0_20px_rgba(250,204,21,0.6)] transform hover:scale-105 transition-all">AMBIL HADIAH SAYA!</button>
                                    </form>
                                </div>
                            )}
                        </div>
                    );
                }

                if (result.type === 'mcq_late_winner') {
                    return (
                        <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center border-t-4 border-t-yellow-400 animate-fade-in-up">
                            <div className="text-7xl mb-6">😥</div>
                            <h2 className="text-3xl font-bubble text-white mb-4">Total Poin: {result.score} Pts</h2>
                            <p className="text-yellow-400 font-bold text-xl mb-4">Sayang Sekali...</p>
                            <p className="text-slate-300 mb-8 font-semibold leading-relaxed">Anda berhasil mencapai 1000 poin, namun <span className="text-white">kuota 3 pemenang pertama sudah habis diisi oleh peserta yang lebih cepat.</span></p>
                            <button onClick={()=>setView('home')} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg transition">Tunggu Sesi Berikutnya</button>
                        </div>
                    );
                }

                if (result.type === 'mcq_done') {
                    return (
                        <div className="max-w-lg mx-auto mt-10 glass-card p-10 rounded-3xl text-center border-t-4 border-t-brand-500 animate-fade-in-up">
                            <div className="text-7xl mb-6">🎯</div>
                            <h2 className="text-3xl font-bubble text-white mb-4">Total Poin Saat Ini: {result.score}</h2>
                            <p className="text-slate-300 mb-8 font-semibold text-lg">Poin dari sesi ini telah ditambahkan ke Papan Skor Anda. Terus kerjakan sesi selanjutnya untuk mencapai target <span className="text-yellow-400">1000 Poin</span>!</p>
                            <button onClick={()=>setView('home')} className="w-full bg-brand-600 hover:bg-brand-500 font-bold text-white py-4 rounded-xl shadow-lg transition transform hover:-translate-y-1 text-lg">Ikuti Sesi Berikutnya</button>
                        </div>
                    );
                }
            }

            const curQ = questions[currentIndex];
            return (
                <div className="max-w-2xl mx-auto mt-4 animate-fade-in-up">
                    <div className="flex justify-between items-center mb-4">
                        <div className="text-slate-400 font-bold bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">Soal {currentIndex + 1} / {questions.length}</div>
                        {quiz.quiz_type === 'MCQ' && <div className="text-yellow-400 font-bold bg-yellow-500/10 border border-yellow-500/20 px-4 py-2 rounded-xl">Target: {curQ.points} Pts</div>}
                    </div>
                    
                    <div className="glass-card p-6 md:p-10 rounded-3xl mb-6 shadow-2xl border border-slate-700/50">
                        <h3 className="text-2xl md:text-3xl font-bold text-white mb-8 leading-snug">{curQ.question}</h3>
                        {quiz.quiz_type === 'ESSAY' ? (
                            <textarea value={essayAnswer} onChange={e=>setEssayAnswer(e.target.value)} placeholder="Tuliskan jawaban terbaikmu di sini..." className="w-full h-48 bg-slate-900 rounded-2xl p-6 text-white text-lg outline-none focus:border-brand-500 border border-transparent shadow-inner"></textarea>
                        ) : (
                            <div className="space-y-4">
                                {['option_a', 'option_b', 'option_c', 'option_d'].map((k, i) => {
                                    const val = curQ[k]; const isSel = answers[curQ.id] === val;
                                    return (
                                        <button key={i} onClick={()=>setAnswers(p=>({...p, [curQ.id]: val}))} className={`w-full text-left p-5 rounded-2xl border-2 transition-all duration-200 flex items-center gap-4 ${isSel ? 'border-brand-500 bg-brand-500/20 shadow-[0_0_20px_rgba(14,165,233,0.3)] transform scale-[1.02]' : 'border-slate-700 bg-slate-800/80 hover:border-slate-500 hover:bg-slate-700'}`}>
                                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isSel ? 'border-brand-400' : 'border-slate-500'}`}>
                                                {isSel && <div className="w-3 h-3 bg-brand-400 rounded-full"></div>}
                                            </div>
                                            <span className="text-xl text-white font-medium">{val}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                    
                    <div className="flex gap-4">
                        {currentIndex > 0 && <button onClick={()=>setCurrentIndex(p=>p-1)} className="px-6 py-4 rounded-2xl font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Kembali</button>}
                        
                        {currentIndex < questions.length - 1 ? (
                            <button onClick={()=>setCurrentIndex(p=>p+1)} className="flex-1 py-4 rounded-2xl font-bold bg-brand-600 hover:bg-brand-500 text-white text-xl shadow-lg transition">Lanjut</button>
                        ) : (
                            <button onClick={handleSubmit} className="flex-1 py-4 rounded-2xl font-bold bg-gradient-to-r from-green-500 to-green-600 hover:from-green-400 hover:to-green-500 text-white text-xl shadow-lg transform hover:-translate-y-1 transition-all">Selesai & Kumpulkan!</button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
